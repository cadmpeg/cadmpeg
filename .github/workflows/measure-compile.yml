name: Measure compile
on:
  push:
    branches: [measure/compile-profile]
permissions:
  contents: read
jobs:
  ir:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/pinned-rust
      - name: Build dependencies of cadmpeg-ir
        run: CARGO_BUILD_JOBS=4 cargo build -q -p cadmpeg-core -p cadmpeg-derive --features cadmpeg-core/schema,cadmpeg-core/test-support
      - name: Install rustfilt
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: rustfilt
      - name: Compile cadmpeg-ir with time-passes and LLVM IR
        env:
          RUSTC_BOOTSTRAP: "1"
          CARGO_BUILD_JOBS: "1"
        run: |
          (while sleep 15; do free -m | awk 'NR==2 {print "mem used " $3 " MiB"}'; done) &
          /usr/bin/time -v cargo rustc -p cadmpeg-ir --lib --features schema,examples -- -Z time-passes --emit=llvm-ir,link 2>&1 | grep -v '^\s*$' | awk '{ if ($0 ~ /time:/) { split($0,a," "); } print }' | grep -E 'time:|Maximum resident|Elapsed|error' | sort -t: -k2 | tail -80
      - name: Largest functions in cadmpeg-ir LLVM IR
        run: |
          ll=$(ls -S target/debug/deps/cadmpeg_ir-*.ll | head -1); ls -la $ll
          python3 .github/measure/llvm_lines.py "$ll"
