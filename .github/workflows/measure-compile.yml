name: Measure compile
on:
  push:
    branches: [measure/compile-profile]
permissions:
  contents: read
jobs:
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/pinned-rust
      - name: Install rustfilt
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: rustfilt
      - name: Build dependencies of cadmpeg-ir
        run: CARGO_BUILD_JOBS=4 cargo build -q -p cadmpeg-core -p cadmpeg-derive --features cadmpeg-core/schema,cadmpeg-core/test-support
      - name: Compile cadmpeg-ir at opt-level 0 to LLVM IR
        env:
          CARGO_BUILD_JOBS: "1"
        run: |
          (while sleep 10; do free -m | awk 'NR==2 {print "mem used " $3 " MiB"}'; done) &
          /usr/bin/time -v cargo rustc -p cadmpeg-ir --lib --features schema,examples -- -C opt-level=0 -C debuginfo=0 --emit=llvm-ir 2>&1 | grep -E 'Maximum resident|Elapsed|^error' || true
      - name: Largest functions in cadmpeg-ir LLVM IR
        run: |
          ll=$(ls -S target/debug/deps/cadmpeg_ir-*.ll | head -1); ls -la $ll
          python3 .github/measure/llvm_categories.py "$ll"
