# One-click release for cadmpeg.
#
# Dispatch this workflow (Actions tab -> Cut release -> Run workflow) with the
# target version, e.g. 0.1.5. It performs the entire release in a single run:
#
#   1. Requires a successful CI run on the main commit it releases, and waits
#      for that run while it is queued or in progress.
#   2. Validates the version (must be a strict upgrade; tag must not exist).
#   3. Bumps the workspace manifest and refreshes Cargo.lock.
#   4. Runs the repository policy gate on the bumped manifests.
#   5. Commits the bump directly to main.
#   6. Waits for the CI run on the bump commit. The bump changes Cargo.toml, so
#      that run is the full gate on Linux, macOS, and Windows.
#   7. Tags the bump commit, which triggers the Release workflow (release.yml)
#      that builds artifacts and creates the GitHub Release.
#
# If the CI run on the bump commit fails, nothing is tagged. Fix main, then
# dispatch this workflow again with the next version.
#
# WHY A GITHUB APP TOKEN, NOT GITHUB_TOKEN:
# The tag push MUST be authenticated with a GitHub App installation token. A tag
# pushed by the default GITHUB_TOKEN is deliberately ignored by GitHub's event
# system, so release.yml (on: push: tags) would never fire. This is a hard
# GitHub rule to prevent workflows from recursively triggering workflows; it is
# separate from the "Allow GitHub Actions to create and approve pull requests"
# org/repo setting and cannot be toggled off.
#
# ONE-TIME PREREQUISITES:
#   - Create a GitHub App (cadmpeg org -> Settings -> Developer settings ->
#     GitHub Apps -> New) with Repository permissions: Contents = Read and
#     write. Nothing else is needed (the bump touches only Cargo.toml/Cargo.lock,
#     never workflow files, so no Workflows permission is required).
#   - Install that App on the cadmpeg/cadmpeg repository.
#   - Generate a private key for the App.
#   - Add two repository (or org) secrets:
#       RELEASE_APP_ID          -> the App's numeric App ID
#       RELEASE_APP_PRIVATE_KEY -> the full .pem private key contents
name: Cut release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target release version, e.g. 0.1.5 (a leading v is stripped)"
        required: true
        type: string

# The default GITHUB_TOKEN needs no contents write access: every push below
# uses the GitHub App token instead. `actions: write` re-runs a superseded CI run.
permissions:
  contents: read
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          # Check out with the App token so the later commit and tag pushes are
          # authenticated as the App and therefore trigger release.yml.
          token: ${{ steps.app-token.outputs.token }}

      - name: Require a successful CI run on the released commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          while :; do
            passed="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${sha}&status=success" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | length')"
            test "${passed}" -gt 0 && break
            pending="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${sha}" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .status != "completed")] | length')"
            if [[ "${pending}" -eq 0 ]]; then
              echo "::error::CI has not passed on main HEAD ${sha}." >&2
              exit 1
            fi
            echo "Waiting for CI on ${sha}"
            sleep 60
          done

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set workspace version
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          version="${{ inputs.version }}"
          version="${version#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          current="$(
            cargo metadata --no-deps --format-version 1 |
              jq --raw-output '.packages[] | select(.name == "cadmpeg") | .version'
          )"

          # Refuse a no-op or a downgrade: the new version must sort strictly
          # after the current one.
          lowest="$(printf '%s\n%s\n' "${current}" "${version}" | sort --version-sort | head -n1)"
          if [[ "${version}" == "${current}" || "${lowest}" != "${current}" ]]; then
            echo "requested version ${version} is not greater than current ${current}" >&2
            exit 1
          fi

          # Refuse to clobber an existing tag.
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "tag v${version} already exists on origin" >&2
            exit 1
          fi

          python3 scripts/set-workspace-version.py "${version}"
          cargo update --workspace

          # Coherence guard: the manifest version dist matches the tag against
          # must now equal the requested version.
          manifest_version="$(
            cargo metadata --no-deps --format-version 1 |
              jq --raw-output '.packages[] | select(.name == "cadmpeg") | .version'
          )"
          if [[ "${manifest_version}" != "${version}" ]]; then
            echo "manifest version ${manifest_version} does not match requested ${version}" >&2
            exit 1
          fi

      - name: Repository policy gate
        run: |
          set -euo pipefail
          python3 -m unittest -q scripts/test_pre_commit.py
          python3 scripts/check-doc-anchors.py
          python3 -m unittest -v scripts/test_check_source_policy.py
          python3 scripts/check-source-policy.py
          python3 -m unittest -v scripts/test_check_resource_caps.py
          python3 scripts/check-resource-caps.py
          python3 scripts/check-deny-census.py
          python3 -m unittest -v scripts/test_check_golden_coverage_floors.py
          python3 scripts/check-golden-coverage-floors.py
          python3 -m unittest -v scripts/test_check_codec_facade.py
          python3 scripts/check-codec-facade.py
          python3 -m unittest discover -q -s scripts -p test_check_dialects.py
          python3 scripts/check-dialects.py
          python3 -m unittest discover -q -s scripts -p test_check_dialect_support.py
          python3 scripts/check-dialect-support.py
          python3 -m unittest discover -q -s scripts -p test_render_format_support.py
          python3 scripts/render-format-support.py --check

      - name: Commit and push
        id: commit
        shell: bash
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          version="${{ steps.bump.outputs.version }}"

          # Attribute the commit to the App's bot identity so it shows as
          # verified and authored by the App rather than a stray user.
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq '.id')"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          git add Cargo.toml Cargo.lock
          # Sign off under the App's bot identity so the release commit satisfies
          # the DCO requirement (CONTRIBUTING.md: every commit is signed off),
          # independent of the CI check's release-file exemption.
          git commit -s -m "Bump workspace version to ${version}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for CI on the bump commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          while :; do
            run="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&event=push" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")][0] // {} | "\(.id) \(.status) \(.conclusion)"')"
            read -r id status conclusion <<<"${run}"
            case "${status}/${conclusion}" in
              completed/success) break ;;
              # A newer push to main replaced the queued run.
              completed/cancelled) gh api -X POST "repos/${{ github.repository }}/actions/runs/${id}/rerun" ;;
              completed/*)
                echo "::error::CI failed on ${SHA}; nothing was tagged. Fix main, then release the next version." >&2
                exit 1
                ;;
            esac
            sleep 60
          done

      - name: Tag the bump commit
        shell: bash
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          git tag "v${version}" "${SHA}"
          git push origin "v${version}"
