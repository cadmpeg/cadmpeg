# One-click release for cadmpeg.
#
# Dispatch this workflow (Actions tab -> Cut release -> Run workflow) with the
# target version, e.g. 0.1.5. It performs the entire release in a single run:
#
#   1. Lands a version bump on origin/main. Each attempt waits for CI on the
#      current tip, re-fetches, and starts again if that tip moved. It then
#      validates the version (strict upgrade, tag absent), regenerates the
#      Cargo.toml and Cargo.lock bump on that tip, commits, and pushes. A
#      rejected push starts a new attempt. Concurrent merges to main are
#      expected.
#   2. Waits for the CI run on the bump commit. The bump changes Cargo.toml, so
#      that run is the full gate on Linux, macOS, and Windows.
#   3. Tags the bump commit, which triggers the Release workflow (release.yml)
#      that builds artifacts and creates the GitHub Release. The tag push mints
#      its own App token: an installation token expires after one hour, and
#      the CI wait in step 2 alone can take longer than that.
#
# If the CI run on the bump commit fails, nothing is tagged. Fix main, then
# dispatch this workflow again with the next version.
#
# WHY A GITHUB APP TOKEN, NOT GITHUB_TOKEN:
# The tag push MUST be authenticated with a GitHub App installation token. A tag
# pushed by the default GITHUB_TOKEN is deliberately ignored by GitHub's event
# system, so release.yml (on: push: tags) would never fire. This is a hard
# GitHub rule to prevent workflows from recursively triggering workflows; it is
# separate from the "Allow GitHub Actions to create and approve pull requests"
# org/repo setting and cannot be toggled off.
#
# ONE-TIME PREREQUISITES:
#   - Create a GitHub App (cadmpeg org -> Settings -> Developer settings ->
#     GitHub Apps -> New) with Repository permissions: Contents = Read and
#     write. Nothing else is needed (the bump touches only Cargo.toml/Cargo.lock,
#     never workflow files, so no Workflows permission is required).
#   - Install that App on the cadmpeg/cadmpeg repository.
#   - Generate a private key for the App.
#   - Add two repository (or org) secrets:
#       RELEASE_APP_ID          -> the App's numeric App ID
#       RELEASE_APP_PRIVATE_KEY -> the full .pem private key contents
name: Cut release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target release version, e.g. 0.1.5 (a leading v is stripped)"
        required: true
        type: string

concurrency:
  group: cut-release
  cancel-in-progress: false

# The default GITHUB_TOKEN needs no contents write access: every push below
# uses the GitHub App token instead. `actions: write` re-runs a superseded CI run.
permissions:
  contents: read
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          # Check out with the App token so the bump push is authenticated as
          # the App, which may push to main.
          token: ${{ steps.app-token.outputs.token }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Land version bump on main
        id: commit
        shell: bash
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${VERSION#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq '.id')"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          wait_for_ci() {
            local sha="$1"
            while :; do
              passed="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${sha}&status=success" \
                --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | length')"
              if [[ "${passed}" -gt 0 ]]; then
                return 0
              fi
              pending="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${sha}" \
                --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .status != "completed")] | length')"
              failed="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${sha}" \
                --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .status == "completed" and .conclusion != "success")] | length')"
              if [[ "${pending}" -eq 0 && "${failed}" -gt 0 ]]; then
                # A push to main cancels the in-progress main run, and the
                # next main run tests every commit since the last passing run.
                git fetch origin main
                if [[ "$(git rev-parse origin/main)" != "${sha}" ]]; then
                  echo "CI did not pass on ${sha}, and origin/main moved past it"
                  return 0
                fi
                echo "::error::CI has not passed on main HEAD ${sha}." >&2
                return 1
              fi
              echo "Waiting for CI on ${sha}"
              sleep 60
            done
          }

          while :; do
            git fetch origin main
            git reset --hard origin/main

            wait_for_ci "$(git rev-parse HEAD)"

            git fetch origin main
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
              echo "origin/main moved during the CI wait; restarting"
              continue
            fi

            current="$(
              cargo metadata --no-deps --format-version 1 |
                jq --raw-output '.packages[] | select(.name == "cadmpeg") | .version'
            )"
            lowest="$(printf '%s\n%s\n' "${current}" "${version}" | sort --version-sort | head -n1)"
            if [[ "${version}" == "${current}" || "${lowest}" != "${current}" ]]; then
              echo "requested version ${version} is not greater than current ${current}" >&2
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
              echo "tag v${version} already exists on origin" >&2
              exit 1
            fi

            python3 scripts/set-workspace-version.py "${version}"
            cargo update --workspace
            manifest_version="$(
              cargo metadata --no-deps --format-version 1 |
                jq --raw-output '.packages[] | select(.name == "cadmpeg") | .version'
            )"
            if [[ "${manifest_version}" != "${version}" ]]; then
              echo "manifest version ${manifest_version} does not match requested ${version}" >&2
              exit 1
            fi

            git add Cargo.toml Cargo.lock
            git commit -s -m "Bump workspace version to ${version}"
            if push_out="$(git push origin HEAD:main 2>&1)"; then
              printf '%s\n' "${push_out}"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              break
            fi
            printf '%s\n' "${push_out}"
            if grep -Eq '\[rejected\]|non-fast-forward' <<<"${push_out}"; then
              echo "origin/main moved during the bump; restarting"
              continue
            fi
            exit 1
          done

      - name: Wait for CI on the bump commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          while :; do
            run="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&event=push" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")][0] // {} | "\(.id) \(.status) \(.conclusion)"')"
            read -r id status conclusion <<<"${run}"
            case "${status}/${conclusion}" in
              completed/success) break ;;
              # A newer push to main cancelled the run before it finished.
              completed/cancelled) gh api -X POST "repos/${{ github.repository }}/actions/runs/${id}/rerun" ;;
              completed/*)
                echo "::error::CI failed on ${SHA}; nothing was tagged. Fix main, then release the next version." >&2
                exit 1
                ;;
            esac
            sleep 60
          done

      - name: Mint GitHub App token for the tag push
        id: tag-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Tag the bump commit
        shell: bash
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          TOKEN: ${{ steps.tag-token.outputs.token }}
        run: |
          set -euo pipefail
          version="${{ steps.commit.outputs.version }}"
          git tag "v${version}" "${SHA}"
          # The empty extraheader drops the checkout's expired token so the
          # push authenticates with the fresh one in the URL.
          git -c http.https://github.com/.extraheader= push \
            "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            "refs/tags/v${version}"
