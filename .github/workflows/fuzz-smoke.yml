name: Fuzz smoke

on:
  schedule:
    # Nightly at 03:17 UTC (off the hour to avoid the cron rush).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Compile-only check that the fuzz targets still build on the Rust
  # nightly toolchain. Non-blocking for regular development.
  fuzz-smoke:
    name: fuzz target smoke build (rust nightly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # `+nightly` overrides the repo's `rust-toolchain.toml` stable pin.
      # cargo-fuzz needs nightly-only flags (`-Zsanitizer=address`, sancov
      # coverage), and the proxy propagates `RUSTUP_TOOLCHAIN` to the inner
      # `cargo build` it spawns.
      #
      # CARGO_BUILD_JOBS=2: ASAN-instrumented release compiles of the codec
      # crates peak at several GB per rustc process. The ubuntu-latest runner
      # has 4 cores and 16 GB, and the `jobs = 6` cap in .cargo/config.toml
      # lets six of them run at once, so the kernel OOM-killer terminates the
      # runner worker mid-build ("shutdown signal", exit 143). The
      # cargo-job-count action used by other workflows would still allow 4,
      # which is too close to the limit for instrumented builds.
      - name: Build fuzz targets (no run)
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo +nightly fuzz build --fuzz-dir crates/cadmpeg-fuzz

      - name: Run each fuzz target briefly
        run: |
          for t in $(cargo +nightly fuzz list --fuzz-dir crates/cadmpeg-fuzz); do
            seed_dir="crates/cadmpeg-fuzz/seeds/$t"
            if [ ! -d "$seed_dir" ] && [ -d "seeds/$t" ]; then
              seed_dir="seeds/$t"
            fi
            if [ -d "$seed_dir" ]; then
              cargo +nightly fuzz run "$t" "$seed_dir" --fuzz-dir crates/cadmpeg-fuzz -- -max_total_time=60
            else
              cargo +nightly fuzz run "$t" --fuzz-dir crates/cadmpeg-fuzz -- -max_total_time=60
            fi
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: crates/cadmpeg-fuzz/artifacts/
