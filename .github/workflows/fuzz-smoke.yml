name: Fuzz smoke

on:
  schedule:
    # Nightly at 03:17 UTC (off the hour to avoid the cron rush).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Compile-only check that the fuzz targets still build on the Rust
  # nightly toolchain. Non-blocking for regular development.
  fuzz-smoke:
    name: fuzz target smoke build (rust nightly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Restore fuzz corpus
        id: fuzz-corpus
        uses: actions/cache/restore@v6
        with:
          path: crates/cadmpeg-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # `+nightly` overrides the repo's `rust-toolchain.toml` stable pin.
      # cargo-fuzz needs nightly-only flags (`-Zsanitizer=address`, sancov
      # coverage), and the proxy propagates `RUSTUP_TOOLCHAIN` to the inner
      # `cargo build` it spawns.
      #
      # CARGO_BUILD_JOBS=1: ASAN-instrumented release compiles peak at 14.8 GiB
      # per rustc process (cadmpeg_codec_f3d; cadmpeg_ir 13.1 GiB), and two
      # overlapping instrumented compiles exceed the 16 GB of the
      # ubuntu-latest runner, so the kernel OOM-killer terminates the runner
      # worker mid-build ("shutdown signal", exit 143). Serializing bounds
      # build RSS by the single worst crate, and the swap step below absorbs
      # the transient overshoot. Peaks this close to the limit may still need
      # a larger runner; move this job to one if the build OOMs again.
      - name: Create build swap
        run: |
          set -euo pipefail
          sudo fallocate -l 24G /build-swap
          sudo chmod 600 /build-swap
          sudo mkswap /build-swap
          sudo swapon /build-swap

      - name: Build fuzz targets (no run)
        env:
          CARGO_BUILD_JOBS: "1"
        run: cargo +nightly fuzz build --fuzz-dir crates/cadmpeg-fuzz

      - name: Run each fuzz target briefly
        run: |
          # cargo-fuzz lists every [[bin]], including seed generators under
          # src/bin/. Those are Cargo utilities, not libFuzzer harnesses
          # (crates/cadmpeg-fuzz/README.md). Skip bins that have no matching
          # fuzz_targets/<name>.rs file.
          failed=0
          for t in $(cargo +nightly fuzz list --fuzz-dir crates/cadmpeg-fuzz); do
            if [ ! -f "crates/cadmpeg-fuzz/fuzz_targets/${t}.rs" ]; then
              continue
            fi
            seed_dir="crates/cadmpeg-fuzz/seeds/$t"
            corpus_dir="crates/cadmpeg-fuzz/corpus/$t"
            mkdir -p "$corpus_dir"
            extra=()
            dict="crates/cadmpeg-fuzz/dictionaries/${t}.dict"
            if [ ! -f "$dict" ]; then
              prefix="${t%%_*}"
              dict="crates/cadmpeg-fuzz/dictionaries/${prefix}.dict"
            fi
            if [ -f "$dict" ]; then
              extra+=("-dict=$dict")
            fi
            run_dirs=("$corpus_dir")
            if [ -d "$seed_dir" ]; then
              run_dirs+=("$seed_dir")
            fi
            # Continue after a failing target so one crash cannot hide the rest.
            # `if ! cmd` does not trip `set -e`.
            if ! cargo +nightly fuzz run "$t" "${run_dirs[@]}" --fuzz-dir crates/cadmpeg-fuzz -- \
              -max_total_time=60 -rss_limit_mb=2048 "${extra[@]}"; then
              echo "fuzz target $t failed" >&2
              failed=1
            fi
          done
          exit "$failed"

      - name: Save fuzz corpus
        if: always()
        run: |
          set -euo pipefail
          mkdir -p crates/cadmpeg-fuzz/corpus
          size_mb=$(du -sm crates/cadmpeg-fuzz/corpus | cut -f1)
          echo "fuzz corpus size: ${size_mb} MiB"
          if [ "$size_mb" -gt 1024 ]; then
            echo "corpus exceeds 1 GiB; not caching"
            rm -rf crates/cadmpeg-fuzz/corpus
            mkdir -p crates/cadmpeg-fuzz/corpus
          fi

      - name: Persist fuzz corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: crates/cadmpeg-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: crates/cadmpeg-fuzz/artifacts/
