name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  features:
    name: lab features
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/pinned-rust
      - id: profiles
        uses: ./.github/actions/cargo-profile-key
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: features
          prefix-key: v0-rust-${{ steps.profiles.outputs.hash }}
          save-if: false
      - uses: ./.github/actions/cargo-job-count
      - name: lab
        run: |
          set +e
          t() { local s=$(date +%s); "$@" 2>&1 | grep -E "^\s+(Compiling|Checking) cadmpeg|^error|test result" | sed 's/^/    /'; echo "TIME $(( $(date +%s) - s ))s :: $*"; }
          t cargo test -v -p cadmpeg-core -p cadmpeg-ir -p cadmpeg-asm --features cadmpeg-ir/schema,cadmpeg-asm/schema --lib
          t cargo test -v -p cadmpeg --no-default-features --features step,cadmpeg-ir/schema --test integration delayed_step_archive_root_inspects_and_loads_with_step
          t cargo test -v -p cadmpeg --no-default-features --features step --test integration delayed_step_archive_root_inspects_and_loads_with_step
          t cargo check -v -p cadmpeg --no-default-features --features sldprt
          t cargo build -v -p cadmpeg --no-default-features --features sldprt
          t cargo test -v -p cadmpeg --no-default-features --features sldprt --no-run
          true

  lint:
    name: lab clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/pinned-rust
        with:
          components: rustfmt, clippy
      - id: profiles
        uses: ./.github/actions/cargo-profile-key
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          prefix-key: v0-rust-${{ steps.profiles.outputs.hash }}
          save-if: false
      - uses: ./.github/actions/cargo-job-count
      - name: fmt
        run: time cargo fmt --all --check
      - name: clippy timings
        run: |
          time cargo clippy -q --workspace --all-targets --timings
          python3 - <<'PYX'
          import glob, json, re
          html = open(sorted(glob.glob('target/cargo-timings/cargo-timing-*.html'))[-1]).read()
          data = json.loads(re.search(r'const UNIT_DATA = (\[.*?\]);', html, re.S).group(1))
          data.sort(key=lambda u: -u['duration'])
          total = sum(u['duration'] for u in data)
          print('units', len(data), 'total unit seconds', round(total))
          for u in data[:40]:
              print(f"{u['duration']:7.1f} start {u['start']:7.1f} {u['name']} {u.get('target','')} {u.get('mode','')}")
          end = max(u['start'] + u['duration'] for u in data)
          print('wall', round(end))
          PYX
