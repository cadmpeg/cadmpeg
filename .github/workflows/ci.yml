name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede in-flight runs when the same ref is pushed again; PR iteration
# otherwise runs stale and current pipelines to completion side by side.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Throwaway runners get nothing from incremental compilation or debuginfo;
  # both slow the build (debuginfo dominates MSVC link time in particular)
  # and inflate the cargo cache. `[profile.test]` in Cargo.toml sets `debug`
  # explicitly, and a manifest value beats one inherited from `dev`, so the
  # test profile needs its own variable to reach the test binaries. The cost
  # is `file:line` in a CI backtrace; local runs keep it.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    name: Select affected crates
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.scope.outputs.packages }}
      rust: ${{ steps.scope.outputs.rust }}
      features: ${{ steps.scope.outputs.features }}
      schema: ${{ steps.scope.outputs.schema }}
      iges: ${{ steps.scope.outputs.iges }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - name: Select gate inputs
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 scripts/ci_scope.py --base "$BASE" --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_scope.py --full --github-output "$GITHUB_OUTPUT"
          fi

  # The stable gate is three jobs rather than one long one. Clippy compiles the
  # workspace through `clippy-driver`, whose artifacts are separate from the
  # ones `cargo test` builds, so the work is additive and the steps only ever
  # queued behind each other. Splitting makes the gate's wall-clock the slowest
  # job instead of the sum of every step.
  lint:
    needs: changes
    if: ${{ always() && needs.changes.result != 'cancelled' }}
    name: fmt / clippy (stable)
    env:
      CI_PACKAGES: ${{ needs.changes.outputs.packages }}
    runs-on: ubuntu-latest
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned toolchain
        if: needs.changes.outputs.rust == 'true'
        uses: ./.github/actions/pinned-rust
        with:
          components: rustfmt, clippy

      - name: Match cargo's job count to the runner
        if: needs.changes.outputs.rust == 'true'
        uses: ./.github/actions/cargo-job-count

      - name: Cache cargo registry and target
        if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable
          save-if: false

      - name: Specification reference check
        # Open-items documents cite the specification by section and paragraph
        # start. Catches a reference that names no paragraph or several.
        run: python3 scripts/check-doc-anchors.py

      - name: Python tooling tests
        run: python3 -m unittest discover -q -s scripts -p 'test_*.py'

      - name: Source policy
        run: |
          set -euo pipefail
          python3 scripts/check-source-policy.py
          python3 scripts/check-deny-census.py
          python3 scripts/census-panic-calls.py --check

      - name: Golden coverage floors
        # Mesh-size floors in docs/golden-coverage-floors.toml. Counts may only
        # rise when fixtures are added; they must never silently fall.
        run: |
          set -euo pipefail
          python3 scripts/check-golden-coverage-floors.py

      - name: Codec facade
        # Crate-root pub items must match docs/codec-facade.toml.
        run: |
          set -euo pipefail
          python3 scripts/check-codec-facade.py

      - name: Dialect identity registry
        # Schema, id grammar, witness form, and the IGES admission lattice in
        # crates/cadmpeg-registry/docs/dialects.toml. Ids are pinned from the commit that adds them.
        run: |
          set -euo pipefail
          python3 scripts/check-dialects.py

      - name: Dialect capability registry
        # crates/cadmpeg-registry/docs/dialect-support.toml against the identity registry, the fixture
        # tree, the golden snapshots that pin each fixture's emitted dialect
        # id, and the encoders' write-target catalogs. Fixture gating lives
        # here: a row with no fixture cannot claim a read score.
        run: |
          set -euo pipefail
          python3 scripts/check-dialect-support.py

      - name: Rendered capability tables
        # Every score table in docs/format-support.md, the root README, each
        # codec crate README, and each codec lib.rs doc header is rendered from
        # the two registries. --check re-renders and compares byte for byte, so
        # a registry edit without a re-render fails here.
        run: |
          set -euo pipefail
          python3 scripts/render-format-support.py --check

      - name: Format check
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all --check

      - name: Clippy
        if: needs.changes.outputs.rust == 'true'
        # Lint levels come from `[workspace.lints]` in Cargo.toml, so no
        # trailing flags here. Trailing flags are part of the compilation
        # fingerprint, and a flagged run and a bare run evict each other's
        # cached artifacts.
        # `--all-targets` covers lib, bins, tests, and benches so test-only
        # style debt cannot hide behind crate-root cfg(test) mute lists.
        run: python3 scripts/ci_cargo.py clippy --all-targets

  test:
    needs: changes
    if: ${{ always() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    name: test (stable)
    env:
      CI_PACKAGES: ${{ needs.changes.outputs.packages }}
    runs-on: ubuntu-latest
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned toolchain
        uses: ./.github/actions/pinned-rust

      - name: Match cargo's job count to the runner
        uses: ./.github/actions/cargo-job-count

      - name: Cache cargo registry and target
        # The only stable job that writes the shared cache. It builds the
        # widest set of dependencies, and concurrent writers of one key make
        # every loser log a conflict.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Unit and integration tests
        # Compile selected packages and their dependencies before running.
        # A separate `cargo build` step would repeat that compilation.
        run: python3 scripts/ci_cargo.py test --lib --bins --tests --no-fail-fast

      - name: Bounded IGES decode and round-trip gate
        if: needs.changes.outputs.iges == 'true'
        # Give every synthesized IGES fixture independent decode, validation,
        # conversion, generated-file decode, and generated-file validation
        # deadlines under the unattended resource profile. Use the production
        # profile so the deadline measures codec behavior rather than an
        # unoptimized debug binary.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/side2/tmp/iges-l9"
          cargo build -q --release -p cadmpeg --no-default-features --features iges
          python3 scripts/verify-iges-bounded.py \
            crates/cadmpeg-codec-iges/tests/golden/fixtures \
            --cadmpeg target/release/cadmpeg \
            --limits service \
            --timeout 30 \
            --roundtrip \
            --report "$HOME/side2/tmp/iges-l9/iges-bounded-report.json"

      - name: Documentation tests
        # Reuses the library rlibs the step above built; on its own job this
        # would pay for the whole workspace again.
        run: python3 scripts/ci_cargo.py test --doc

  features:
    needs: changes
    if: ${{ always() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || needs.changes.outputs.features == 'true') }}
    name: schema / fuzz (stable)
    runs-on: ubuntu-latest
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned toolchain
        uses: ./.github/actions/pinned-rust

      - name: Match cargo's job count to the runner
        uses: ./.github/actions/cargo-job-count

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: features
          workspaces: |
            . -> target
            crates/cadmpeg-fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Schema feature
        if: needs.changes.outputs.schema == 'true'
        # The CLI enables IR schemas. This gate also checks schema assertions
        # and the core/assembly feature combinations without CLI defaults.
        run: |
          set -euo pipefail
          cargo test -q -p cadmpeg-ir -p cadmpeg-asm --features cadmpeg-ir/schema,cadmpeg-asm/schema --lib
          cargo check -q -p cadmpeg-core -p cadmpeg-asm --all-targets \
            --features cadmpeg-core/schema,cadmpeg-asm/schema

      - name: Fuzz targets compile
        # The fuzz crate declares its own `[workspace]`, so every other job
        # skips it; a refactor that moves a codec's internals silently rots the
        # harnesses' imports. A stable `check` catches that drift without the
        # nightly toolchain `cargo fuzz build` needs. `--all-targets` reaches
        # every harness and seed binary, and `--keep-going` reports all of them
        # rather than stopping at the first.
        run: |
          cargo check -q --manifest-path crates/cadmpeg-fuzz/Cargo.toml \
            --all-targets --keep-going

      - name: Fuzz crate tests
        # Runs the library and seed-generator tests, including the seed
        # decode tests that fail when a reader change stops a seed reaching
        # its decoder. Every harness under `fuzz_targets/` declares
        # `test = false`, so this builds and runs no harness.
        run: cargo test -q --manifest-path crates/cadmpeg-fuzz/Cargo.toml

      - name: Single-codec CLI feature gate
        # Per-codec optional deps must keep a one-feature binary compiling.
        run: cargo build -q -p cadmpeg --no-default-features --features sldprt

      - name: STEP-only low-confidence regression
        # This test target only exists when STEP is enabled without FCStd or F3D.
        run: cargo test -q -p cadmpeg --no-default-features --features step --test low_confidence_inspect

  # Verifies the declared MSRV floor (Cargo.toml rust-version). RUSTUP_TOOLCHAIN
  # overrides the repo's rust-toolchain.toml pin so the floor is actually tested.
  msrv:
    needs: changes
    if: ${{ always() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    name: MSRV check (1.88)
    runs-on: ubuntu-latest
    env:
      CI_PACKAGES: ${{ needs.changes.outputs.packages }}
      RUSTUP_TOOLCHAIN: "1.88"
      # `[workspace.lints]` denies warnings on every toolchain, and 1.88's lint
      # set differs from the pinned one's. This job checks compilation, not
      # lints; deny-by-default lints stay hard errors.
      RUSTFLAGS: "-A warnings"
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Match cargo's job count to the runner
        uses: ./.github/actions/cargo-job-count

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        run: python3 scripts/ci_cargo.py check

  # Byte-level codecs are the code most likely to break across platforms.
  cross-platform:
    needs: changes
    if: ${{ always() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    name: build / test (${{ matrix.os }})
    env:
      CI_PACKAGES: ${{ needs.changes.outputs.packages }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned toolchain
        uses: ./.github/actions/pinned-rust

      - name: Match cargo's job count to the runner
        uses: ./.github/actions/cargo-job-count

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Unit and integration tests
        run: python3 scripts/ci_cargo.py test --lib --bins --tests --no-fail-fast

  # RustSec advisory scan of the dependency tree.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install cargo-audit
        # Prebuilt binary; rustsec/audit-check compiled cargo-audit from
        # source on every run and dominated the pipeline's wall-clock.
        uses: taiki-e/install-action@v2.87.22
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit
