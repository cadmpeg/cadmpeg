name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Nightly full gate on every platform. It also covers what PR and push
  # scoping did not select.
  schedule:
    - cron: "13 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A PR has one group per ref, and a new push to the PR cancels its run in
# flight. Pushes to main share one group, and a merge does not cancel the push
# run in flight: main's run takes longer than the gap between merges, so
# cancelling it left main with no finished run. A merge queues behind the
# running push run and replaces the push run already queued, and the `changes`
# job widens the queued run to every commit since the last successful push run.
# The nightly and dispatched runs use the ref group, so a merge does not cancel
# the nightly full gate. A re-run of a push run gets its own group: Cut release
# re-runs a cancelled bump-commit run, and that re-run must not cancel the run
# of the newer main head, or be cancelled by it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name != 'push' && github.ref || github.run_attempt == '1' && 'push' || format('push-{0}-{1}', github.sha, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Throwaway runners get nothing from incremental compilation or debuginfo;
  # both slow the build (debuginfo dominates MSVC link time in particular)
  # and inflate the cargo cache. `[profile.test]` in Cargo.toml sets `debug`
  # explicitly, and a manifest value beats one inherited from `dev`, so the
  # test profile needs its own variable to reach the test binaries. The cost
  # is `file:line` in a CI backtrace; local runs keep it.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    name: Select affected crates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      packages: ${{ steps.scope.outputs.packages }}
      full: ${{ steps.scope.outputs.full }}
      rust: ${{ steps.scope.outputs.rust }}
      fuzz: ${{ steps.scope.outputs.fuzz }}
      codec_scope: ${{ steps.scope.outputs.codec_scope }}
      sldprt_cli: ${{ steps.scope.outputs.sldprt_cli }}
      step_cli: ${{ steps.scope.outputs.step_cli }}
      schema: ${{ steps.scope.outputs.schema }}
      iges: ${{ steps.scope.outputs.iges }}
      inventor_cli: ${{ steps.scope.outputs.inventor_cli }}
      layout: ${{ steps.scope.outputs.layout }}
      static: ${{ steps.scope.outputs.static }}
      prose_only: ${{ steps.scope.outputs.prose_only }}
      audit: ${{ steps.scope.outputs.audit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - name: Select gate inputs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mode=()
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            schedule)
              passed="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$SHA&event=schedule&status=success" \
                --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | length')"
              if [ "$passed" -gt 0 ]; then
                python3 scripts/ci_scope.py --tested --github-output "$GITHUB_OUTPUT"
                exit 0
              fi
              base=""
              ;;
            push)
              # The last successful push run tested every main commit up to its
              # head. A cancelled or failed run leaves its commits in this diff.
              mode=(--cache-writer)
              base="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha // ""' || true)"
              if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]]; then
                base=""
              elif [ "$base" = "$SHA" ]; then
                # A re-run of a commit that passed tests the commit's own change.
                base="$PUSH_BASE"
              elif [ "$(gh api "repos/$REPOSITORY/compare/$base...$SHA?per_page=1" --jq .status || true)" != ahead ]; then
                base=""
              fi
              ;;
            *) base="" ;;
          esac
          if [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ] \
              && git fetch --no-tags --depth=1 origin "$base"; then
            python3 scripts/ci_scope.py --base "$base" "${mode[@]}" --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_scope.py --full --github-output "$GITHUB_OUTPUT"
          fi

  # Python policy checks need no Rust build and run beside clippy.
  static:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || needs.changes.outputs.static == 'true') }}
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Specification reference check
        # Open-items documents cite the specification by section and paragraph
        # start. Catches a reference that names no paragraph or several.
        run: python3 scripts/check-doc-anchors.py

      - name: Open-item IDs
        # An ID repeated in one open-items document. A PR run checks the PR
        # merged into its base at the time of the run. Two PRs that take one ID
        # can both pass and merge; the main run then fails here.
        run: python3 scripts/preflight_open_items.py

      - name: Python tooling tests
        run: python3 -m unittest discover -q -s scripts -p 'test_*.py'

      - name: Source policy
        if: needs.changes.outputs.prose_only != 'true'
        run: |
          set -euo pipefail
          python3 scripts/check-source-policy.py
          python3 scripts/check-resource-caps.py
          python3 scripts/check-deny-census.py
          python3 scripts/census-panic-calls.py --check

      - name: Source policy for documentation
        if: needs.changes.outputs.prose_only == 'true'
        run: python3 scripts/check-source-policy.py --authoring-paths-only

      - name: Golden coverage floors
        # Mesh-size floors in docs/golden-coverage-floors.toml. Counts may only
        # rise when fixtures are added; they must never silently fall.
        run: |
          set -euo pipefail
          python3 scripts/check-golden-coverage-floors.py

      - name: Codec facade
        # Crate-root pub items must match docs/codec-facade.toml.
        run: |
          set -euo pipefail
          python3 scripts/check-codec-facade.py

      - name: Validation rule names
        # Every validation finding states its rule (rule!/rule_name!), and
        # every rule an admission route lists is stated by a finding.
        run: |
          set -euo pipefail
          python3 scripts/name-validation-rules.py --check

      - name: Dialect identity registry
        # Schema, id grammar, witness form, and the IGES admission lattice in
        # crates/cadmpeg-registry/docs/dialects.toml. Ids are pinned from the commit that adds them.
        run: |
          set -euo pipefail
          python3 scripts/check-dialects.py

      - name: Dialect capability registry
        # crates/cadmpeg-registry/docs/dialect-support.toml against the identity registry, the fixture
        # tree, the golden snapshots that pin each fixture's emitted dialect
        # id, and the encoders' write-target catalogs. Fixture gating lives
        # here: a row with no fixture cannot claim a read score.
        run: |
          set -euo pipefail
          python3 scripts/check-dialect-support.py

      - name: Rendered capability tables
        # Every score table in docs/format-support.md, the root README, each
        # codec crate README, and each codec lib.rs doc header is rendered from
        # the two registries. --check re-renders and compares byte for byte, so
        # a registry edit without a re-render fails here.
        run: |
          set -euo pipefail
          python3 scripts/render-format-support.py --check

  # The stable gate is three jobs rather than one long one. Clippy compiles the
  # workspace through `clippy-driver`, whose artifacts are separate from the
  # ones `cargo test` builds, so the work is additive and the steps only ever
  # queued behind each other. Splitting makes the gate's wall-clock the slowest
  # job instead of the sum of every step.
  lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    name: fmt / clippy (stable)
    env:
      CI_PACKAGES: ${{ needs.changes.outputs.packages }}
      CI_FULL: ${{ needs.changes.outputs.full }}
      CI_CODEC_FEATURES: ${{ needs.changes.outputs.codec_scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned toolchain
        uses: ./.github/actions/pinned-rust
        with:
          components: rustfmt, clippy

      - name: Hash the Cargo profiles
        id: profiles
        uses: ./.github/actions/cargo-profile-key

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          prefix-key: v0-rust-${{ steps.profiles.outputs.hash }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Match cargo's job count to the runner
        uses: ./.github/actions/cargo-job-count

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        # Lint levels come from `[workspace.lints]` in Cargo.toml, so no
        # trailing flags here. Trailing flags are part of the compilation
        # fingerprint, and a flagged run and a bare run evict each other's
        # cached artifacts.
        # `--all-targets` covers lib, bins, tests, and benches so test-only
        # style debt cannot hide behind crate-root cfg(test) mute lists.
        run: python3 scripts/ci_cargo.py clippy --all-targets

  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || (needs.changes.outputs.rust == 'true' && github.event.pull_request.draft != true)) }}
    name: test (stable)
    env:
      CI_PACKAGES: ${{ needs.changes.outputs.packages }}
      CI_FULL: ${{ needs.changes.outputs.full }}
      CI_CODEC_FEATURES: ${{ needs.changes.outputs.codec_scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned toolchain
        uses: ./.github/actions/pinned-rust

      - name: Hash the Cargo profiles
        id: profiles
        uses: ./.github/actions/cargo-profile-key

      - name: Cache cargo registry and target
        # The only stable job that writes the shared cache. It builds the
        # widest set of dependencies, and concurrent writers of one key make
        # every loser log a conflict.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable
          prefix-key: v0-rust-${{ steps.profiles.outputs.hash }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Match cargo's job count to the runner
        uses: ./.github/actions/cargo-job-count

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-nextest

      - name: Unit and integration tests
        # Compile selected packages and their dependencies before running.
        # A separate `cargo build` step would repeat that compilation. The
        # memory line every 30 seconds stays in the log if the runner stops.
        shell: bash
        run: |
          (while sleep 30; do free -m | awk 'NR==2 {m=$3} NR==3 {print "memory used " m " MiB, swap used " $3 " MiB"}'; done) &
          python3 scripts/ci_cargo.py nextest run --bins --tests --no-fail-fast --timings

      - name: Upload build timings
        # Cargo's per-unit compile report: which crates sit on the critical
        # path and how many units ran at once.
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timing-linux
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore

      - name: Inventor CLI evidence tests
        if: needs.changes.outputs.inventor_cli == 'true'
        # These two tooling tests need the default CLI built by the Rust gate.
        # The static job runs the remaining Python tests without a CLI build.
        run: |
          test -x target/debug/cadmpeg
          python3 -m unittest -q \
            scripts.test_inventor_evidence.EvidenceTest.test_primary_carrier_parity_when_cli_is_built \
            scripts.test_inventor_evidence.EvidenceTest.test_cli_sweep_is_per_profile_and_deterministic

      - name: Bounded IGES decode and round-trip gate
        if: needs.changes.outputs.iges == 'true'
        # Give every synthesized IGES fixture independent decode, validation,
        # conversion, generated-file decode, and generated-file validation
        # deadlines under the unattended resource profile. Use the debug CLI
        # that the Rust gate above built: a release build of this tree costs
        # minutes of compilation, and the slowest fixture command finishes far
        # inside the deadline on the debug build.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/side2/tmp/iges-l9"
          test -x target/debug/cadmpeg
          python3 scripts/verify-iges-bounded.py \
            crates/cadmpeg-codec-iges/tests/golden/fixtures \
            --cadmpeg target/debug/cadmpeg \
            --limits service \
            --timeout 30 \
            --roundtrip \
            --report "$HOME/side2/tmp/iges-l9/iges-bounded-report.json"

      - name: Documentation tests
        # Reuses the library builds the Rust gate made; on its own job this
        # would pay for the whole workspace again.
        run: python3 scripts/ci_cargo.py test --doc

  features:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || ((needs.changes.outputs.schema == 'true' || needs.changes.outputs.sldprt_cli == 'true' || needs.changes.outputs.step_cli == 'true' || needs.changes.outputs.layout == 'true') && github.event.pull_request.draft != true)) }}
    name: schema / feature gates (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned toolchain
        uses: ./.github/actions/pinned-rust

      - name: Hash the Cargo profiles
        id: profiles
        uses: ./.github/actions/cargo-profile-key

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: features
          prefix-key: v0-rust-${{ steps.profiles.outputs.hash }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Match cargo's job count to the runner
        uses: ./.github/actions/cargo-job-count

      - name: Schema feature
        if: needs.changes.outputs.schema == 'true'
        # No other build compiles the JsonSchema derives. This gate builds the
        # core, IR and assembly libraries and unit tests with them (core and
        # assembly have no other targets) and runs those tests, which compare
        # the committed crates/cadmpeg-ir/schema files with the derives (their
        # text, in declared property order, under `schema-order`).
        run: |
          set -euo pipefail
          cargo test -q -p cadmpeg-core -p cadmpeg-ir -p cadmpeg-asm --features cadmpeg-ir/schema,cadmpeg-asm/schema --lib
          cargo test -q -p cadmpeg-ir --features schema-order --lib -- committed_json_schemas

      - name: Annex A
        if: needs.changes.outputs.schema == 'true'
        # Annex A of docs/cadir-v11.md states the schema of each type the
        # specification names and does not state; it is generated, never edited.
        run: python3 scripts/generate-annex-a.py --check

      - name: Single-codec CLI feature gate
        if: needs.changes.outputs.sldprt_cli == 'true'
        # Per-codec optional deps must keep a one-feature binary compiling.
        run: cargo check -q -p cadmpeg --no-default-features --features sldprt

      - name: STEP-only low-confidence regression
        if: needs.changes.outputs.step_cli == 'true'
        # This regression is compiled when STEP is enabled without FCStd or F3D.
        run: cargo test -q -p cadmpeg --no-default-features --features step --test integration delayed_step_archive_root_inspects_and_loads_with_step

      - name: Layout tables
        if: needs.changes.outputs.layout == 'true'
        run: cargo test -q -p cadmpeg-layout-tables

  fuzz:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || (needs.changes.outputs.fuzz == 'true' && github.event.pull_request.draft != true)) }}
    name: fuzz crate (stable)
    env:
      CI_FUZZ_CODECS: ${{ needs.changes.outputs.codec_scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned toolchain
        uses: ./.github/actions/pinned-rust

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          workspaces: crates/cadmpeg-fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Match cargo's job count to the runner
        uses: ./.github/actions/cargo-job-count

      - name: Fuzz targets compile
        run: python3 scripts/ci_fuzz.py

      - name: Fuzz crate tests
        # These tests cover the seed generators. The nightly run catches a
        # reader change that stops a seed reaching its decoder.
        if: github.event_name != 'pull_request'
        run: cargo test -q --manifest-path crates/cadmpeg-fuzz/Cargo.toml

  # Verifies the declared MSRV floor (Cargo.toml rust-version). RUSTUP_TOOLCHAIN
  # overrides the repo's rust-toolchain.toml pin so the floor is actually tested.
  # Clippy's `incompatible_msrv` rejects newer standard library items in every
  # Rust change. This job runs for manifest, lockfile, and toolchain changes,
  # and the nightly full gate catches newer language syntax.
  msrv:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || ((needs.changes.outputs.full == 'true' || needs.changes.outputs.audit == 'true') && github.event.pull_request.draft != true)) }}
    name: MSRV check (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_PACKAGES: ${{ needs.changes.outputs.packages }}
      CI_FULL: ${{ needs.changes.outputs.full }}
      CI_CODEC_FEATURES: ${{ needs.changes.outputs.codec_scope }}
      RUSTUP_TOOLCHAIN: "1.88"
      # `[workspace.lints]` denies warnings on every toolchain, and 1.88's lint
      # set differs from the pinned one's. This job checks compilation, not
      # lints; deny-by-default lints stay hard errors.
      RUSTFLAGS: "-A warnings"
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Hash the Cargo profiles
        id: profiles
        uses: ./.github/actions/cargo-profile-key

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.profiles.outputs.hash }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Match cargo's job count to the runner
        uses: ./.github/actions/cargo-job-count

      - name: Check
        run: python3 scripts/ci_cargo.py check

  # Byte-level codecs are the code most likely to break across platforms.
  # These jobs run only for a full gate outside PRs: the nightly run, a manual
  # dispatch, and a main run whose changes include a manifest, the lock file,
  # the toolchain, or a gate workflow. The release bump changes
  # Cargo.toml, so every release passes them.
  cross-platform:
    needs: changes
    if: ${{ github.event_name != 'pull_request' && !cancelled() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true') }}
    name: build / test (${{ matrix.os }})
    env:
      CI_PACKAGES: ${{ needs.changes.outputs.packages }}
      CI_FULL: ${{ needs.changes.outputs.full }}
    runs-on: ${{ matrix.os }}
    # macos-latest is a 5-core, 14 GiB runner or a 3-core, 7 GiB one. On the
    # 3-core runner the test build takes about 50 minutes when it stays in
    # memory, and the tests about 20; on the 5-core runner, 13 and 9.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned toolchain
        uses: ./.github/actions/pinned-rust

      - name: Hash the Cargo profiles
        id: profiles
        uses: ./.github/actions/cargo-profile-key

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.profiles.outputs.hash }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The cache holds the dependencies. A main run whose tests fail
          # still saves them.
          cache-on-failure: true

      - name: Match cargo's job count to the runner
        uses: ./.github/actions/cargo-job-count

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-nextest

      # Each step's timeout ends it before the job's, so the job fails rather
      # than being cancelled, and the report and cache steps run.
      - name: Build tests
        timeout-minutes: 75
        run: python3 scripts/ci_cargo.py nextest run --no-run --bins --tests --timings

      - name: Upload build timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timing-${{ runner.os }}
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore

      - name: Unit and integration tests
        timeout-minutes: 40
        run: python3 scripts/ci_cargo.py nextest run --bins --tests --no-fail-fast

      # A step timeout stops only the step's shell: cargo, rustc and the test
      # binaries keep running. Name them, then stop them before the cache step.
      - name: Report swap and unfinished work
        if: ${{ always() && runner.os == 'macOS' }}
        shell: bash
        run: |
          sysctl vm.swapusage
          ps -axo etime=,rss=,args= | awk '
            $3 ~ /(^|\/)rustc$/ {
              name = "?"
              for (i = 4; i < NF; i++) if ($i == "--crate-name") name = $(i + 1)
              kind = / --test( |$)/ ? "tests" : "lib"
              printf "still compiling %s (%s) after %s, %d MiB\n", name, kind, $1, $2 / 1024
            }
            $3 ~ /\/target\/debug\/deps\// {
              args = $0
              sub(/^ *[^ ]+ +[^ ]+ +/, "", args)
              printf "still running %s after %s, %d MiB\n", substr(args, 1, 300), $1, $2 / 1024
            }'
          pkill -x cargo-nextest || true
          pkill -x cargo || true
          pkill -x rustc || true
          pkill -f '/target/debug/deps/' || true

  # RustSec advisory scan of a changed dependency tree; audit.yml scans daily.
  audit:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || needs.changes.outputs.audit == 'true') }}
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install cargo-audit
        # Prebuilt binary; rustsec/audit-check compiled cargo-audit from
        # source on every run and dominated the pipeline's wall-clock.
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

  schedule-alert:
    needs: [changes, static, lint, test, features, fuzz, msrv, cross-platform, audit]
    if: ${{ always() && github.event_name == 'schedule' }}
    name: report scheduled result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Open, update, or close the failure issue
        uses: ./.github/actions/schedule-alert
        with:
          result: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          assignee: ${{ vars.SCHEDULE_ALERT_ASSIGNEE }}
