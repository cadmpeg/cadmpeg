name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # Nightly full gate on every platform. It also covers what PR and push
  # scoping did not select.
  schedule:
    - cron: "13 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs when the same PR ref is pushed again; PR iteration
# otherwise runs stale and current pipelines to completion side by side. Each
# push to main gets its own group: a shared group keeps one pending run, so a
# burst of merges cancels the queued runs and leaves those commits without the
# CI result that Cut release requires.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Throwaway runners get nothing from incremental compilation or debuginfo;
  # both slow the build (debuginfo dominates MSVC link time in particular)
  # and inflate the cargo cache. `[profile.test]` in Cargo.toml sets `debug`
  # explicitly, and a manifest value beats one inherited from `dev`, so the
  # test profile needs its own variable to reach the test binaries. The cost
  # is `file:line` in a CI backtrace; local runs keep it.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    name: Select affected crates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      packages: ${{ steps.scope.outputs.packages }}
      full: ${{ steps.scope.outputs.full }}
      rust: ${{ steps.scope.outputs.rust }}
      fuzz: ${{ steps.scope.outputs.fuzz }}
      sldprt_cli: ${{ steps.scope.outputs.sldprt_cli }}
      step_cli: ${{ steps.scope.outputs.step_cli }}
      schema: ${{ steps.scope.outputs.schema }}
      iges: ${{ steps.scope.outputs.iges }}
      static: ${{ steps.scope.outputs.static }}
      audit: ${{ steps.scope.outputs.audit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - name: Select gate inputs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          PUSH_BASE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mode=()
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            merge_group)
              # Skip the gate when this PR's own run passed it on the same base
              # and tree. The `tested` job names that record.
              base="$QUEUE_BASE"
              number="$(sed -nE 's#^refs/heads/gh-readonly-queue/[^/]+/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<<"$QUEUE_REF")"
              head=""
              if [ -n "$number" ]; then
                head="$(gh api "repos/$REPOSITORY/pulls/$number" --jq .head.sha || true)"
              fi
              if [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
                key="ci-tested-$base-$(git rev-parse 'HEAD^{tree}')"
                found="$(gh api "repos/$REPOSITORY/actions/artifacts?name=$key&per_page=100" \
                  --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_sha == \"$head\")] | length" \
                  || true)"
                if [[ "$found" =~ ^[1-9][0-9]*$ ]]; then
                  python3 scripts/ci_scope.py --tested --github-output "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
              ;;
            schedule)
              passed="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$SHA&event=schedule&status=success" \
                --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | length')"
              if [ "$passed" -gt 0 ]; then
                python3 scripts/ci_scope.py --tested --github-output "$GITHUB_OUTPUT"
                exit 0
              fi
              base=""
              ;;
            *)
              base="$PUSH_BASE"
              mode=(--cache-writer)
              tested="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$SHA&event=merge_group&status=success" \
                --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | length')"
              if [ "$tested" -gt 0 ]; then mode=(--tested); fi
              ;;
          esac
          if [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ] \
              && git fetch --no-tags --depth=1 origin "$base"; then
            python3 scripts/ci_scope.py --base "$base" "${mode[@]}" --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_scope.py --full --github-output "$GITHUB_OUTPUT"
          fi

  # Python policy checks need no Rust build and run beside clippy.
  static:
    needs: changes
    if: ${{ always() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || needs.changes.outputs.static == 'true') }}
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Specification reference check
        # Open-items documents cite the specification by section and paragraph
        # start. Catches a reference that names no paragraph or several.
        run: python3 scripts/check-doc-anchors.py

      - name: Python tooling tests
        run: python3 -m unittest discover -q -s scripts -p 'test_*.py'

      - name: Source policy
        run: |
          set -euo pipefail
          python3 scripts/check-source-policy.py
          python3 scripts/check-resource-caps.py
          python3 scripts/check-deny-census.py
          python3 scripts/census-panic-calls.py --check

      - name: Golden coverage floors
        # Mesh-size floors in docs/golden-coverage-floors.toml. Counts may only
        # rise when fixtures are added; they must never silently fall.
        run: |
          set -euo pipefail
          python3 scripts/check-golden-coverage-floors.py

      - name: Codec facade
        # Crate-root pub items must match docs/codec-facade.toml.
        run: |
          set -euo pipefail
          python3 scripts/check-codec-facade.py

      - name: Dialect identity registry
        # Schema, id grammar, witness form, and the IGES admission lattice in
        # crates/cadmpeg-registry/docs/dialects.toml. Ids are pinned from the commit that adds them.
        run: |
          set -euo pipefail
          python3 scripts/check-dialects.py

      - name: Dialect capability registry
        # crates/cadmpeg-registry/docs/dialect-support.toml against the identity registry, the fixture
        # tree, the golden snapshots that pin each fixture's emitted dialect
        # id, and the encoders' write-target catalogs. Fixture gating lives
        # here: a row with no fixture cannot claim a read score.
        run: |
          set -euo pipefail
          python3 scripts/check-dialect-support.py

      - name: Rendered capability tables
        # Every score table in docs/format-support.md, the root README, each
        # codec crate README, and each codec lib.rs doc header is rendered from
        # the two registries. --check re-renders and compares byte for byte, so
        # a registry edit without a re-render fails here.
        run: |
          set -euo pipefail
          python3 scripts/render-format-support.py --check

  # The stable gate is three jobs rather than one long one. Clippy compiles the
  # workspace through `clippy-driver`, whose artifacts are separate from the
  # ones `cargo test` builds, so the work is additive and the steps only ever
  # queued behind each other. Splitting makes the gate's wall-clock the slowest
  # job instead of the sum of every step.
  lint:
    needs: changes
    if: ${{ always() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    name: fmt / clippy (stable)
    env:
      CI_PACKAGES: ${{ needs.changes.outputs.packages }}
      CI_FULL: ${{ needs.changes.outputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned toolchain
        uses: ./.github/actions/pinned-rust
        with:
          components: rustfmt, clippy

      - name: Match cargo's job count to the runner
        uses: ./.github/actions/cargo-job-count

      - name: Hash the Cargo profiles
        id: profiles
        uses: ./.github/actions/cargo-profile-key

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          prefix-key: v0-rust-${{ steps.profiles.outputs.hash }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        # Lint levels come from `[workspace.lints]` in Cargo.toml, so no
        # trailing flags here. Trailing flags are part of the compilation
        # fingerprint, and a flagged run and a bare run evict each other's
        # cached artifacts.
        # `--all-targets` covers lib, bins, tests, and benches so test-only
        # style debt cannot hide behind crate-root cfg(test) mute lists.
        run: python3 scripts/ci_cargo.py clippy --all-targets

  test:
    needs: changes
    if: ${{ always() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || (needs.changes.outputs.rust == 'true' && github.event.pull_request.draft != true)) }}
    name: test (stable)
    env:
      CI_PACKAGES: ${{ needs.changes.outputs.packages }}
      CI_FULL: ${{ needs.changes.outputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned toolchain
        uses: ./.github/actions/pinned-rust

      - name: Match cargo's job count to the runner
        uses: ./.github/actions/cargo-job-count

      - name: Hash the Cargo profiles
        id: profiles
        uses: ./.github/actions/cargo-profile-key

      - name: Cache cargo registry and target
        # The only stable job that writes the shared cache. It builds the
        # widest set of dependencies, and concurrent writers of one key make
        # every loser log a conflict.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable
          prefix-key: v0-rust-${{ steps.profiles.outputs.hash }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.32
        with:
          tool: cargo-nextest

      - name: Unit and integration tests
        # Compile selected packages and their dependencies before running.
        # A separate `cargo build` step would repeat that compilation.
        run: python3 scripts/ci_cargo.py nextest run --bins --tests --no-fail-fast

      - name: Inventor CLI evidence tests
        if: contains(fromJSON(needs.changes.outputs.packages), 'cadmpeg')
        # These two tooling tests need the default CLI built by the Rust gate.
        # The static job runs the remaining Python tests without a CLI build.
        run: |
          test -x target/debug/cadmpeg
          python3 -m unittest -q \
            scripts.test_inventor_evidence.EvidenceTest.test_primary_carrier_parity_when_cli_is_built \
            scripts.test_inventor_evidence.EvidenceTest.test_cli_sweep_is_per_profile_and_deterministic

      - name: Bounded IGES decode and round-trip gate
        if: needs.changes.outputs.iges == 'true'
        # Give every synthesized IGES fixture independent decode, validation,
        # conversion, generated-file decode, and generated-file validation
        # deadlines under the unattended resource profile. Use the debug CLI
        # that the Rust gate above built: a release build of this tree costs
        # minutes of compilation, and the slowest fixture command finishes far
        # inside the deadline on the debug build.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/side2/tmp/iges-l9"
          test -x target/debug/cadmpeg
          python3 scripts/verify-iges-bounded.py \
            crates/cadmpeg-codec-iges/tests/golden/fixtures \
            --cadmpeg target/debug/cadmpeg \
            --limits service \
            --timeout 30 \
            --roundtrip \
            --report "$HOME/side2/tmp/iges-l9/iges-bounded-report.json"

      - name: Documentation tests
        # Reuses the library builds the Rust gate made; on its own job this
        # would pay for the whole workspace again.
        run: python3 scripts/ci_cargo.py test --doc

  features:
    needs: changes
    if: ${{ always() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || ((needs.changes.outputs.schema == 'true' || needs.changes.outputs.sldprt_cli == 'true' || needs.changes.outputs.step_cli == 'true') && github.event.pull_request.draft != true)) }}
    name: schema / feature gates (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned toolchain
        uses: ./.github/actions/pinned-rust

      - name: Match cargo's job count to the runner
        uses: ./.github/actions/cargo-job-count

      - name: Hash the Cargo profiles
        id: profiles
        uses: ./.github/actions/cargo-profile-key

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: features
          prefix-key: v0-rust-${{ steps.profiles.outputs.hash }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Schema feature
        if: needs.changes.outputs.schema == 'true'
        # The CLI enables IR schemas. This gate also checks schema assertions
        # and the core/assembly feature combinations without CLI defaults.
        run: |
          set -euo pipefail
          cargo test -q -p cadmpeg-ir -p cadmpeg-asm --features cadmpeg-ir/schema,cadmpeg-asm/schema --lib
          cargo check -q -p cadmpeg-core -p cadmpeg-asm --all-targets \
            --features cadmpeg-core/schema,cadmpeg-asm/schema

      - name: Single-codec CLI feature gate
        if: needs.changes.outputs.sldprt_cli == 'true'
        # Per-codec optional deps must keep a one-feature binary compiling.
        run: cargo check -q -p cadmpeg --no-default-features --features sldprt

      - name: STEP-only low-confidence regression
        if: needs.changes.outputs.step_cli == 'true'
        # This test target only exists when STEP is enabled without FCStd or F3D.
        run: cargo test -q -p cadmpeg --no-default-features --features step --test low_confidence_inspect

  fuzz:
    needs: changes
    if: ${{ always() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || (needs.changes.outputs.fuzz == 'true' && github.event.pull_request.draft != true)) }}
    name: fuzz crate (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned toolchain
        uses: ./.github/actions/pinned-rust

      - name: Match cargo's job count to the runner
        uses: ./.github/actions/cargo-job-count

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          workspaces: crates/cadmpeg-fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fuzz targets compile
        # The fuzz crate declares its own `[workspace]`, so every other job
        # skips it; a refactor that moves a codec's internals silently rots the
        # harnesses' imports. A stable `check` catches that drift without the
        # nightly toolchain `cargo fuzz build` needs. `--all-targets` reaches
        # every harness and seed binary, and `--keep-going` reports all of them
        # rather than stopping at the first.
        run: |
          cargo check -q --manifest-path crates/cadmpeg-fuzz/Cargo.toml \
            --all-targets --keep-going

      - name: Fuzz crate tests
        # Runs the library and seed-generator tests, including the seed
        # decode tests that fail when a reader change stops a seed reaching
        # its decoder. Every harness under `fuzz_targets/` declares
        # `test = false`, so this builds and runs no harness.
        run: cargo test -q --manifest-path crates/cadmpeg-fuzz/Cargo.toml

  # Verifies the declared MSRV floor (Cargo.toml rust-version). RUSTUP_TOOLCHAIN
  # overrides the repo's rust-toolchain.toml pin so the floor is actually tested.
  msrv:
    needs: changes
    if: ${{ always() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || (needs.changes.outputs.rust == 'true' && github.event.pull_request.draft != true)) }}
    name: MSRV check (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_PACKAGES: ${{ needs.changes.outputs.packages }}
      CI_FULL: ${{ needs.changes.outputs.full }}
      RUSTUP_TOOLCHAIN: "1.88"
      # `[workspace.lints]` denies warnings on every toolchain, and 1.88's lint
      # set differs from the pinned one's. This job checks compilation, not
      # lints; deny-by-default lints stay hard errors.
      RUSTFLAGS: "-A warnings"
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Match cargo's job count to the runner
        uses: ./.github/actions/cargo-job-count

      - name: Hash the Cargo profiles
        id: profiles
        uses: ./.github/actions/cargo-profile-key

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.profiles.outputs.hash }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        run: python3 scripts/ci_cargo.py check

  # Byte-level codecs are the code most likely to break across platforms.
  # These jobs run only for a full gate outside PRs: the nightly run, a manual
  # dispatch, and a main or queue commit that changes a manifest, the lock
  # file, the toolchain, or a gate workflow. The release bump changes
  # Cargo.toml, so every release passes them.
  cross-platform:
    needs: changes
    if: ${{ github.event_name != 'pull_request' && always() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true') }}
    name: build / test (${{ matrix.os }})
    env:
      CI_PACKAGES: ${{ needs.changes.outputs.packages }}
      CI_FULL: ${{ needs.changes.outputs.full }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pinned toolchain
        uses: ./.github/actions/pinned-rust

      - name: Match cargo's job count to the runner
        uses: ./.github/actions/cargo-job-count

      - name: Hash the Cargo profiles
        id: profiles
        uses: ./.github/actions/cargo-profile-key

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.profiles.outputs.hash }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.32
        with:
          tool: cargo-nextest

      - name: Unit and integration tests
        run: python3 scripts/ci_cargo.py nextest run --bins --tests --no-fail-fast

  # RustSec advisory scan of a changed dependency tree; audit.yml scans daily.
  audit:
    needs: changes
    if: ${{ always() && needs.changes.result != 'cancelled' && (needs.changes.result != 'success' || needs.changes.outputs.audit == 'true') }}
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require valid gate selection
        shell: bash
        run: test "${{ needs.changes.result }}" = success
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install cargo-audit
        # Prebuilt binary; rustsec/audit-check compiled cargo-audit from
        # source on every run and dominated the pipeline's wall-clock.
        uses: taiki-e/install-action@v2.87.32
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

  # Records that this PR run passed every gate it selected on its base and
  # merge tree. The merge queue skips a commit with the same base and tree.
  # A full gate also runs macOS and Windows, which PR runs never do.
  tested:
    needs: [changes, static, lint, test, features, fuzz, msrv, audit]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft != true && !failure() && !cancelled() && needs.changes.outputs.full == 'false' }}
    name: record tested tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Name the tested base and tree
        id: key
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          echo "name=ci-tested-$PR_BASE-$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > tested-commit

      - name: Record
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.key.outputs.name }}
          path: tested-commit
          retention-days: 7

  schedule-alert:
    needs: [changes, static, lint, test, features, fuzz, msrv, cross-platform, audit]
    if: ${{ always() && github.event_name == 'schedule' }}
    name: report scheduled result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Open, update, or close the failure issue
        uses: ./.github/actions/schedule-alert
        with:
          result: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          assignee: ${{ vars.SCHEDULE_ALERT_ASSIGNEE }}
