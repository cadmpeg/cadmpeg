name: IGES FreeCAD interoperability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  freecad:
    name: IGES geometry acceptance (FreeCAD)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: iges-freecad

      - name: Install FreeCAD command line importer
        run: sudo snap install freecad --channel=stable

      - name: Build IGES production binary
        run: cargo build -q --release -p cadmpeg --no-default-features --features iges

      - name: Materialize writer geometry profile
        run: |
          set -euo pipefail
          mkdir -p "$HOME/side2/tmp/iges-l9/freecad"
          python3 scripts/prepare-iges-freecad-golden.py \
            --output-dir "$HOME/side2/tmp/iges-l9/freecad"

      - name: Run independent FreeCAD geometry gate
        env:
          CADMPEG_IGES_INPUT_DIR: /home/runner/side2/tmp/iges-l9/freecad
          CADMPEG_IGES_EXPECTATIONS: ${{ github.workspace }}/scripts/iges-freecad-expectations.json
          CADMPEG_IGES_REPORT: /home/runner/side2/tmp/iges-l9/freecad-report.json
        run: freecad.cmd "$GITHUB_WORKSPACE/scripts/verify-iges-freecad.py"

      - name: Upload FreeCAD acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iges-freecad-report-${{ github.run_id }}
          path: /home/runner/side2/tmp/iges-l9
          if-no-files-found: warn
