# SPDX-License-Identifier: Apache-2.0
name: Match cargo's job count to the runner
description: >
  Export CARGO_BUILD_JOBS as the runner's core count, lowered to one job per
  2.5 GiB of memory, overriding the `jobs` cap in .cargo/config.toml. Use it
  after Swatinem/rust-cache: that action hashes every CARGO_* variable into
  its cache key, and macos-latest is a 3-core or a 5-core runner, so a count
  exported before the restore splits the cache by runner size.

runs:
  using: composite
  steps:
    # `.cargo/config.toml` caps `jobs` at 6 so the final burst of very large
    # concurrent links cannot push a developer machine past systemd-oomd's
    # pressure threshold. Runners have 3 to 5 cores, where that cap is
    # oversubscription rather than a limit. The 3-core macOS runner has 7 GiB:
    # three concurrent compilations of the largest workspace crates swap it,
    # and each of them takes about ten times as long as on the 5-core, 14 GiB
    # runner. Two jobs keep the build in memory.
    - name: Export CARGO_BUILD_JOBS
      shell: bash
      run: |
        set -euo pipefail
        # `nproc` and /proc/meminfo on Linux and on the Windows runner's Git
        # Bash; macOS has neither.
        cores="$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)"
        memory_kib="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo 2>/dev/null || true)"
        if [[ ! $memory_kib =~ ^[0-9]+$ ]]; then
          memory_bytes="$(sysctl -n hw.memsize 2>/dev/null || true)"
          if [[ $memory_bytes =~ ^[0-9]+$ ]]; then
            memory_kib=$((memory_bytes / 1024))
          fi
        fi
        jobs=$cores
        if [[ $memory_kib =~ ^[0-9]+$ ]]; then
          by_memory=$((memory_kib * 2 / (5 * 1024 * 1024)))
          if ((by_memory < jobs)); then
            jobs=$((by_memory > 0 ? by_memory : 1))
          fi
          echo "runner reports ${cores} cores and $((memory_kib / 1024)) MiB; ${jobs} jobs"
        else
          echo "runner reports ${cores} cores and no memory size; ${jobs} jobs"
        fi
        echo "CARGO_BUILD_JOBS=${jobs}" >> "$GITHUB_ENV"
