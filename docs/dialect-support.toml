[[support]]
dialect = "iges:5.3-compressed-ascii"
grammar = "compressed-ascii"
read = "L1"
write = "preserved"
fixtures = [
  "crates/cadmpeg-codec-iges/tests/golden/fixtures/compressed_ascii_5_3.igs",
]
reason = """
L1 is what the fixture demonstrates, not the Fixed ASCII band's score.
`compressed_ascii_5_3.igs` carries the C flag card, the shared Start and
Global records at field 23 = 11, and two Data records of inherited
Directory field specifiers with free-form Parameter Data lines.
`compressed.rs` expands it to fixed cards -- the inspect note
`normalized_representation=compressed-ascii` records the envelope -- and
the decode admits it with no loss at all, reaching typed IR for two points.
That is the envelope navigated, its version identified, and its records
enumerated: L1. The fixture states nothing above it. Write
is preservation only: the retained source image is the original bytes, and
`Inherit` replays them verbatim (Compressed ASCII included,
`writer.rs:93-97`). The semantic writer emits Fixed ASCII only, so this
row is absent from the synthesis catalog by construction
(`dialect.rs:41-47`); `compressed/tests.rs:193`
`compressed_ascii_replays_its_own_bytes_under_an_inherit_request` proves
this row on that path"""

