[[support]]
dialect = "iges:2.0-fixed-ascii"
grammar = "fixed-ascii"
read = "unclassified-recovered"
write = "preserved"
fixtures = [
  "crates/cadmpeg-codec-iges/tests/golden/fixtures/legacy_2_0_fixed_ascii.igs",
]
reason = """
the version flag has no Global table this codec verified; `global.rs`
reads it with the 5.3 26-field table and classify returns
AdmittedUnverified. `legacy_2_0_fixed_ascii.igs` declares field 23 = 3 and
its Global record stops there, so fields 24, 25, and 26 -- the drafting
standard, the model creation date, and the application protocol, which
`global.rs` gives to the 4.0, 5.0, and 5.1 tables respectively -- are
absent as a 2.0 record requires. The golden pins the row, the
AdmittedUnverified admission naming `iges:5.3-fixed-ascii` as nearest, and
the `source.dialect-unverified` loss. The read cell stays
`unclassified-recovered` because that cell is the mirror of the admission,
not a fixture-gated placeholder: the fixture confirms the recovery rather
than lifting it. Write is preservation only: `Inherit` replays whatever dialect
the source is (`writer.rs:93-97`, `replay_bytes` with no target,
`writer.rs:295-312`), and `writer.rs:84-91` states the synthesis catalog
excludes this row by construction. `targets.rs:84` proves the other
half on `iges:1.0-fixed-ascii`: with the retained image gone, `Inherit`
refuses rather than synthesizing"""

