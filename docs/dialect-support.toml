# The dialect capability registry: what cadmpeg does with each dialect.
# Enforced by scripts/check-dialect-support.py.
#
# This file describes cadmpeg, not formats. It changes per commit. Identity --
# which dialects exist -- lives in `docs/dialects.toml` and changes when a
# vendor ships. See `~/side2/cadmpeg-dialects-design.md` sections 5 and 6.
#
# Schema
#   [[support]]  dialect   a `<format>:<name>` id declared in
#                          `docs/dialects.toml`. Every identity row has
#                          exactly one support row; every support row names
#                          an identity row.
#                read      `L0`..`L9`, `detected`, `refused`, or
#                          `unclassified-recovered`.
#                write     `verified`, `emitted`, `preserved`, or `none`.
#                fixtures  repo-relative paths to files this row decodes.
#                          Every path must exist.
#                reason    required when `read = "refused"` or `fixtures` is
#                          empty. Optional otherwise.
#                grammar   optional grammar class, recorded only where the
#                          codec's own code names one.
#
# Fixture gating. A row with zero fixtures cannot claim a read score: the
# floor for an unwitnessed dialect is `detected`. The gate is not advisory --
# where it contradicts a prose score in `docs/format-support.md`, the cell
# says `detected` and the reason says why. The unevenness this exposes is the
# output of the table, not a defect in it. The count is self-verifying: each
# listed fixture is a frozen input of a per-codec golden suite whose
# checked-in snapshot pins the dialect id the decoder emitted for it, and
# `check_snapshot_dialects` compares the two. A path with no such snapshot
# cannot be smuggled in as evidence, and the listing is complete in the other
# direction too: a fixture a golden suite already pins to a dialect must
# appear under that dialect's row, so the evidence column cannot fall behind
# the suites that produce it.
#
# How the read cell is chosen.
#
#   `refused` mirrors the codec's own refusal: either `Admission::Refused`, or
#   a `CodecError` raised before any report exists. Three rows refuse in fact
#   without ever carrying an `Admission` value (the three STEP alternate
#   encodings); they are marked `refused` and the reason names the refusal
#   site.
#
#   `unclassified-recovered` mirrors `Admission::AdmittedUnverified`: the file
#   is parsed, but with a strategy some other row declares. The codec charges
#   its `source.dialect-unverified` loss on exactly these rows.
#
#   A score is the `docs/format-support.md` ladder score, applied to the rows
#   the profile's own band statement names and then cut by the fixture gate.
#   Where a profile names no band, or names one this codec has no fixture for,
#   the cell is `detected` and the reason says so. No score here was invented;
#   none was copied past the gate. This file is now the source of every score
#   `docs/format-support.md` publishes: the tables there are rendered from
#   these rows by `scripts/render-format-support.py`, so a cell edited here
#   moves the published headline and a cell edited there fails the checker.
#
# How the write cell is chosen. There are two write capabilities, and the
# column never conflates them.
#
#   SYNTHESIS builds the dialect from neutral IR for arbitrary input. It is
#   static: the encoder's `targets()` catalog enumerates it. `verified` means
#   that target has checked-in golden artifacts proving deterministic output
#   that re-decodes, or a stated independent-application acceptance gate.
#   `emitted` means the encoder exports the target and the profile states it
#   is emitted, without that evidence.
#
#   PRESERVATION reproduces a dialect only when the source already is one --
#   verbatim byte replay or a patch of the retained baseline, asked for with
#   `TargetRequest::Inherit`. It is input-conditioned, so it is never a
#   catalog row: a `targets()` that listed it would advertise an output
#   arbitrary input cannot reach. `preserved` is that cell.
#
#   `none` means no encoder writes the dialect on any path.
#
# The checker holds the two apart in both directions: a `preserved` row must
# not appear in any `targets()` catalog, and a `verified`/`emitted` row on a
# format that has a catalog must appear in it. It also proves each exported
# id is a subset of that format's identity rows and is not `write = "none"`.
#
# `parasolid:` has no owning crate, so nothing classifies it on the read side:
# its schema tokens are read as attributes inside the sldprt and nx readers.
# The schema has no cell for "identity row with no reader", so those four rows
# carry the disposition the wrapping code enforces and say so in the reason.
# Two of them are written even so: the sldprt writer stamps a Parasolid schema
# token on every stream it generates, which is synthesis at the kernel layer,
# and an embedded-kernel dialect is never its host's `targets()` row.
#
# `acis:` does have an owner, `cadmpeg-asm`, which pins its rows and the
# save-format band its record decoders are verified against. The hosts emit
# those ids as non-primary `DialectMatch` layers and cite the band.


# --------------------------------------------------------------------------
# iges
# --------------------------------------------------------------------------

[[support]]
dialect = "iges:1.0-fixed-ascii"
grammar = "fixed-ascii"
read = "unclassified-recovered"
write = "preserved"
fixtures = []
reason = """
the version flag has no Global table this codec verified; `global.rs`
reads it with the 5.3 26-field table and classify returns
AdmittedUnverified. No fixture declares the flag, so the row cannot claim
a score. Write is preservation only: `Inherit` replays whatever dialect
the source is (`writer.rs:93-97`, `replay_bytes` with no target,
`writer.rs:295-312`), and `writer.rs:84-91` states the synthesis catalog
excludes this row by construction. `targets.rs:84` proves the other
half on `iges:1.0-fixed-ascii`: with the retained image gone, `Inherit`
refuses rather than synthesizing"""

