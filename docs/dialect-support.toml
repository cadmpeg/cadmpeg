[[support]]
dialect = "iges:unknown"
read = "unclassified-recovered"
write = "preserved"
reason = """
a version flag outside the declared table (12, 99, or an unreadable field
23); read with the nearest verified row's Global table.
`unknown_version_flag_99.igs` declares field 23 = 99. No row's
`version_flag` discriminant holds 99, so the document lands on the
totality row, and the golden pins that id, the AdmittedUnverified
admission using `iges:5.3-fixed-ascii`, and a
`source.dialect-unverified` loss whose message names the clamp to 11 that
IGES 5.3 section 2.2.4.3.23 requires of a postprocessor. The read cell
stays `unclassified-recovered` because that cell mirrors the admission:
a document that matched no row was necessarily read with a grammar no row
declares for it, and a score would state the opposite. Write is
preservation only: `replay_bytes` applies no version or representation
filter, so a source that classifies here replays its own bytes under
`Inherit` like any other row"""

