#          database.rs:105-111 and :131-136), NOT the `V<n>` storage-band
#          number in the path. `StorageBand::parse` accepts any digits
#          (rse.rs:24-33) and the code-built fixture uses `V1` with schema 31.
#   meta8  Real: the marker string "RSe Meta Stream Version 8" AND the u16
#          literal 8 must both match (rse.rs:577-581).
