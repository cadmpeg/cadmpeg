[[dialect]]
id = "iges:4.0-binary"
title = "IGES 4.0, Binary"
discriminants = { representation = "binary", effective_version = "4.0", version_flag = "6" }
witness = "spec:IGES 4.0 section 2.4.1"

[[dialect]]
id = "iges:5.0-binary"
title = "IGES 5.0, Binary"
discriminants = { representation = "binary", effective_version = "5.0", version_flag = "8" }
witness = "spec:IGES 5.3 Appendix H.1"
supersedes = ["iges:4.0-binary"]

[[dialect]]
id = "iges:5.1-binary"
title = "IGES 5.1, Binary"
discriminants = { representation = "binary", effective_version = "5.1", version_flag = "9" }
witness = "spec:IGES 5.3 Appendix H.1"

[[dialect]]
id = "iges:5.2-binary"
title = "IGES 5.2, Binary"
