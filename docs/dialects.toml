[[dialect]]
id = "iges:5.1-compressed-ascii"
title = "IGES 5.1, Compressed ASCII"
discriminants = { representation = "compressed-ascii", effective_version = "5.1", version_flag = "9" }
witness = "spec:IGES 5.3 section 2.3.1"

[[dialect]]
id = "iges:5.2-compressed-ascii"
title = "IGES 5.2, Compressed ASCII"
discriminants = { representation = "compressed-ascii", effective_version = "5.2", version_flag = "10" }
witness = "spec:IGES 5.3 section 2.3.1"

[[dialect]]
id = "iges:5.3-compressed-ascii"
title = "IGES 5.3, Compressed ASCII"
discriminants = { representation = "compressed-ascii", effective_version = "5.3", version_flag = "11" }
seam = "Directory Entry and Parameter Data combine into Data records; Start, Global, and Terminate keep the fixed cards"
