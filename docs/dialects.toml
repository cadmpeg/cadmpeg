# FreeCAD FCStd
# --------------------------------------------------------------------------
# One discriminant: the `SchemaVersion` attribute on the `<Document>` root of
# `Document.xml` inside the ZIP
# (crates/cadmpeg-codec-freecad/src/container.rs:214-215; re-read
# independently at persistence.rs:48-51). The lowercase alias `schemaVersion`
# alone is refused, and carrying both spellings is refused
# (container.rs:168-182). `GuiDocument.xml` carries its own unrelated
# `SchemaVersion`; it is not run through this dispatch. Every GUI schema uses
# the schema-1 vocabulary. A foreign declaration that fits is retained with
# `fcstd/source.gui-schema-unverified`; a failed foreign-schema attempt drops
# only GUI presentation data and charges the same warning.
#
# `complete = false`: FreeCAD publishes no enumeration of its schema versions
# in a specification. The space is enumerable from FreeCAD's own source
# (`Document.cpp`), which the codec owner can cite to flip this to true.
#
# The codec's pinned-id surface is `FcstdDialect` (dialect.rs), one variant per
# row below. `FcstdDialect::classify` is the single construction path for the
# `DialectMatch` that `ContainerSummary.dialects`, `DecodeReport.dialects`, and
# the `SourceMeta.dialect` / `SourceMeta.declared` mirror all carry. The
# declared keys are `schema_version`, `file_version`, and `program_version`,
# recorded verbatim.
#
# `FileVersion` is read (container.rs:216-217, defaulting to "0") and is a
# write-target component -- `FcstdWriteOptions { schema_version, file_version }`
# with `Default` (4, 1) (lib.rs:66-81) and a hard writer gate on exactly (4, 1)
# (writer.rs:37-42) -- but no decode path branches on it, so it is not a read
# discriminant. It travels in `declared` as evidence.
