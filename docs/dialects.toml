# applied is the metadata-IR fallback, which is no other CATIA dialect's
# declared strategy; `nearest` is typed as a `DialectId` and can only name a
# dialect, so the self-reference is the only honest referent available. This is
# a template conflict, recorded rather than resolved by naming a family whose
# grammar was never applied.
