# inside `container::scan`, beside the branch that chooses the parse strategy.
#
# Open grammar question, not decided here. Two further document-wide forks
# live inside the same manifest and would each be a B1 boundary if the codec
# owner reads them that way:
#   generation sentinel -- `generation == 1234` selects a three-extra-word
#     layout (major/minor/flags); any other value selects a one-extra-word
#     legacy layout (manifest.rs:206-217). BOTH branches are admitted: this is
#     a real fork, not a gate. All four components are parsed and discarded.
#   asset-manifest revision -- `parse_asset_header` (manifest.rs:400-431)
#     admits revisions 0, 10, 11, 12, 13, 14, 15, 19, and 20 through three
#     genuinely distinct grammars (dispatch at manifest.rs:415-426;
