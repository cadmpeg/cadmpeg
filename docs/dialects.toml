# Dialect identity registry. `scripts/check-dialects.py` enforces this contract
# in the commit hook and CI. Ids are pinned.
#
# This file describes formats, not cadmpeg. It changes when a vendor ships,
# never when cadmpeg gains a decoder. Capability lives in
# `docs/dialect-support.toml`. See
# `~/side2/cadmpeg-dialects-design.md` §3 and §5 for the model.
#
# Schema
#   [format.<id>]      complete = true when the discriminant space is
#                      enumerable from the format's own documentation.
#                      complete = false means the rows are grammar classes
#                      plus a mandatory `unknown` row.
#   [[dialect]]        id            `<format>:<name>`, lowercase-hyphenated,
#                                    stable forever.
#                      title         human-facing name.
#                      discriminants the fields read from the bytes that
#                                    select this row.
#                      witness       `spec:...`, `corpus:<repo-relative path>`,
#                                    or `code:<file>:<line>`.
#                      seam          why this boundary exists, where it needs
#                                    saying.
#                      pinned        false when a descriptive identity row has
#                                    no owning producer. Omitted means true.
#                      supersedes    predecessor identity rows. Admitted only
#                                    where the checker consumes the relation;
#                                    IGES is the only consumer today. The
#                                    supersession graph must be acyclic.
#
# Witness rule. Every row carries a witness. A `code:` witness is a
# placeholder: it proves the discriminant value is read, not that a file
# carrying it was observed. Every `code:` witness must upgrade to a `spec:` or
# `corpus:` witness before the checker enforces witness quality.
#
# Corpus witnesses. `corpus/manifest.toml` covers only the FreeCAD fixtures.
# Every other `corpus:` path below is a repository-authored golden fixture:
# it carries the discriminant value in its bytes, verified by reading them,
# but it was not captured from vendor output. It witnesses that the row is
# real; it does not witness vendor production of that dialect.
#
# Each row's comment cites the classification code that was read to verify its
# discriminants. Where the superseded RFC's draft inventory disagrees with the
# code, the code wins and the comment says so.

# --------------------------------------------------------------------------
# IGES
# --------------------------------------------------------------------------
# The discriminant space is a cross product of two axes, both enumerated by
# the IGES 5.3 specification itself:
#   representation     `representation.rs` `Representation::classify_prefix`
#                      (crates/cadmpeg-codec-iges/src/representation.rs:47-57)
#                      Compressed ASCII: byte 73 == 'C' over a printable
#                      80-byte flag record (representation.rs:20-25).
#                      Binary: the Binary Flag Section (representation.rs:27-45).
#                      Fixed ASCII: `card::detect_fixed_ascii` at High.
#                      `Representation::Unknown` yields `Confidence::No`
#                      (representation.rs:59-66), so it is outside the
#                      detect() domain and needs no row: B4 totality holds
#                      without one.
#   effective_version  Global field 23, clamped by `effective_version`
#                      (crates/cadmpeg-codec-iges/src/global.rs:706-720) as
#                      IGES 5.3 section 2.2.4.3.23 requires of a
#                      postprocessor. The clamp is total: a flag below 1 maps
#                      to 3 and a flag at or above 11 maps to 11, so every
#                      declared value classifies.
# The declared flag survives verbatim in the match as evidence; the row
# reflects the effective version (design §3.4).
[format.iges]
complete = true

# Version-flag values 1, 2, 3, 4, 5, and 7 select Global tables this codec has
# not verified against their own specifications; `Dialect::from_effective_flag`
# groups them as `Dialect::Legacy` (global.rs:70-79) and decode charges
# `iges/source.dialect-unverified` (global.rs:1464-1490). They are still
# distinct identity rows: identity is exogenous, grammar is endogenous
# (design §3.2). `VERIFIED_VERSIONS` is ["4.0","5.0","5.1","5.2","5.3"]
# (global.rs:282).
#
# Compressed ASCII and Binary rows exist only for the version values whose
# specifications this repository cites for those representations:
# IGES 4.0 section 2.3.1 and IGES 5.3 section 2.3.1 for Compressed ASCII,
# IGES 4.0 section 2.4.1 and IGES 5.3 Appendix H for Binary
# (docs/formats/iges.md lines 15-21). Pre-4.0 Compressed ASCII and Binary
# combinations are omitted rather than invented; the IGES 3.0 specification
# would witness them.

[[dialect]]
# global.rs:718 `_ => (3, "2.0")` also absorbs an unreadable or sub-1 flag.
id = "iges:1.0-fixed-ascii"
title = "IGES 1.0, Fixed ASCII"
discriminants = { representation = "fixed-ascii", effective_version = "1.0", version_flag = "1" }
witness = "spec:IGES 5.3 section 2.2.4.3.23"

[[dialect]]
id = "iges:ansi-y14.26m-1981-fixed-ascii"
title = "ANSI Y14.26M-1981, Fixed ASCII"
discriminants = { representation = "fixed-ascii", effective_version = "ANSI-Y14.26M-1981", version_flag = "2" }
witness = "spec:IGES 5.3 section 2.2.4.3.23"

[[dialect]]
# The specification default for an absent field 23, and the clamp target for
# every flag below 1 (global.rs:718).
id = "iges:2.0-fixed-ascii"
title = "IGES 2.0, Fixed ASCII"
discriminants = { representation = "fixed-ascii", effective_version = "2.0", version_flag = "3" }
seam = "the default and the low clamp target; an absent or unreadable field 23 lands here"
witness = "spec:IGES 5.3 section 2.2.4.3.23"

[[dialect]]
id = "iges:3.0-fixed-ascii"
title = "IGES 3.0, Fixed ASCII"
discriminants = { representation = "fixed-ascii", effective_version = "3.0", version_flag = "4" }
witness = "spec:IGES 5.3 section 2.2.4.3.23"

[[dialect]]
id = "iges:asme-ansi-y14.26m-1987-fixed-ascii"
title = "ASME/ANSI Y14.26M-1987, Fixed ASCII"
discriminants = { representation = "fixed-ascii", effective_version = "ASME-ANSI-Y14.26M-1987", version_flag = "5" }
witness = "spec:IGES 5.3 section 2.2.4.3.23"

[[dialect]]
# `Dialect::V4_0` (global.rs:72). Its Global table stops at field 24
# (global.rs:81-87).
id = "iges:4.0-fixed-ascii"
title = "IGES 4.0, Fixed ASCII"
discriminants = { representation = "fixed-ascii", effective_version = "4.0", version_flag = "6" }
seam = "the Global table stops at field 24 and the entity/form table is the 4.0 table"
witness = "spec:IGES 5.3 section 2.2.4.3.23"

[[dialect]]
id = "iges:asme-y14.26m-1989-fixed-ascii"
title = "ASME Y14.26M-1989, Fixed ASCII"
discriminants = { representation = "fixed-ascii", effective_version = "ASME-Y14.26M-1989", version_flag = "7" }
witness = "spec:IGES 5.3 section 2.2.4.3.23"

[[dialect]]
# `Dialect::V5_0` (global.rs:73). Its admission profile matches
# `envelope_a_v5_0_admits` (crates/cadmpeg-codec-iges/src/profile.rs:87-112):
# it returns true for everything `envelope_a_v4_admits` admits (profile.rs:92)
# except the Appendix-I compatibility forms rejected first
# (profile.rs:88-90, table at profile.rs:115-117).
id = "iges:5.0-fixed-ascii"
title = "IGES 5.0, Fixed ASCII"
discriminants = { representation = "fixed-ascii", effective_version = "5.0", version_flag = "8" }
seam = "the Global table stops at field 25; the 4.0 Appendix-I compatibility forms are obsolete here"
witness = "spec:IGES 5.3 section 2.2.4.3.23"
supersedes = ["iges:4.0-fixed-ascii"]

[[dialect]]
# `Dialect::V5_1` (global.rs:74). 5.1, 5.2, and 5.3 take the unrestricted
# `_ => true` arm of `envelope_a_admits` (profile.rs:51), so they re-admit the
# Appendix-I forms that 5.0 rejects. These rows carry no `supersedes` because
# their admission profile is not a monotone extension of 5.0.
id = "iges:5.1-fixed-ascii"
title = "IGES 5.1, Fixed ASCII"
discriminants = { representation = "fixed-ascii", effective_version = "5.1", version_flag = "9" }
seam = "26-field Global table; re-admits the (402,6/8/10/11) and (406,4) forms 5.0 removed"
witness = "spec:IGES 5.3 section 2.2.4.3.23"

[[dialect]]
id = "iges:5.2-fixed-ascii"
title = "IGES 5.2, Fixed ASCII"
discriminants = { representation = "fixed-ascii", effective_version = "5.2", version_flag = "10" }
witness = "spec:IGES 5.3 section 2.2.4.3.23"

[[dialect]]
# The high clamp target: every flag at or above 11 lands here (global.rs:717).
# Fixture verified: Global field 23 is 11 and the Global section carries 26
