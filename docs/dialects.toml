id = "iges:5.3-fixed-ascii"
title = "IGES 5.3, Fixed ASCII"
discriminants = { representation = "fixed-ascii", effective_version = "5.3", version_flag = "11" }
seam = "the high clamp target; a flag above 11 is read as 5.3"
witness = "corpus:crates/cadmpeg-codec-iges/tests/golden/fixtures/line.igs"

[[dialect]]
id = "iges:4.0-compressed-ascii"
title = "IGES 4.0, Compressed ASCII"
discriminants = { representation = "compressed-ascii", effective_version = "4.0", version_flag = "6" }
witness = "spec:IGES 4.0 section 2.3.1"

[[dialect]]
id = "iges:5.0-compressed-ascii"
title = "IGES 5.0, Compressed ASCII"
discriminants = { representation = "compressed-ascii", effective_version = "5.0", version_flag = "8" }
witness = "spec:IGES 5.3 section 2.3.1"
