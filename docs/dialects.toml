witness = "spec:IGES 5.3 Appendix H.1"

[[dialect]]
id = "iges:5.3-binary"
title = "IGES 5.3, Binary"
discriminants = { representation = "binary", effective_version = "5.3", version_flag = "11" }
seam = "Binary Flag Section plus per-section identifier/count headers; a deprecated physical representation with no writer"
witness = "spec:IGES 5.3 Appendix H.1"

[[dialect]]
# The mandatory totality row (design §3.3, B4). The Fixed ASCII block above
# covers every value of the clamped version flag, but the Compressed ASCII and
# Binary blocks stop at the flags whose representation this repository can cite
# a specification for: 6, 8, 9, 10, and 11. A Compressed ASCII or Binary file
# whose clamped flag is 1, 2, 3, 4, 5, or 7 therefore matches no row above, and
# without this row the classification would not be total. The missing rows are
# not invented here: the IGES 3.0 specification would witness them, and each
# one that gains a witness leaves this row and enters the enumeration.
#
# `complete = true` still holds for the format. The version-flag space is
# enumerable from IGES 5.3 section 2.2.4.3.23 and is enumerated above; what
# this row absorbs is a representation/version product the registry declines to
# assert, not an unbounded document space.
#
# The witness is `code:` and stays `code:`: totality is a property of the
# classifier. It records the residual arm that the classifier implements.
id = "iges:unknown"
title = "IGES, unclassified representation and version pair"
discriminants = { residual = "any Confidence >= Low IGES document matching no row above" }
seam = "no declared row states this representation at this version; decode uses the nearest verified Global table and charges iges/source.dialect-unverified"
witness = "code:crates/cadmpeg-codec-iges/src/dialect.rs"

# --------------------------------------------------------------------------
# STEP
# --------------------------------------------------------------------------
# STEP has two independent document-wide discriminants and this registry uses
# only one of them as the identity axis. Recorded as an open question rather
# than decided (design §12, "STEP read basis"):
#
#   FILE_SCHEMA identifier -- the identity axis used below. It is what the
#     encoder's write targets name (`StepSchema::file_schema`,
#     crates/cadmpeg-codec-step/src/options.rs:81-90) and what the design
#     pins as `step:ap242-e3`. Decode never branches on it: it is read after
#     the parse, for reporting (reader/mod.rs:1076-1101) and for DATA-section
#     name matching (parse.rs:790-797).
#
#   FILE_DESCRIPTION implementation level -- the real B1 boundary. It is read
#     before the parse strategy is chosen and selects the section grammar:
#     "1"|"2"|"2;1"|"2;2" -> LegacyEdition1, "3;1"|"3;2" -> LegacyEdition2,
#     "4;1" -> Edition3Class1, "4;2" -> Edition3Class2, "4;3" ->
#     Edition3Class3 (parse.rs:1416-1421, enum at parse.rs:436-443).
#     `allows_edition3_sections` gates ANCHOR/REFERENCE/multi-DATA and
#     `allows_class3_occurrences` gates class-3 occurrences (parse.rs:445-460).
#     Crossing this axis with the schema axis would make the rows disjoint at
#     the cost of ~45 rows, most unwitnessed. Settled: the implementation level
#     stays off the identity axis. `StepDialect::classify`
#     (crates/cadmpeg-codec-step/src/dialect.rs) records it verbatim in
#     `DialectMatch.declared` under `implementation_level` and no row reads it.
#
# The RFC's draft inventory called the AP schema "a *target* axis, not a read
# dialect". Code disagrees in one direction: it is not a read *dispatch* axis,
# but the encoder's targets are dialect ids under design §8.1, so the schema
# rows must exist. The RFC's `part21-clear-text` / `zip-packaged` /
# `part28-xml` triple is not a partition: ZIP packaging is a container fact
# whose `ISO-10303.p21` root still carries a FILE_SCHEMA and classifies into a
# schema row (archive.rs:11, codec.rs:224-226), so it is not an identity row.
[format.step]
complete = false

[[dialect]]
# `StepSchema::Ap203Edition1` (options.rs:83). Fixture verified: line 5 of
# ap203_sheet.p21 is FILE_SCHEMA(('CONFIG_CONTROL_DESIGN')).
id = "step:ap203-e1"
title = "STEP AP203 edition 1 (CONFIG_CONTROL_DESIGN)"
discriminants = { file_schema_identifier = "CONFIG_CONTROL_DESIGN" }
witness = "corpus:crates/cadmpeg-codec-step/tests/fixtures/ap203_sheet.p21"

[[dialect]]
# `StepSchema::Ap203Edition2` (options.rs:84). No fixture carries this
# identifier.
# The discriminant is the schema name. The arcs the encoder writes,
# `{ 1 0 10303 403 2 1 2 }`, discriminate nothing: this is the only edition-2
# AP203 row, and `StepDialect::from_schema_identifier` matches the bare name
# exactly as `schema_identifier_matches` (parse.rs) does for AP214 and AP203
# edition 1. Only the AP242 rows key on arcs, because three of them share one
# name.
id = "step:ap203-e2"
title = "STEP AP203 edition 2 (AP203_CONFIGURATION_CONTROLLED_3D_DESIGN_OF_MECHANICAL_PARTS_AND_ASSEMBLIES_MIM_LF)"
discriminants = { file_schema_identifier = "AP203_CONFIGURATION_CONTROLLED_3D_DESIGN_OF_MECHANICAL_PARTS_AND_ASSEMBLIES_MIM_LF" }
witness = "code:crates/cadmpeg-codec-step/src/options.rs:84"

[[dialect]]
# `StepSchema::Ap214` (options.rs:85). Fixture verified: ap214_sheet.p21 line
# 5 is FILE_SCHEMA(('AUTOMOTIVE_DESIGN')). Two more fixture identifiers,
# 'AP214' and 'AUTOMOTIVE_DESIGN_CC2', match no `StepSchema` variant and
# classify into `step:unknown`.
# The reader admits the bare name or the arc-bearing form
# (`schema_identifier_matches`, parse.rs:1995-2002); the encoder writes
# `AUTOMOTIVE_DESIGN { 1 0 10303 214 1 1 1 1 }` (options.rs:85). The
# discriminant is the name; arcs discriminate nothing here, unlike the
# AP242 editions where they select the row.
id = "step:ap214"
title = "STEP AP214 (AUTOMOTIVE_DESIGN)"
discriminants = { file_schema_identifier = "AUTOMOTIVE_DESIGN" }
witness = "corpus:crates/cadmpeg-codec-step/tests/fixtures/ap214_sheet.p21"

[[dialect]]
# The AP242 schema name with no object identifier. Part 21 makes the object
# identifier optional, so this is a complete, legal declaration: it names the
# schema and leaves the edition unspecified. No `StepSchema` variant writes this
# form -- the encoder always emits arcs -- but it is the form 13 in-tree
# fixtures declare, so the region exists whether or not cadmpeg writes it.
# `StepDialect::Ap242` (crates/cadmpeg-codec-step/src/dialect.rs) is the only
# row reached with the AP242 name and no arcs.
# Disposition: admitted. The reader's single Part 21 grammar is this row's
# declared strategy, and the edition axis is undeclared rather than substituted,
# so no dialect-unverified loss is charged and `DecodeMode::Strict` accepts
# these files.
id = "step:ap242"
title = "STEP AP242, edition unspecified"
discriminants = { file_schema_identifier = "AP242_MANAGED_MODEL_BASED_3D_ENGINEERING_MIM_LF", long_form_arcs = "absent" }
seam = "the object identifier is optional in Part 21 and is absent here, so edition-gated behaviour cannot be verified against the declaration"
witness = "corpus:crates/cadmpeg-codec-step/tests/fixtures/ap242_geometry.p21"

[[dialect]]
# `StepSchema::Ap242Edition1` (options.rs:86); recognizer arcs
# [1,0,10303,442,1,1,4] (options.rs:98). The edition lives in the fifth arc,
# not the seventh (options.rs:60-62).
id = "step:ap242-e1"
title = "STEP AP242 edition 1"
discriminants = { file_schema_identifier = "AP242_MANAGED_MODEL_BASED_3D_ENGINEERING_MIM_LF", long_form_arcs = "1 0 10303 442 1 1 4" }
witness = "code:crates/cadmpeg-codec-step/src/options.rs:98"

[[dialect]]
# `StepSchema::Ap242Edition2` (options.rs:87); arcs [1,0,10303,442,3,1,4]
# (options.rs:99). Fixture verified: ap242_minimal.p21 line 5 carries
# `... { 1 0 10303 442 3 1 4 }`, so the file named "minimal" is an edition-2
# file, not an edition-1 file.
id = "step:ap242-e2"
title = "STEP AP242 edition 2"
discriminants = { file_schema_identifier = "AP242_MANAGED_MODEL_BASED_3D_ENGINEERING_MIM_LF", long_form_arcs = "1 0 10303 442 3 1 4" }
witness = "corpus:crates/cadmpeg-codec-step/tests/fixtures/ap242_minimal.p21"

[[dialect]]
# `StepSchema::Ap242Edition3` (options.rs:88); arcs [1,0,10303,442,4,1,4]
# (options.rs:100). No fixture carries these arcs.
# ap242_ed3_sections.p21 is a genuine Part-21 edition-3 file (implementation
# level "4;2") but declares the bare name 'AP242', so `ap242_edition` returns
# None and it reports "edition unspecified" (codec.rs:202-204). That file
# witnesses the implementation-level axis, not this row.
id = "step:ap242-e3"
title = "STEP AP242 edition 3"
discriminants = { file_schema_identifier = "AP242_MANAGED_MODEL_BASED_3D_ENGINEERING_MIM_LF", long_form_arcs = "1 0 10303 442 4 1 4" }
witness = "code:crates/cadmpeg-codec-step/src/options.rs:100"

[[dialect]]
# `is_part28_xml` (codec.rs:416-437), namespaces at codec.rs:441-444.
# Disposition: `CodecError::NotImplemented("STEP Part 28 XML encoding")` from
# `StepDialect::alternate_encoding_refusal` (dialect.rs), returned by
# `refuse_alternate_encoding` before the ISO-10303-21 magic test. `detect` returns Medium (codec.rs:54-59) so the
# codec claims the file and refuses it rather than letting another codec
# mis-decode it. Structurally identified, semantic decode refused. The refusal
# returns before any exchange structure or report exists, so this row and the
# two below produce no `DialectMatch` today and `Admission::Refused` is
# unreachable in this codec; `StepDialect::alternate_encoding_refusal`
# (dialect.rs) is where the three rows and their refusal messages are named.
id = "step:part28-xml"
title = "ISO 10303-28 edition 2 XML encoding"
discriminants = { xml_root_namespace = "urn:oid:1.0.10303.28.2.1.1 | urn:iso:std:iso:10303:-28:ed-2:tech:XMLschema:common | urn:iso.org:standard:10303:part(28):version(2):xmlschema:common" }
seam = "an XML encoding of the same schemas; no Part-21 exchange structure at all"
witness = "code:crates/cadmpeg-codec-step/src/codec.rs:441"

[[dialect]]
# `is_ap242_bo_model_xml` (codec.rs), namespaces at codec.rs:605-608.
# Refused by `refuse_alternate_encoding` (dialect.rs).
id = "step:ap242-bo-model-xml"
title = "AP242 Business Object Model XML sidecar"
discriminants = { xml_root_namespace = "http://standards.iso.org/iso/ts/10303/-3001/-ed-1/tech/xml-schema/bo_model | .../-ed-2/..." }
witness = "code:crates/cadmpeg-codec-step/src/codec.rs:605"

[[dialect]]
# HDF5 signature at offset 0 or at doubling offsets from 512
# (`is_part26_hdf5`, codec.rs). Refused by `refuse_alternate_encoding`
# (dialect.rs).
id = "step:part26-hdf5"
title = "ISO 10303-26 binary/HDF5 encoding"
discriminants = { magic = "\\x89HDF\\r\\n\\x1a\\n" }
witness = "code:crates/cadmpeg-codec-step/src/codec.rs:399"

[[dialect]]
# Mandatory `unknown` row (B4). A Part-21 exchange whose FILE_SCHEMA
# identifier satisfies no row above is admitted and decoded: the schema string
# is recorded (reader/mod.rs) and nothing branches on it. Two kinds of
# declaration reach here:
#   - an identifier whose schema name matches no row's name. In-tree fixtures:
#     'AP214' (strings.p21), 'AUTOMOTIVE_DESIGN_CC2'
#     (noncanonical_solid_angle.p21), and the literal 'AP242'
#     (ap242_ed3_sections.p21), none of which is a declared schema name.
#   - the AP242 schema name carrying an object identifier that names no
#     declared edition (`ap242_edition`, options.rs:92-104), including arcs
#     that do not read as a numeric object identifier. An edition claim
#     matching nothing is an unrecognized declaration; making no claim at all
#     is `step:ap242`.
# Disposition: admitted-unverified.
id = "step:unknown"
title = "ISO 10303-21 exchange with an unrecognized FILE_SCHEMA identifier"
discriminants = { magic = "ISO-10303-21;", file_schema_identifier = "any other" }
witness = "corpus:crates/cadmpeg-codec-step/tests/fixtures/ap242_ed3_sections.p21"

# --------------------------------------------------------------------------
# Rhino 3DM
# --------------------------------------------------------------------------
# One discriminant: the archive-version word, right-justified ASCII decimal in
# header bytes 24..32 (`file_header::ARCHIVE_VERSION`,
# crates/cadmpeg-codec-rhino/src/layout.rs). `ArchiveVersion::from_word`
# (crates/cadmpeg-codec-rhino/src/chunks.rs) is an exact-equality match on ten
# literal integers; there are no bands. Word 0 is refused at the header layer
# (`parse_header`); every other positive integer becomes
# `ArchiveVersion::Other(_)`.
#
# `crates/cadmpeg-codec-rhino/src/dialect.rs` maps that partition onto the rows
# below: `ArchiveVersion::id` selects the row, `ArchiveVersion::classify` is
# the sole `DialectMatch` construction path, and
# `ArchiveVersion::refuses_decode` is the sole disposition predicate -- it
# decides both the reported `Admission` and the refusal `container::decode`
# returns. `ArchiveVersion::is_chunked` selects the chunked grammar.
#
# The design's open question -- whether archives 2-4 and 50-90 are one read
# grammar or two -- is a grammar question, not an identity question, and is
# left open here. Verified for the record: they are one grammar today.
# `scan_with_record_limit` (container.rs) is the single path for V2..V9; the
# version-dependence inside it is field-width and checksum parameterization,
# not a second parser (`ArchiveVersion::uses_eight_byte_values` = value >= 50;
# `checksum_kind`). V1 alone is a separate grammar (`legacy::decode_v1`).
#
# The openNURBS writer-version stamp (TCODE_WRITER_VERSION 0xa0000026,
# container.rs) is NOT a classification discriminant: it is read out of the
# PROPERTIES table only when an OBJECTS table follows (`scan_with_record_limit`)
# and gates field presence inside records (mesh.rs, brep.rs,
# `BoundedReader::bool_with_writer_version`). It is provenance-shaped evidence
# with a grammar role inside a dialect -- design §3.4 -- and stays out of the
# discriminant set. It is recorded verbatim as the `opennurbs_writer_version`
# declared key on the paths that read the PROPERTIES table, and a missing stamp
# is charged per record as `rhino/source.writer-stamp-unverified`
# (`RhinoLossCode::SourceWriterStampUnverified`), never at the archive level.
# That code is deliberately distinct from the document-level
# `source.dialect-unverified` the other codecs charge when admission is
# `AdmittedUnverified`: rhino charges the per-record one inside admitted
# documents, so the two must not share a string.
[format.rhino]
complete = true

