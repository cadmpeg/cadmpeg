# --------------------------------------------------------------------------
# SolidWorks SLDPRT
# --------------------------------------------------------------------------
# Two document-wide discriminants exist. `swVersion` is the identity axis;
# the container branch is provenance:
#
#   container branch -- the real pre-parse dispatch, and the only one that is
#     read from the leading bytes. `looks_like_sldprt`
#     (crates/cadmpeg-codec-sldprt/src/container.rs:270-288) takes the CFB
#     branch when the prefix carries the compound-file magic AND a directory
#     entry whose last component is `ISolidWorksInformation`
#     (container.rs:278), and the native block-envelope branch when the
#     6-byte marker [0x14,0x00,0x06,0x00,0x08,0x00] appears from offset 8
#     (container.rs:282-287, layout.rs:98). `scan` then hard-sets the version
#     word to 0 on the CFB branch (container.rs:403) and reads a big-endian
#     u32 at offset 4 on the native branch (container.rs:334-338).
#     That outer version word is NEVER compared to anything: its only uses are
#     stringification into an `outer_version` attribute (container.rs:802,
#     decode.rs:3059, decode.rs:3349). It is provenance, not evidence.
#
#   sw_version band -- the identity axis, because it is the only one that
#     selects a byte layout. It is not read from the container header: it is
#     the `swVersion` attribute of a `swSolidWorks` XML payload extracted after
#     the scan (decode.rs:3172-3191) into `SourceMeta.attributes["sw_version"]`
#     and, verbatim, into the match's `sw_version` declared key.
#
# `crates/cadmpeg-codec-sldprt/src/dialect.rs` pins one enum variant per row
# below and derives the row from `form_code_padding` itself, so the
# discriminant the classifier reads and the discriminant the decoder branches
# on are one expression. The two versioned rows are `Admitted`; the residual
# row is `AdmittedUnverified` and charges `source.dialect-unverified` from the
# same predicate, so the biconditional holds by construction. Refusal is never
# a dialect judgement here -- this codec refuses only on container framing,
# I/O, and entity-budget grounds.
#
# The design's §12 question was whether the padding branch is B1 (a dialect)
# or B2 (within-dialect adaptation). Verified against the code, the honest
# answer leans B2: `form_code_padding` does not select a parse strategy for
# the document. It supplies a filter that narrows a candidate list of two
# byte offsets ([8, 4], operations.rs:65-81 and :104-118), and when the
# version is absent the resolver still binds an operation code by requiring
# the candidates to agree (operations.rs:82-91). That is disambiguation
# inside a grammar, not selection of one. The identity rows stand regardless.
#
# `complete = false`: the SolidWorks release space is not enumerable from any
# published document.
[format.sldprt]
complete = false

[[dialect]]
# `form_code_padding` (crates/cadmpeg-codec-sldprt/src/resolved_features/operations.rs:31-38):
# `(version > 0).then_some(if version >= 12_000 { Eight } else { Four })`.
# The exact comparison is `>= 12_000` at operations.rs:33.
id = "sldprt:sw-version-pre-12000"
title = "SolidWorks part with swVersion below 12000"
discriminants = { sw_version = "1..11999" }
seam = "four-byte feature-operation form-code padding, shifting every feature-operation read"
witness = "code:crates/cadmpeg-codec-sldprt/src/resolved_features/operations.rs:33"

[[dialect]]
# Same site, the `Eight` arm. The boundary value 12000 itself belongs to this
# row.
id = "sldprt:sw-version-12000-plus"
title = "SolidWorks part with swVersion 12000 or above"
discriminants = { sw_version = ">= 12000" }
seam = "eight-byte feature-operation form-code padding"
witness = "code:crates/cadmpeg-codec-sldprt/src/resolved_features/operations.rs:33"

[[dialect]]
# Mandatory `unknown` row (B4), and the only row any golden fixture reaches:
# no golden carries a `swSolidWorks` block, so all twenty classify here.
# A part reaches it when `swVersion` is absent or does not read as a `u32`
# above zero (operations.rs:32-33 returns `None` for an absent attribute, for
# a `parse::<u32>()` failure -- which is every non-numeric, negative, or
# over-wide declaration -- and for zero).
# The container branch does not decide this row. `add_solidworks_xml_metadata`
# (decode.rs:3172-3191) walks `ContainerScan::sections`, which chains blocks
# AND compound streams (container.rs:256-261), and `payload_family` returns
# "xml" for any payload starting `<?xml` (container.rs:63-67). A compound-file
# part whose stream carries the `swSolidWorks` document therefore classifies
# by its `swVersion` like any other. The hard-set `0` at container.rs:403 is
# the outer version word, a different field that no row reads.
# Disposition: admitted-unverified, naming itself as `nearest`. The padding
# filter is simply not applied (operations.rs:70, :111) and the ambiguity
# resolver runs unconstrained (operations.rs:82-91), so the strategy
# substituted for the missing declaration is this row's own fallback and no
# other row lent its grammar. That fallback binds an operation code only where
# the four- and eight-byte candidates agree, but agreement between candidates
# is consistency, not a declaration: admission verifies a declared identity and
# this row is the absence of one. A residual row is therefore never `Admitted`,
# and the codec charges `source.dialect-unverified` here, which `DecodeMode::
# Strict` refuses.
id = "sldprt:unknown"
title = "SolidWorks part with no usable swVersion declaration"
discriminants = { sw_version = "absent, not a u32 above zero" }
witness = "code:crates/cadmpeg-codec-sldprt/src/resolved_features/operations.rs:32"

# --------------------------------------------------------------------------
# CATIA V5 CATPart
# --------------------------------------------------------------------------
# `Variant` (crates/cadmpeg-codec-catia/src/variant.rs:12-33) promoted as-is;
# the design calls it an instance of the general concept (§3.1). The pinned-id
# surface is an inherent impl on that same enum in
# `crates/cadmpeg-codec-catia/src/dialect.rs`, not a second enum: `Variant::id`
# maps each variant to the row below, and `dialect::classify` is the only
# construction path for a `DialectMatch` in the crate.
#
# `DialectMatch.declared` carries the `LastSaveVersion` tuple under the keys
# `last_save_version`, `last_save_release`, `last_save_service_pack`,
# `last_save_hot_fix`, and `last_save_build_date`. Those keys are pinned in
# `dialect.rs` beside the enum, not here: the identity registry stays free of
# producer-side key vocabularies (§4).
#
# `identify_variant` (container.rs:1248-1280) is one `match (inner, brep)` over
# structural evidence read before any parse strategy is chosen: the presence
# of a nested `V5_CFV2` sub-container with a `CATIA_V5 CB0001` stream
# directory (`parse_stream_directory`, container.rs:818-835), the uniquely
# largest `MainDataStream` and `SurfacicReps` directory descriptors
# (`brep_stream`, container.rs:1195-1204), a marker census over the
# reconstructed streams (container.rs:1319-1338), and a coherent `E5 0D 03`
# record walk (container.rs:1344-1346).
#
# These are B1 boundaries, not B3 content subsets: every input is a stream
# name or a fixed marker signature read to choose the record grammar, and the
# census counts markers rather than model content.
#
# The `LastSaveVersion` release tuple (container.rs:76-88, parsed at
# container.rs:293-314) is provenance: it is not an argument to
# `identify_variant` and appears in no conditional in the crate. It surfaces
# only as report text (container.rs:1533-1541) and IR attributes
# (assemble.rs:426-435). The numbers 276 and 288 in the design's §13.7 doc
# corrections are cadmpeg's own native-namespace schema version
# (`CATIA_NATIVE_VERSION`, native.rs:25), not a file version; they do not
# belong in this registry.
#
# `complete = false`: the CATIA V5 storage-family space is not published.
[format.catia]
complete = false

