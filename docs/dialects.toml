# --------------------------------------------------------------------------
# Parasolid kernel namespace (embedded layer)
# --------------------------------------------------------------------------
# The namespace is declared but has no producer. No owning crate exists:
# SLDPRT and NX each carry a host-local reader, and neither emits a
# `parasolid:` identity. These rows describe stream identity but do not pin
# producer vocabulary. The hosts record the schema token as an attribute.
#
# The discriminant is the schema token in the transmit-stream header, of the
# form `SCH_<modeller>_<schema>_<format>`. `stream_header`
# (crates/cadmpeg-codec-sldprt/src/parasolid.rs:295-322) requires the `PS\0\0`
# signature, a big-endian u16 length-prefixed description, then the literal
# `SCH_` within a 64-byte window after the description, with the token length
# in the byte immediately preceding it. Absence of `SCH_` fails the whole
# header parse (parasolid.rs:276-278); no token VALUE ever causes rejection.
#
# There is no Parasolid transmit-file (.x_t/.x_b) support anywhere in the
# workspace: Parasolid is reached only as an embedded stream.
#
# `complete = false`: Siemens publishes no schema-token enumeration, and the
# ids below follow the design's pinned `parasolid:sch-sw-33103` shape, which
# truncates the format suffix. The full token is in `discriminants`.
[format.parasolid]
complete = false

[[dialect]]
# The only token observed on the read side. Recorded as the
# `parasolid_schema` attribute (crates/cadmpeg-codec-sldprt/src/decode.rs:3084,
# :3367, container.rs:736) and pinned in all 20 SLDPRT golden decode
# snapshots. The token sits inside a deflate-compressed block payload, so it
# is not greppable in the fixture; it is verified post-inflate in
# tests/golden/decode/document_envelope.json.
id = "parasolid:sch-sw-33103"
pinned = false
title = "Parasolid SolidWorks schema 33103, transmit format 11000"
discriminants = { schema = "SCH_SW_33103_11000" }
witness = "corpus:crates/cadmpeg-codec-sldprt/tests/golden/fixtures/document_envelope.sldprt"

[[dialect]]
# Emitted by the SLDPRT writer when any body in the scope is
# `BodyKind::Sheet` (writer.rs:120-134 at the top level, writer.rs:747-761
# inside `configuration_partitions`), so one file can carry both schemas --
# which is why `ExportReport.emitted_layers` is a Vec (design §8.3). The token
# is not cosmetic: it changes emitted discriminants (face-list head 0x0015 vs
# 0x0013 at writer.rs:2677; face attribute 0x001f vs 0x0015 at
# writer.rs:2733-2736).
# Per B3 the sheet-body test is a within-dialect emission rule, never a
# selectable target. No read-side fixture carries this token.
id = "parasolid:sch-sw-32001"
pinned = false
title = "Parasolid SolidWorks schema 32001, transmit format 11000"
discriminants = { schema = "SCH_SW_32001_11000" }
witness = "code:crates/cadmpeg-codec-sldprt/src/writer.rs:127"

[[dialect]]
# The one token family the read path branches on: a case-insensitive `_13006`
# format suffix gates mesh-polyline decoding
# (parasolid.rs:338-341). Modeller-independent -- the in-tree example is
# `SCH_3201255_32001_13006`.
id = "parasolid:format-13006"
pinned = false
title = "Parasolid mesh/tessellation transmit format 13006"
discriminants = { schema_format_suffix = "_13006" }
seam = "the mesh stream grammar; the only schema value the decoder tests"
witness = "code:crates/cadmpeg-codec-sldprt/src/parasolid.rs:339"

[[dialect]]
# Mandatory `unknown` row (B4). There is no allowlist, match arm, or table of
# schema tokens on the read side: any other `SCH_*` token is admitted,
# recorded verbatim, and branched on nowhere. The only value-sensitive check
# is an equality test that all decoded sites in one document share the same
# schema and description (decode.rs:2091-2096) -- a consistency test, not an
# allowlist. `SCH_SW_33104_12000` is an in-tree example.
id = "parasolid:unknown"
pinned = false
title = "Parasolid stream with an unrecognized schema token"
discriminants = { schema = "any other SCH_ token" }
witness = "code:crates/cadmpeg-codec-sldprt/src/parasolid.rs:313"
