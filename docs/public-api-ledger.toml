# Public API change ledger for the refactor.
# Phase 2+ records each intentional breaking public API change: deletions,
# module moves, visibility reductions, signature changes, removed trait
# implementations, field encapsulations, and variant changes. Additions are
# recorded by the API baseline diff and do not get ledger rows.
# `commit` is the commit whose diff contains the API change. A new row cannot
# contain its own final SHA, so its provisional value names the parent and thus
# the landing range; a provenance pass replaces it with the change commit.
# At phase 9, compare rustdoc public items to the baseline snapshots under
# docs/api-baseline/ and reconcile every difference with a row here.
#
# Lineage baseline is the Phase 0 starting commit on feat/refactor-lego /
# sldprt-l6. The proposal's audit baseline 14a0a4dfc remains an ancestor and is
# recorded for cross-reference; do not reset to main.
