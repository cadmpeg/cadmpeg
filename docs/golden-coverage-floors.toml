# Per-codec golden breadth floors for the refactor.
# Count: regular files under crates/cadmpeg-codec-<id>/tests/golden (recursive).
# These are mesh-size floors, not branch-coverage measurements. Later phases that
# claim "goldens unchanged" must keep each codec at or above its floor.
# Inventor (4) and sat (6, code-built inputs) are the thinnest nets.
# Floors count regular files only. They do not detect a blanked or corrupted
# snapshot. Content comparison and orphan detection live in
# cadmpeg_test_support::golden (Harness::check for frozen fixture files;
# Harness::check_inputs for code-built inputs).
# NX snapshots pin flate2 zlib bytes; regenerate only via the workspace command
# (see [notes].nx). An isolated -p cadmpeg-codec-nx build can pick a different
# flate2 backend and diverge compressor output.
measured_at = "41039916814ce8104db0ec521b71fd03ee21cc3f"
filter = "regular files under crates/cadmpeg-codec-*/tests/golden; exclude dotfiles"

[floors]
catia = 57
creo = 84
f3d = 317
freecad = 48
iges = 324
inventor = 4
nx = 103
rhino = 136
sat = 6
sldprt = 60
step = 38

[notes]
inventor = "thinnest fixture-backed net; 2 inspect + 2 decode snapshots; Harness::check_inputs (code-built streams; inspect+decode branches)"
sat = "six snapshots from code-built inputs (3 inspect + 3 decode); no fixture files; Harness::check_inputs (code-built streams; inspect+decode branches)"
nx = "flat golden directory (103 JSON snapshots at tests/golden root); Harness::check_inputs with Branch kind empty. In-tree arena coverage floors and catalogue-count pins live in crates/cadmpeg-codec-nx/src/golden_tests.rs; they check which native arenas the fixtures populate, which this TOML cannot. Fixtures call zlib_compress at test time, so snapshots pin compressor output. Regenerate with UPDATE_GOLDEN=1 cargo test-fast golden. Do not use cargo test -p cadmpeg-codec-nx: an isolated package build can resolve a different flate2 backend (miniz_oxide vs zlib-rs via feature unification) and diverge zlib bytes."
