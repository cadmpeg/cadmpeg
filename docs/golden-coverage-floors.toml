# Per-codec golden breadth floors for the refactor.
# Count: regular files under crates/cadmpeg-codec-<id>/tests/golden (recursive).
# These are mesh-size floors, not branch-coverage measurements. Later phases that
# claim "goldens unchanged" must keep each codec at or above its floor.
# Inventor (6) and sat (8, code-built inputs) are the thinnest nets.
# Floors count regular files only. They do not detect a blanked or corrupted
# snapshot. Content comparison and orphan detection live in
# cadmpeg_test_support::golden (Harness::check for frozen fixture files;
# Harness::check_inputs for code-built inputs).
# NX snapshots pin flate2 zlib bytes; regenerate only via the workspace command
# (see [notes].nx). An isolated -p cadmpeg-codec-nx build can pick a different
# flate2 backend and diverge compressor output.

[floors]
catia = 80
creo = 84
f3d = 365
freecad = 72
iges = 324
inventor = 6
nx = 112
pvz = 26
rhino = 188
sat = 8
sldprt = 108
step = 42
usd = 156

[notes]
catia = "26 frozen fixture files + 27 inspect + 27 decode snapshots. The external_preview input is code-built and contributes inspect/decode goldens without another frozen fixture file."
f3d = "61 frozen fixture files + 61 inspect + 61 decode + 61 generate + 60 patch + 61 replay artifacts. Counts do not establish semantic coverage."
rhino = "28 frozen fixture files + 28 inspect + 28 decode + 104 encode artifacts. Encode contains 52 successful target cases, each with a binary and export report, across explicit v5 and v8 targets."
step = "19 inspect + 19 decode + 4 encode. The branches are not uniform: inspect and decode run over every fixture through Harness::check, while encode runs over the four stems ENCODE_FIXTURES names, through Harness::check_inputs. A written STEP file is much larger than the report describing it, and those four sources already span every target resolution the writer has: Inherit to the catalog default, Inherit to a non-default row, Inherit to an edition carried in a schema object identifier, and the refusal an edition-less AP242 header must produce. Adding a fixture raises this floor by 2, or by 3 if ENCODE_FIXTURES also names it."
inventor = "thinnest code-built input net; 3 inspect + 3 decode snapshots, including model_states; no frozen fixture files; Harness::check_inputs covers both branches."
sat = "eight snapshots from code-built inputs (4 inspect + 4 decode), including attributed_sphere; no frozen fixture files; Harness::check_inputs covers both branches."
pvz = "twenty-six snapshots from code-built packages (13 inspect + 13 decode): the assembly under each of the five binary structure signatures, the XML structure form, a structure member without its geometry members, closed cubes with f64 and f32 exact streams beside a member whose exact stream does not decode, and closed solids with a seamed cylinder face, a cone face with a singular apex, a rational B-spline face, a face with only secondary pcurves, and faces with inner loops; no authorized .pvz fixture exists; Harness::check_inputs (code-built packages; inspect+decode branches)"
nx = "flat golden directory (112 JSON snapshots at tests/golden root); Harness::check_inputs with Branch kind empty. In-tree arena coverage floors and catalogue-count pins live in crates/cadmpeg-codec-nx/src/golden_tests.rs; they check which native arenas the fixtures populate, which this TOML cannot. Fixtures call zlib_compress at test time, so snapshots pin compressor output. Regenerate with UPDATE_GOLDEN=1 cargo test-fast golden. Do not use cargo test -p cadmpeg-codec-nx: an isolated package build can resolve a different flate2 backend (miniz_oxide vs zlib-rs via feature unification) and diverge zlib bytes."
usd = "156 files: 37 fixtures (13 USDA layers: 10 hand-written from the specification, 2 written by the OpenUSD Python API, 1 with an undeclared header version; 23 USDC layers written by usdcat from those layers, one cube at every crate version; 1 USDZ package) and 2 code-built USDC bootstrap headers, each with inspect, decode, and encode snapshots (117), plus 2 encode snapshots of IR example documents; Harness::check_inputs over the fixture inputs and the code-built inputs"
