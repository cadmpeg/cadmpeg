# Per-codec golden breadth floors for the refactor.
# Count: regular files under crates/cadmpeg-codec-<id>/tests/golden (recursive).
# These are mesh-size floors, not branch-coverage measurements. Later phases that
# claim "goldens unchanged" must keep each codec at or above its floor.
# Inventor (6) and sat (8, code-built inputs) are the thinnest nets.
# Floors count regular files only. They do not detect a blanked or corrupted
# snapshot. Content comparison and orphan detection live in
# cadmpeg_test_support::golden (Harness::check for frozen fixture files;
# Harness::check_inputs for code-built inputs).
# NX snapshots pin flate2 zlib bytes; regenerate only via the workspace command
# (see [notes].nx). An isolated -p cadmpeg-codec-nx build can pick a different
# flate2 backend and diverge compressor output.

[floors]
catia = 84
creo = 84
f3d = 395
freecad = 72
iges = 324
inventor = 8
nx = 127
pvz = 26
rhino = 203
sat = 8
sldprt = 108
step = 42
usd = 156

[notes]
catia = "28 frozen fixture files + 28 inspect + 28 decode snapshots."
f3d = "66 frozen fixture files + 66 inspect + 66 decode + 66 generate + 65 patch + 66 replay artifacts. Counts do not establish semantic coverage."
rhino = "29 frozen fixture files + 29 inspect + 29 decode + 116 encode artifacts across explicit v5 and v8 targets."
step = "20 inspect + 20 decode + 4 encode. The branches are not uniform: inspect and decode run over every fixture through Harness::check, while encode runs over the four stems ENCODE_FIXTURES names, through Harness::check_inputs. A written STEP file is much larger than the report describing it, and those four sources already span every target resolution the writer has: Inherit to the catalog default, Inherit to a non-default row, Inherit to an edition carried in a schema object identifier, and the refusal an edition-less AP242 header must produce. Adding a fixture raises this floor by 2, or by 3 if ENCODE_FIXTURES also names it."
inventor = "Two frozen fixture files and 3 inspect + 3 decode snapshots; Harness::check_inputs covers both branches."
sat = "eight snapshots from code-built inputs (4 inspect + 4 decode), including attributed_sphere; no frozen fixture files; Harness::check_inputs covers both branches."
pvz = "twenty-six snapshots from code-built packages (13 inspect + 13 decode): the assembly under each of the five binary structure signatures, the XML structure form, a structure member without its geometry members, closed cubes with f64 and f32 exact streams beside a member whose exact stream does not decode, and closed solids with a seamed cylinder face, a cone face with a singular apex, a rational B-spline face, a face with only secondary pcurves, and faces with inner loops; no authorized .pvz fixture exists; Harness::check_inputs (code-built packages; inspect+decode branches)"
nx = "Harness::check_inputs uses code-built inputs and a root snapshot branch. Frozen fixture files also supply integration tests. In-tree arena coverage floors and catalogue-count pins live in crates/cadmpeg-codec-nx/src/golden_tests.rs. Fixtures call zlib_compress at test time, so snapshots pin compressor output. Regenerate with UPDATE_GOLDEN=1 cargo test-fast golden. Do not use cargo test -p cadmpeg-codec-nx: an isolated package build can resolve a different flate2 backend (miniz_oxide vs zlib-rs via feature unification) and diverge zlib bytes."
usd = "156 files: 37 fixtures (13 USDA layers: 10 hand-written from the specification, 2 written by the OpenUSD Python API, 1 with an undeclared header version; 23 USDC layers written by usdcat from those layers, one cube at every crate version; 1 USDZ package) and 2 code-built USDC bootstrap headers, each with inspect, decode, and encode snapshots (117), plus 2 encode snapshots of IR example documents; Harness::check_inputs over the fixture inputs and the code-built inputs"
