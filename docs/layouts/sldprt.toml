# --- §4 Typed topology tag inventory ---------------------------------------

[[token]]
tag = "00 0e"
name = "bridge"
payload_bytes = 37
note = "face-use → surface link; magic at body +8; bare record length 37"
section = "4"
anchor = "`00 0e` | bridge / face-use→surface link | 37 | at body +8"

[[token]]
tag = "00 0f"
name = "loop head"
note = "bare record length is at least 14; no magic"
section = "4"
anchor = "`00 0f` | loop head | ≥14 | none"

[[token]]
tag = "00 10"
name = "edge-use"
payload_bytes = 28
note = "bare magic at body +8; deltas magic at body +9 with post-magic [01][hi][lo] or [hi][lo][01] cells; deltas cell 2 carries the curve and direction uses the unique same-edge 0x2b coedge"
section = "4"
anchor = "`00 10` | edge-use | 28 | at body +8"

[[token]]
tag = "00 11"
name = "oriented coedge"
payload_bytes = 21
note = "bare body has no magic; deltas refs are nine [hi][lo][01] cells and the marker follows"
section = "4"
anchor = "`00 11` | oriented coedge | 21 | none"

[[token]]
tag = "00 12"
name = "vertex-use"
payload_bytes = 24
note = "magic at body +16"
section = "4"
anchor = "`00 12` | vertex-use | 24 | at body +16"

[[token]]
tag = "00 1d"
name = "world point"
payload_bytes = 38
note = "no magic; four references at body +6 and xyz as three f64 BE at body +14"
section = "4"
anchor = "`00 1d` | world point | 38 | none"

[[record]]
name = "world_point"
kind = "byte"
section = "4"
anchor = "a bare `00 1d` record has four references at body +6, requires reference 0 to be sentinel `0` or `1`, and stores xyz as three f64 BE at body +14, in metres"
size = 38
endianness = "big"
note = "Offsets are body-relative, i.e. after the two-byte `00 1d` tag. Attrs `0` and `1` are sentinels, not world points."

[[record.field]]
name = "refs"
offset = 6
type = "u16[4]"
source = "spec"
anchor = "four references at body +6"

[[record.field]]
name = "xyz"
offset = 14
type = "f64[3]"
source = "spec"
anchor = "stores xyz as three f64 BE at body +14, in metres"

[[record.gap]]
offset = 0
size = 6
note = "§4 states no field between the body start and the reference block at +6."

# --- §5 Entity records -----------------------------------------------------

[[record]]
name = "entity_common_header"
kind = "byte"
section = "5"
anchor = "A `00 51` header is `flags u32 BE`, `attr u16 BE`, `seq u32 BE`, and `disc u16 BE`."
size = 12
endianness = "big"
note = "Body-relative, after the two-byte family tag. An optional `ff` byte can occur between the `00 51` tag and `flags`; it shifts every following field by one byte. Slot values follow at +12 with the schema, disc, and flo count table in specification section 5."

[[record.field]]
name = "flags"
offset = 0
type = "u32"
source = "spec"
anchor = "`flags u32 BE`"
