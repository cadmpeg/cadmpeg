kind = "byte"
section = "1.1"
anchor = "A block begins with the marker `14 00 06 00 08 00` and uses this frame"
size = 26
endianness = "little"
note = "Fixed prefix only. `preamble[pre_sz]` and `payload[comp_sz]` follow; the record extent is `block_end = marker_offset + 26 + pre_sz + comp_sz`."

[[record.field]]
name = "marker"
offset = 0
type = "bytes[6]"
source = "spec"
anchor = "marker bytes[6] ; 14 00 06 00 08 00"
