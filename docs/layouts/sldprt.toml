offset = 19
type = "bytes[6]"
source = "spec"
anchor = "+19 instance_marker bytes[6]       ; 00 00 00 01 01 64"

[[record.field]]
name = "ccz"
offset = 25
type = "bytes[3]"
source = "spec"
anchor = "+25 ccz             bytes[3]       ; CCZ"

[[record.field]]
name = "type_tag"
offset = 28
type = "u32"
source = "spec"
anchor = "+28 type_tag        u32 BE         ; 20"

[[record.field]]
name = "class_token"
offset = 32
type = "u16"
source = "spec"
anchor = "+32 class_token     u16 BE"

[[record.field]]
name = "root_count"
offset = 34
type = "u32"
source = "spec"
