# SPDX-License-Identifier: Apache-2.0
# Machine-readable record layouts for SolidWorks `.sldprt`.
schema = 1
format = "sldprt"
spec = "docs/formats/sldprt.md"
note = """
Covers the container envelopes (§1, §1.1-§1.3), the typed topology tag
inventory (§4), the entity common header (§5), and the Parasolid geometry
carriers (§7.1-§7.4). §2 documents about 125 distinct ResolvedFeatures marker
layouts in prose; the fixed-offset profile and sketch-input layouts are tabulated
below, and the remaining layouts are listed under "Not tabulated" with a coverage
note.

Endianness is stated per lane: §1 container words are little-endian, §4-§7
Parasolid payload words are big-endian. Where a §1 field states no endianness
the table says `unstated` and says so in the field note.
"""

# --- Container envelopes ---------------------------------------------------

[[record]]
name = "outer_header"
kind = "byte"
section = "1.1"
anchor = "The file starts with an 8-byte header"
size = 8
endianness = "unstated"

[[record.field]]
name = "file_id"
offset = 0
type = "u32"
source = "spec"
anchor = "`file_id` (u32)"
note = "The spec states the width but not the byte order of this field, unlike `version` on the same line."

[[record.field]]
name = "version"
offset = 4
type = "u32"
endianness = "big"
source = "spec"
anchor = "`version` (u32 **big-endian**, value `0x00000004`)"

[[record]]
name = "block_frame_header"
kind = "byte"
section = "1.1"
anchor = "A block begins with the marker `14 00 06 00 08 00` and uses this frame"
size = 26
endianness = "little"
note = "Fixed prefix only. `preamble[pre_sz]` and `payload[comp_sz]` follow; the record extent is `block_end = marker_offset + 26 + pre_sz + comp_sz`."

[[record.field]]
name = "marker"
offset = 0
type = "bytes[6]"
source = "spec"
anchor = "marker bytes[6] ; 14 00 06 00 08 00"

[[record.field]]
name = "type_id"
offset = 6
type = "u32"
source = "spec"
anchor = "type_id u32 LE"

[[record.field]]
name = "crc32"
offset = 10
type = "u32"
source = "spec"
anchor = "crc32 u32 LE ; CRC-32 of the DECOMPRESSED payload"

[[record.field]]
name = "comp_sz"
offset = 14
type = "u32"
source = "spec"
anchor = "comp_sz u32 LE"

[[record.field]]
name = "uncomp_sz"
offset = 18
type = "u32"
source = "spec"
anchor = "uncomp_sz u32 LE"

[[record.field]]
name = "pre_sz"
offset = 22
type = "u32"
source = "spec"
anchor = "pre_sz u32 LE"

[[record.code]]
path = "crates/cadmpeg-codec-sldprt/src/container.rs"
contains = "const BLOCK_HEADER_LEN: usize = 26;"
note = "The parser's block-header length matches the 26-byte fixed prefix this table tiles."

[[record.code]]
path = "crates/cadmpeg-codec-sldprt/src/container.rs"
contains = "pub const MARKER: [u8; 6] = [0x14, 0x00, 0x06, 0x00, 0x08, 0x00];"
note = "The parser's marker matches the spec's stated marker bytes."

[[record]]
name = "cache_cell_header"
kind = "byte"
section = "1.2"
anchor = "The three size-shaped header fields are redundant scalings of one logical value `L`"
size = 26
endianness = "unstated"
note = "Fixed prefix only; a nibble-swapped section name of `name_len` bytes follows at +26. The three size fields are redundant scalings of one logical value `L`."

[[record.field]]
name = "two_l"
offset = 10
type = "u32"
source = "spec"
anchor = "field@+10 == 2*L"
note = "§1.2 states the offset but not the byte order of this field."

[[record.field]]
name = "half_l"
offset = 14
type = "u32"
source = "spec"
anchor = "field@+14 == L // 2"
note = "§1.2 states the offset but not the byte order of this field."

[[record.field]]
name = "l"
offset = 18
type = "u32"
source = "spec"
anchor = "field@+18 == L"
note = "§1.2 states the offset but not the byte order of this field."

[[record.field]]
name = "name_len"
offset = 22
type = "u32"
source = "spec"
anchor = "field@+22 == name_len"
note = "§1.2 states the offset but not the byte order of this field. Valid when `0 < name_len < 500`."

[[record.gap]]
offset = 0
size = 10
note = "Marker and the field between it and +10. §1.2 states the cell reuses the outer marker but gives no offsets in this region."

[[record]]
name = "tail_directory_entry"
kind = "byte"
section = "1.3"
anchor = "Fixed-shape frames, each naming one OPC part"
size = 40
endianness = "little"
note = "Fixed prefix only. `name[name_len]` follows at +40 and a 6-byte trailer follows the name."

[[record.field]]
name = "marker"
offset = 0
type = "bytes[6]"
source = "spec"
anchor = "+0 marker bytes[6] ; 14 00 06 00 08 00"

[[record.field]]
name = "type_id"
offset = 6
type = "u32"
source = "spec"
anchor = "+6 type_id u32 LE"

[[record.field]]
name = "zero_at_10"
offset = 10
type = "u32"
source = "spec"
anchor = "+10 zero u32 LE"

[[record.field]]
name = "size"
offset = 14
type = "u32"
source = "spec"
anchor = "+14 size u32 LE ; section's stored/uncompressed size"

[[record.field]]
name = "zero_at_18"
offset = 18
type = "u32"
source = "spec"
anchor = "+18 zero u32 LE"

[[record.field]]
name = "name_len"
offset = 22
type = "u32"
source = "spec"
anchor = "+22 name_len u32 LE"

[[record.field]]
name = "descriptor"
offset = 26
type = "bytes[14]"
source = "spec"
anchor = "+26 descriptor bytes[14]"

[[record]]
name = "zlb_wrapper_header"
kind = "byte"
section = "1"
anchor = "Compound streams whose names end in `__ZLB` use a nested semantic-payload wrapper."
size = 24
endianness = "little"
note = "Fixed prefix only; the zlib member follows and an 8-byte trailer closes the wrapper."

[[record.field]]
name = "magic"
offset = 0
type = "bytes[16]"
source = "spec"
anchor = "The wrapper is the 16-byte magic `23 1d d5 71 da 81 48 a2 a8 58 98 b2 1b 89 ef 99`"

[[record.field]]
name = "uncompressed_size"
offset = 16
type = "u32"
source = "spec"
anchor = "followed by the uncompressed byte count as u32 LE"

[[record.field]]
name = "zlib_member_size"
offset = 20
type = "u32"
source = "spec"
anchor = "the complete zlib-member byte count as u32 LE"

[[record.code]]
path = "crates/cadmpeg-codec-sldprt/src/compound.rs"
contains = "WRAPPED_PAYLOAD_MAGIC"
note = "The parser names the same 16-byte wrapper magic."

# --- §4 Typed topology tag inventory ---------------------------------------

[[token]]
tag = "00 0e"
name = "bridge"
payload_bytes = 37
note = "face-use → surface link; magic at body +8; bare record length 37"
section = "4"
anchor = "`00 0e` | bridge / face-use→surface link | 37 | at body +8"

[[token]]
tag = "00 0f"
name = "loop head"
note = "bare record length is at least 14; no magic"
section = "4"
anchor = "`00 0f` | loop head | ≥14 | none"

[[token]]
tag = "00 10"
name = "edge-use"
payload_bytes = 28
note = "magic at body +8"
section = "4"
anchor = "`00 10` | edge-use | 28 | at body +8"

[[token]]
tag = "00 11"
name = "oriented coedge"
payload_bytes = 21
note = "no magic"
section = "4"
anchor = "`00 11` | oriented coedge | 21 | none"

[[token]]
tag = "00 12"
name = "vertex-use"
payload_bytes = 24
note = "magic at body +16"
section = "4"
anchor = "`00 12` | vertex-use | 24 | at body +16"

[[token]]
tag = "00 1d"
name = "world point"
payload_bytes = 38
note = "no magic; four references at body +6 and xyz as three f64 BE at body +14"
section = "4"
anchor = "`00 1d` | world point | 38 | none"

[[record]]
name = "world_point"
kind = "byte"
section = "4"
anchor = "a bare `00 1d` record has four references at body +6, requires reference 0 to be sentinel `0` or `1`, and stores xyz as three f64 BE at body +14, in metres"
size = 38
endianness = "big"
note = "Offsets are body-relative, i.e. after the two-byte `00 1d` tag. Attrs `0` and `1` are sentinels, not world points."

[[record.field]]
name = "refs"
offset = 6
type = "u16[4]"
source = "spec"
anchor = "four references at body +6"

[[record.field]]
name = "xyz"
offset = 14
type = "f64[3]"
source = "spec"
anchor = "stores xyz as three f64 BE at body +14, in metres"

[[record.gap]]
offset = 0
size = 6
note = "§4 states no field between the body start and the reference block at +6."

# --- §5 Entity records -----------------------------------------------------

[[record]]
name = "entity_common_header"
kind = "byte"
section = "5"
anchor = "Common header: `flags u32 BE`, `attr u16 BE`, `seq u32 BE`, `disc u16 BE`."
size = 12
endianness = "big"
note = "Body-relative, after the two-byte family tag. An optional `ff` byte can occur between the `00 51` tag and `flags`; it shifts every following field by one byte. Slot values follow at +12 with a slot count keyed by `(schema, disc, flo)` that the spec does not enumerate."

[[record.field]]
name = "flags"
offset = 0
type = "u32"
source = "spec"
anchor = "`flags u32 BE`"
note = "`flo` is the low byte of `flags`."

[[record.field]]
name = "attr"
offset = 4
type = "u16"
source = "spec"
anchor = "`attr u16 BE`"

[[record.field]]
name = "seq"
offset = 6
type = "u32"
source = "spec"
anchor = "`seq u32 BE`"

[[record.field]]
name = "disc"
offset = 10
type = "u16"
source = "spec"
anchor = "`disc u16 BE`"

[[record]]
name = "attribute_instance_00_51"
kind = "byte"
section = "5"
anchor = "A `00 51` attribute instance whose u16 at body +6 is zero carries the u16 definition node id at body +10 and, at body +12, the attribute id of the entity it hangs on."
size = 14
endianness = "big"
note = "Body-relative. Node references follow from body +14 until the next record tag. The +0..+6 region is the common-header `flags` and `attr` of the same record."

[[record.field]]
name = "zero_selector"
offset = 6
type = "u16"
source = "spec"
anchor = "whose u16 at body +6 is zero"

[[record.field]]
name = "definition_node_id"
offset = 10
type = "u16"
source = "spec"
anchor = "carries the u16 definition node id at body +10"

[[record.field]]
name = "owner_attribute_id"
offset = 12
type = "u16"
source = "spec"
anchor = "and, at body +12, the attribute id of the entity it hangs on"

[[record.gap]]
offset = 0
size = 6
note = "Common-header `flags` and `attr`; §5 states no attribute-instance-specific field here."

[[record.gap]]
offset = 8
size = 2
note = "§5 states no field between the +6 selector and the +10 definition node id."

