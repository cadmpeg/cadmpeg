anchor = "+38 roots_preamble  bytes[6]       ; 00 00 00 00 00 01"

[[record.code]]
path = "crates/cadmpeg-codec-sldprt/src/brep/entity.rs"
contains = 'const CLASS_ROOT_INDEX_PREFIX: &[u8] = b"CI\x10index_map_offset\0\0\0\x01\x01dCCZ\0\0\0\x14";'
note = "The parser matches the fixed signature through type_tag before it reads the variable token and root count."

# --- §7.1 Compact analytic carriers ----------------------------------------

[[record]]
name = "compact_analytic_header"
kind = "byte"
section = "7.1"
anchor = "00 TT [ff]? attr u16 BE ordinal u32 BE refs u16 BE[5] marker u8 (0x2b|0x2d) values f64 BE[n]"
size = 17
endianness = "big"
note = "Body-relative, after the two-byte `00 TT` tag and the optional `ff`. The partition form uses five u16 references and places the marker at +16; the deltas form uses five [hi][lo][01] reference triples and places it at +21. Values follow the marker in either form; `n` is the per-tag f64 count. All scalar payload values are finite, and no coordinate-magnitude cutoff is part of the format. A carrier is accepted only for a unique framing."

[[record.field]]
name = "attr"
offset = 0
type = "u16"
source = "spec"
anchor = "attr u16 BE"

[[record.field]]
name = "ordinal"
offset = 2
type = "u32"
source = "spec"
anchor = "ordinal u32 BE"

[[record.field]]
