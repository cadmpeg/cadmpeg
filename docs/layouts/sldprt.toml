# SPDX-License-Identifier: Apache-2.0
# Machine-readable record layouts for SolidWorks `.sldprt`.
schema = 1
format = "sldprt"
spec = "docs/formats/sldprt.md"
note = """
Covers the container envelopes (§1, §1.1-§1.3), the typed topology tag
inventory (§4), the entity common header (§5), the class-root directory (§6),
and the Parasolid geometry carriers (§7.1-§7.4). §2 documents about 125 distinct ResolvedFeatures marker
layouts in prose; the fixed-offset profile, sketch-input, reference-plane,
temporary-axis, and
cosmetic-thread carrier layouts are tabulated below, and the remaining layouts
are listed under "Not tabulated" with a coverage note.

Endianness is stated per lane: §1 container words are little-endian, §4-§7
Parasolid payload words are big-endian. Where a §1 field states no endianness
the table says `unstated` and says so in the field note.
"""

[[record]]
name = "feature_input_shifted_scalar_trailer"
parsed_by = "crates/cadmpeg-codec-sldprt/src/resolved_features/relation_records.rs"
kind = "byte"
section = "2"
anchor = "A shifted value-only scalar record has a 35-byte trailer"
size = 35
endianness = "little"
note = "The value-only scalar's fixed trailer prefix. Variable-count feature_input_operand_cell12 records follow at +35."

[[record.field]]
name = "zero_prefix"
offset = 0
type = "bytes[3]"
source = "spec"
anchor = "three zero bytes"

[[record.field]]
name = "object_id"
offset = 3
type = "u32"
source = "spec"
anchor = "little-endian u32 object identifier at trailer +3"

[[record.field]]
name = "zero_object_tail"
offset = 7
type = "bytes[14]"
source = "spec"
anchor = "fourteen zero bytes at trailer +7"

[[record.field]]
name = "layout_marker"
offset = 21
type = "bytes[6]"
source = "spec"
anchor = "`01 00 00 00 02 00` at trailer +21"

[[record.field]]
name = "role"
offset = 27
type = "u8"
source = "spec"
anchor = "a role byte at trailer +27"

[[record.field]]
name = "zero_tail"
offset = 28
type = "bytes[7]"
source = "spec"
anchor = "seven zero bytes at trailer +28"

[[record]]
name = "feature_input_operand_cell12"
parsed_by = "crates/cadmpeg-codec-sldprt/src/resolved_features/scalars.rs"
kind = "byte"
section = "2"
anchor = "Each cell stores its little-endian u16 tag at +0"
size = 12
endianness = "little"
note = "Primary and legacy named-scalar operand cell. A lane-local class declaration can begin immediately after this cell."

[[record.field]]
name = "class_token"
offset = 0
type = "u16"
source = "spec"
anchor = "little-endian u16 tag at +0"

[[record.field]]
name = "marker_address"
offset = 2
type = "u16"
source = "spec"
anchor = "u16 marker address at +2"

[[record.field]]
name = "reference_sentinel"
offset = 4
type = "bytes[4]"
source = "spec"
anchor = "`ff ff ff ff` at +4"

[[record.field]]
name = "zero_trailer"
offset = 8
type = "bytes[4]"
source = "spec"
anchor = "four zero bytes at +8"


# --- Container envelopes ---------------------------------------------------

