[[not_applicable]]
area = "ResolvedFeatures sketch and feature-input markers (§2)"
reason = "The remaining marker layouts are about 125 distinct records, each one prose paragraph stating marker-relative offsets for a specific record length. The fixed-offset layouts above cover the currently tabulated profile, sketch-input, and reference-plane forms; the remaining paragraphs are transcribable in principle and can be added incrementally."
section = "2"
anchor = "Each prefix is followed by eight `ff` bytes and the little-endian f32 `-1.0`"

[[not_applicable]]
area = "Body records (§6)"
reason = "Apart from the class-root directory, §6 states slot-reference graphs and population invariants over about thirty named disc layouts. Those layouts state no byte offsets; their slot values are reached through the §5 common header and the §10 framing arithmetic."
section = "6"
anchor = "Slot values `0` and `1` are sentinels."

[[not_applicable]]
area = "Inline record framing (§10)"
reason = "Framing arithmetic rather than a fixed-offset record: the zero byte after a prefixed triple run self-delimits that form, while `end = pos + 14 + 2*slot_count` for a bare record. Specification section 5 gives the supported schema, disc, and flo slot-count table."
section = "10"
anchor = "For a prefixed subrecord, `body[14] == 0x01`, each slot is `[01][hi][lo]`, and the first byte after the slot run is `00`"

[[not_applicable]]
area = "SWIFT semantic PMI object graph (§2.1)"
reason = "Token-framed variable-length grammar. Every entity and section is delimited by Pascal-string tokens and counted key/value or relation rosters; no field has a fixed offset from the stream or entity start."
section = "2.1"
anchor = "Entity sections use these grammars"

[[not_applicable]]
