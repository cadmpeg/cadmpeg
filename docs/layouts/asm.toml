# SPDX-License-Identifier: Apache-2.0
# Machine-readable record layouts for the Autodesk ShapeManager (ASM) stream.
# Every row cites a section of docs/formats/asm.md and a phrase inside it.
schema = 1
format = "asm"
spec = "docs/formats/asm.md"
endianness = "little"
note = """
Covers the two ASM stream headers and ACIS 217/218 header (§1), the SAB tag inventory (§2.1), the
fixed-size ASM topology records (§5.2, §5.3), and the analytic geometry
carriers (§6.2, §6.3) as ordered token slots. Procedural spline carriers are
variable-length token graphs and are listed under "Not tabulated".
"""

# --- Composite units -------------------------------------------------------

[[type]]
name = "sab_ref8"
bytes = 9
endianness = "little"
note = "`BinaryFile8` reference/integer chunk: one tag byte plus an eight-byte value."
section = "5.2"
anchor = "ref/int chunks are 9 bytes"

[[type]]
name = "sab_f64"
bytes = 9
endianness = "little"
note = "`0x06` DOUBLE tag byte plus an eight-byte IEEE float64 payload."
section = "2.1"
anchor = "`0x06` | DOUBLE | 8 B | IEEE float64"

[[type]]
name = "sab_position"
bytes = 25
endianness = "little"
note = "`0x13` POSITION tag byte plus three little-endian f64 coordinates."
section = "2.1"
anchor = "`0x13` | POSITION | 24 B | 3D point (3×f64)"

[[type]]
name = "sab_vector3d"
bytes = 25
endianness = "little"
note = "`0x14` VECTOR_3D tag byte plus three little-endian f64 components."
section = "2.1"
anchor = "`0x14` | VECTOR_3D | 24 B | 3D vector (3×f64)"

[[type]]
name = "sab_logical"
bytes = 1
endianness = "n/a"
note = "A bare `0x0A` TRUE or `0x0B` FALSE tag; the tag is the whole value."
section = "2.1"
anchor = "`0x0B` | FALSE | 0 B | logical false / sentinel"

# --- Tag inventory (§2.1) --------------------------------------------------

[[token]]
tag = "0x02"
name = "CHAR"
payload_bytes = 1
note = "unsigned 8-bit"
section = "2.1"
anchor = "`0x02` | CHAR | 1 B | unsigned 8-bit"

[[token]]
tag = "0x03"
name = "SHORT"
payload_bytes = 2
note = "signed 16-bit"
section = "2.1"
anchor = "`0x03` | SHORT | 2 B | signed 16-bit"

[[token]]
tag = "0x04"
name = "LONG"
note = "signed int, 32 or 64-bit per the header width"
section = "2.1"
anchor = "`0x04` | LONG | ref_size | signed int (32 or 64-bit per header)"

[[token]]
tag = "0x05"
name = "FLOAT"
payload_bytes = 4
note = "IEEE float32"
section = "2.1"
anchor = "`0x05` | FLOAT | 4 B | IEEE float32"

[[token]]
tag = "0x06"
name = "DOUBLE"
payload_bytes = 8
note = "IEEE float64"
section = "2.1"
anchor = "`0x06` | DOUBLE | 8 B | IEEE float64"

[[token]]
tag = "0x0A"
name = "TRUE"
payload_bytes = 0
note = "logical true; a data token, not a terminator"
section = "2.1"
anchor = "`0x0A` | TRUE | 0 B | logical true"

[[token]]
tag = "0x0B"
name = "FALSE"
payload_bytes = 0
note = "logical false / sentinel"
section = "2.1"
anchor = "`0x0B` | FALSE | 0 B | logical false / sentinel"

[[token]]
tag = "0x0C"
name = "ENTITY_REF"
note = "RecordTable index; `ref_size` wide"
section = "2.1"
anchor = "`0x0C` | ENTITY_REF | ref_size | RecordTable index"

[[token]]
tag = "0x0D"
name = "IDENT"
note = "record/class name token (leaf); one length byte plus N name bytes"
section = "2.1"
anchor = "`0x0D` | IDENT | 1 + N | record/class name token (leaf)"

[[token]]
tag = "0x0E"
name = "SUBIDENT"
note = "base-class name token; one length byte plus N name bytes"
section = "2.1"
anchor = "`0x0E` | SUBIDENT | 1 + N | base-class name token"

[[token]]
tag = "0x11"
name = "TERMINATOR"
payload_bytes = 0
note = "end of the current top-level record"
section = "2.1"
anchor = "`0x11` | TERMINATOR | 0 B | end of current record"

[[token]]
tag = "0x13"
name = "POSITION"
payload_bytes = 24
note = "3D point, three f64; centimetres"
section = "2.1"
anchor = "`0x13` | POSITION | 24 B | 3D point (3×f64)"

[[token]]
tag = "0x14"
name = "VECTOR_3D"
payload_bytes = 24
note = "3D vector, three f64"
section = "2.1"
anchor = "`0x14` | VECTOR_3D | 24 B | 3D vector (3×f64)"

[[token]]
tag = "0x15"
name = "ENUM_VALUE"
note = "enumeration or secondary integer; `ref_size` wide"
section = "2.1"
anchor = "`0x15` | ENUM_VALUE | ref_size | enumeration / secondary integer"

[[token]]
tag = "0x16"
name = "VECTOR_2D"
payload_bytes = 16
note = "2D (u,v)"
section = "2.1"
anchor = "`0x16` | VECTOR_2D | 16 B | 2D `(u,v)`"

[[token]]
tag = "0x17"
name = "INT64"
payload_bytes = 8
note = "AutoCAD int64 attribute value; eight bytes in either header width"
section = "2.1"
anchor = "`0x17` | INT64 | 8 B | AutoCAD int64 attribute value"

# --- §1 Stream headers -----------------------------------------------------

[[record]]
