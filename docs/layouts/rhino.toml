[[record]]
name = "endoffile_record_wide"
dialects = ["rhino:archive-50", "rhino:archive-60", "rhino:archive-70", "rhino:archive-80", "rhino:archive-90", "rhino:unknown"]
parsed_by = "crates/cadmpeg-codec-rhino/src/chunks.rs"
kind = "byte"
section = "5"
anchor = "archive version >= 50  length = 8, u64 file_size"
size = 20
note = "`TCODE_ENDOFFILE = 0x00007fff` is a long, unchecksummed chunk whose declared length is exactly the file-size field width. The stored size includes the 32-byte header, all preceding chunks, the EOF typecode, the EOF value field, and the file-size field. Below archive version 50 the length and size words are four bytes each and the record is 12 bytes; that narrow form has no record of its own here. `rhino:unknown` is keyed because an unenumerated version word at or above 50 reads this layout. The 20-byte total is derived from the three stated widths; the spec states no total."

