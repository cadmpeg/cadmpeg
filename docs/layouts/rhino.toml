name = "on_uuid"
bytes = 16
endianness = "little"
note = "Mixed-endian GUID: `Data1` u32 LE, `Data2` u16 LE, `Data3` u16 LE, `Data4` eight bytes unchanged."
section = "3.3"
anchor = "Data1: u32 little-endian"

