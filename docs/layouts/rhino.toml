note = "The narrow form: a 4-byte `i32` length word, selected when the archive-version word is below 50 (`ArchiveVersion::uses_eight_byte_values`). `declared_length` bytes of body follow and include the trailing checksum when present. `rhino:unknown` is keyed on both this record and its wide sibling: the residual row is any version word outside the enumerated ten, and the width follows the word, not the row."

