# SPDX-License-Identifier: Apache-2.0
# Machine-readable record layouts for Siemens NX `.prt`.
schema = 1
format = "nx"
spec = "docs/formats/siemens_nx.md"
note = """
Covers the SPLMSSTR and legacy CFB containers (§2 and §2.4), the Parasolid XT fixed record families
(§4.1), the topology node field maps (§5.1), the analytic payload offsets
(§6.1), the B-spline descriptor prefixes (§6.2), the trimmed and SP curve
carriers (§6.4), the rolling-ball blend (§6.5), and the CHART_s preamble
(§6.3).

Endianness follows the two lanes §1 states: SPLMSSTR and UG_PART table fields
are little-endian, Parasolid neutral-binary payload fields are big-endian. Each
record states which lane it is in.
"""

[[type]]
name = "u48"
bytes = 6
endianness = "little"
note = "48-bit unsigned little-endian offset word used by the SPLMSSTR header."
section = "2"
anchor = "0x11..0x16 FOOTER offset, 48-bit LE"

[[type]]
name = "xmt_ref"
bytes = 2
endianness = "big"
note = "Parasolid XMT index, small form: a big-endian u16. The large form is a negative i16 remainder plus a u16 quotient and occupies 4 bytes, shifting every later fixed field in the record."
section = "3.1"
anchor = "| Small index | `uint16` BE, 2 bytes |"

