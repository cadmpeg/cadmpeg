# SPDX-License-Identifier: Apache-2.0
# Record layouts for ISO 10303-21 STEP exchange files.
schema = 1
format = "step"
spec = "docs/formats/step.md"
note = """
STEP has no fixed-width record layout to tabulate. It is an ISO 10303-21
clear-text grammar with keyword-delimited sections and EBNF productions.
Line breaks have the same separator role as other whitespace. The format fixes
field position and width only inside the binary literal's quoted nibble
sequence.

The one bit-level rule in the format is the binary literal's nibble packing,
recorded below as a slot layout because it is the only place the specification
fixes a field's position and width. Everything else is listed as not
applicable, with the reason.
"""

[[record]]
name = "binary_literal"
kind = "slot"
section = "3"
anchor = "A binary literal starts with one indicator nibble and continues with hexadecimal payload digits."
note = "Nibble-level, not byte-level: positions are hexadecimal digits inside a quoted literal, not bytes in a record. Recorded because it is the only fixed-position field the format defines."

[[record.field]]
name = "indicator"
type = "u8"
endianness = "n/a"
source = "spec"
anchor = "The indicator gives the number of unused low-order bits in the final payload digit."
note = "One hexadecimal digit, value 0 through 3. Single nibble, so no byte order applies."

[[record.field]]
name = "payload"
type = "text"
source = "spec"
anchor = "Payload digits pack most-significant nibble first. The decoded bit length is four times the payload digit count minus the indicator."
note = "Hexadecimal digits, most-significant nibble first. An empty payload uses indicator zero."

# --- Not tabulated -----------------------------------------------------------

[[not_applicable]]
area = "Exchange structure"
reason = "N/A, text grammar. The exchange structure is an EBNF production over keyword-delimited sections. Nothing in it has a fixed byte position or width."
section = "2"
anchor = "exchange = \"ISO-10303-21;\" header anchor? reference? data+"

[[not_applicable]]
area = "Tokens and values"
reason = "N/A, text grammar. Tokens are whitespace- and comment-separated, case-insensitive, and line-oriented layout has no semantic role."
section = "3"
anchor = "Line breaks have the same separator role as other whitespace."

[[not_applicable]]
area = "Entity parameter slot order"
reason = "N/A, text grammar. Complex-instance partial records use ascending entity-name order. Entity-specific parameter positions come from EXPRESS external mapping and vary by entity type."
section = "5"
anchor = "Complex-instance partial records appear in ascending entity-name order."

[[not_applicable]]
area = "Header section"
reason = "N/A, text grammar. The header is a sequence of entity instances with the same token grammar as the data section."
section = "6"
anchor = "## 6. Header"

[[not_applicable]]
area = "Edition 3 sections"
reason = "N/A, text grammar. Anchor, reference, and signature sections use keyword-delimited entry lists. The table covers fixed byte-position fields only."
section = "7"
anchor = "## 7. Edition 3 sections"
