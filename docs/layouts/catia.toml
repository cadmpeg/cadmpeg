endianness = "big"
source = "spec"
anchor = "ds+0x50 : extent_count k         (u32be)"

[[record.gap]]
offset = 0
size = 12
note = "The spec states no field between the descriptor start and the logical stream length at ds+0x0c."

[[record.gap]]
offset = 16
size = 64
note = "The standard name lies before ds and ends at the fixed tail ds-3..ds. In the legacy form, ds+0x10 starts the variable-length printable UTF-16LE run; its terminator and the remaining bytes through ds+0x50 are zero."


[[record]]
name = "extent_struct"
kind = "byte"
section = "3.4"
anchor = "ds+0x54 : k extent structs, 20 bytes each:"
size = 20
endianness = "big"
note = "`inner + phys_off + phys_len <= filesize`, `phys_len != 0`, `log_off` cumulative from 0, `log_len == phys_len`, and `sum(log_len) == logical_stream_length`."

[[record.field]]
name = "phys_off"
offset = 0
type = "u32"
source = "spec"
anchor = "phys_off u32be   # measured from the inner magic"

[[record.field]]
name = "phys_len"
offset = 4
type = "u32"
source = "spec"
anchor = "phys_len u32be"

[[record.field]]
name = "log_len"
offset = 8
type = "u32"
source = "spec"
anchor = "log_len  u32be"

[[record.field]]
name = "log_off"
offset = 12
type = "u32"
source = "spec"
anchor = "log_off  u32be"

[[record.field]]
name = "trailing_word"
offset = 16
type = "u32"
source = "spec"
anchor = "trailing_word u32be"

