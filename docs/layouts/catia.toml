# --- §5.15 Surface of revolution --------------------------------------------

[[record]]
name = "surface_of_revolution_b2_03_2d"
kind = "byte"
section = "5.15"
anchor = "geometry is a dedicated 174-byte `b2 03 2d` record: `+5` reference token (`08` or `0a`), `+6` profile allocation identity (u16le), `+8` 12×f64le (axis origin XYZ + three basis vectors), `+104` 4×f64le angular/profile bounds, then scale/flag tail."
size = 174
note = "Three normalized relations hold to f64 bit-equality: `angular_lo/scale==0.5`, `(angular_hi−angular_lo)/scale==2π`, and `mean/scale==π+0.5`."

