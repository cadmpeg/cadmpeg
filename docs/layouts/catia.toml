offset = 6
type = "u16"
source = "spec"
anchor = "`+6` profile allocation identity (u16le)"

[[record.field]]
name = "frame"
offset = 8
type = "f64[12]"
source = "spec"
anchor = "`+8` 12×f64le (axis origin XYZ + three basis vectors)"

[[record.field]]
name = "bounds"
offset = 104
