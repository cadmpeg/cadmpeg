# SPDX-License-Identifier: Apache-2.0
# Machine-readable record layouts for CATIA V5 `.CATPart`.
schema = 1
format = "catia"
spec = "docs/formats/catia.md"
endianness = "little"
note = """
Covers the container headers and stream directory (§3), the `SurfacicReps`
roster rows and analytic surface records (§3.5, §5.8), the `0x60` curve-support
row (§5.5), the consolidated record framing families (§6), the outer schema
records (§7), the zero-entity `a9 03` framing (§8), and the E5 framing (§9).

§1 states the global rule: all multi-byte integers are little-endian unless
explicitly marked BE, and float coordinates are in millimetres. Records that use
the big-endian lane say so per field.
"""

# --- §3.1 Outer header -----------------------------------------------------

[[record]]
name = "outer_header"
kind = "byte"
section = "3.1"
anchor = "0x00..0x07 magic = \"V5_CFV2\\0\""
size = 64
note = "`directory_offset + directory_length == file_size`. The parser reads only the magic and the two directory words; the fill and flag regions are never read."

[[record.field]]
name = "magic"
offset = 0
type = "bytes[8]"
source = "spec"
anchor = "0x00..0x07 magic = \"V5_CFV2\\0\""

[[record.field]]
name = "directory_offset"
offset = 8
type = "u32"
endianness = "big"
source = "spec"
anchor = "0x08..0x0B directory_offset = u32 BE"

[[record.field]]
name = "directory_length"
offset = 12
type = "u32"
endianness = "big"
source = "spec"
anchor = "0x0C..0x0F directory_length = u32 BE"

[[record.field]]
name = "fill_ff"
offset = 16
type = "bytes[8]"
source = "spec"
anchor = "0x10..0x17 fill_ff = ff * 8"

[[record.field]]
name = "fill_00"
offset = 24
type = "bytes[32]"
source = "spec"
anchor = "0x18..0x37 fill_00 = 00 * 32"

[[record.field]]
name = "hdr_flags"
offset = 56
type = "bytes[8]"
source = "spec"
anchor = "0x38..0x3F hdr_flags = 8 raw bytes (not constant)"

[[record.code]]
path = "crates/cadmpeg-codec-catia/src/container.rs"
contains = "pub const OUTER_MAGIC: &[u8; 8] = b\"V5_CFV2\\0\";"
note = "The parser's magic matches offset 0x00."

[[record]]
name = "inner_header"
kind = "byte"
section = "3.2"
anchor = "A      = u32be(inner + 8)    # directory offset-delta"
size = 16
note = "`inner` is the first `V5_CFV2\\0` after outer byte 8. `diroff = inner + A`."

[[record.field]]
name = "magic"
offset = 0
type = "bytes[8]"
source = "spec"
anchor = "inner  = first \"V5_CFV2\\0\" after outer byte 8"

[[record.field]]
name = "directory_offset_delta"
offset = 8
type = "u32"
endianness = "big"
source = "spec"
anchor = "A      = u32be(inner + 8)    # directory offset-delta"

[[record.field]]
name = "directory_length"
offset = 12
type = "u32"
endianness = "big"
source = "spec"
anchor = "B      = u32be(inner + 12)   # directory length"

# --- §3.4 Nested-container stream directory --------------------------------

[[record]]
name = "stream_descriptor_header"
kind = "byte"
section = "3.4"
anchor = "ds+0x0c : logical_stream_length  (u32be)"
size = 84
note = "Descriptor-relative. `k` extent structs of 20 bytes each follow at ds+0x54. The standard name form ends at the three-byte tail ds-3..ds (`00 00 00`); the legacy form starts at ds+0x10 and ends with the same UTF-16LE terminator, with zero fill through ds+0x50."

[[record.field]]
name = "logical_stream_length"
offset = 12
type = "u32"
endianness = "big"
source = "spec"
anchor = "ds+0x0c : logical_stream_length  (u32be)"

[[record.field]]
name = "extent_count"
offset = 80
type = "u32"
endianness = "big"
source = "spec"
anchor = "ds+0x50 : extent_count k         (u32be)"

[[record.gap]]
offset = 0
size = 12
note = "The spec states no field between the descriptor start and the logical stream length at ds+0x0c."

[[record.gap]]
offset = 16
size = 64
note = "The standard name lies before ds and ends at the fixed tail ds-3..ds. In the legacy form, ds+0x10 starts the variable-length printable UTF-16LE run; its terminator and the remaining bytes through ds+0x50 are zero."

[[record.code]]
path = "crates/cadmpeg-codec-catia/src/container.rs"
contains = "The extent count sits at `desc_offset + 0x50`."
note = "The parser locates the extent count at the same descriptor offset."

[[record]]
name = "extent_struct"
kind = "byte"
section = "3.4"
anchor = "ds+0x54 : k extent structs, 20 bytes each:"
size = 20
endianness = "big"
note = "`inner + phys_off + phys_len <= filesize`, `phys_len != 0`, `log_off` cumulative from 0, `log_len == phys_len`, and `sum(log_len) == logical_stream_length`."

[[record.field]]
name = "phys_off"
offset = 0
type = "u32"
source = "spec"
anchor = "phys_off u32be   # measured from the inner magic"

[[record.field]]
name = "phys_len"
offset = 4
type = "u32"
source = "spec"
anchor = "phys_len u32be"

[[record.field]]
name = "log_len"
offset = 8
type = "u32"
source = "spec"
anchor = "log_len  u32be"

[[record.field]]
name = "log_off"
offset = 12
type = "u32"
source = "spec"
anchor = "log_off  u32be"

[[record.field]]
name = "flags"
offset = 16
type = "u32"
source = "spec"
anchor = "flags    u32be"

[[record.code]]
path = "crates/cadmpeg-codec-catia/src/container.rs"
contains = "pub const DIR_MAGIC: &[u8; 16] = b\"CATIA_V5 CB0001\\0\";"
note = "The parser's directory magic matches the stated `file[diroff : diroff+16]` value."

