section = "5.9"
anchor = "Payload layouts `0x32..=0x34` store"

[[not_applicable]]
area = "`7C09` inline object records and `7C0A` atom payloads (§7.3)"
reason = "Reference tokens are one or two bytes depending on value, and the head forms vary in arity, so every later field position depends on preceding values."
