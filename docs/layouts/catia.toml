section = "6.7"
anchor = "Starting at a frame boundary, advance by the declared frame length"

[[not_applicable]]
area = "Trim records and the standard spine (§5.2, §5.3)"
reason = "Every count in a trim packet is a variable-width `count()` atom and the spine tables are count-driven, so no field sits at a fixed offset. The stride-8 FBB row and the 15-byte vertex record are the exceptions and are tabled."
section = "5.3"
anchor = "count(x) := <x:u8> | ff <x:u32le>"

[[not_applicable]]
area = "Analytic payload slots of `b2 03 19/28/29/2a/2b` (§5.9-§5.14)"
