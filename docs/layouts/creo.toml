# --- Not tabulated -----------------------------------------------------------

[[not_applicable]]
area = "UGC container header and TOC rows (§1, §1.2)"
reason = "ASCII, whitespace-delimited. The legacy P_OBJECT schema and body are variable-width. The TOC header declares a fixed row width, but the specification states the field order inside a row rather than its column positions, so neither a byte nor a column layout can be stated."
section = "1.2"
anchor = "### 1.2 Section map"

[[not_applicable]]
area = "Surface bodies of §3.2 and §3.3 other than the two type-24 bounded rounds"
reason = "About twenty positional cylinder variants plus plane and type-26 forms. The specification identifies them by opener bytes and arithmetic invariants over decoded scalars, not by field offsets; they are recognition predicates rather than layouts."
section = "3.3"
anchor = "Decoded positional parameter scalars retain their source offset and token length."

[[not_applicable]]
area = "Seven-byte DICT scalar forms (§2.3, Seven-byte DICT form)"
reason = "About ninety prefix-to-IEEE-prefix mappings stated as prose rather than a table, and the specification states outright that each record grammar defines the DICT lane for its scalar slots, so a single flat table would be unsound."
section = "Seven-byte DICT form"
anchor = "A decoder must not apply DICT sign rules across unrelated record grammars."

[[not_applicable]]
area = "Section, feature, and DEPDB record grammars (§5-§8)"
reason = "Variable-length token grammars over self-delimiting fields. About twenty-five of them state a complete ordered slot list and are transcribable as slot layouts; they are not covered in this pass. The rest are named but unspecified, and their gaps are already tracked in `creo_prt-open-items.md`."
section = "5"
anchor = "## 5. Topology and section records"
