# Machine-readable record layouts for Creo `.prt`.
schema = 1
format = "creo"
spec = "docs/formats/creo_prt.md"
note = """
Creo `.prt` is a token stream, not a fixed-record format. `creo_prt.md` states
literal byte offsets in exactly two places — the two type-24 bounded-round
surface bodies in §3.3. The fixed-width Unix-compress and CMNM prefixes in §1
are also tabled as byte layouts. The other ASCII container records are
variable-width delimiters or whitespace-delimited fields.

Slot layouts describe fixed ordered sequences of variable-width tokens.
The pcurve endpoint body and local-system support frame are recorded below.

Endianness: §2.1 states the compact integer is big-endian and §8.4 states the
`92`/`da` DICT forms store big-endian integers. Elsewhere the scalar tokens are
described as reconstructing IEEE-754 byte images without an explicit byte-order
statement, so those fields carry `unstated`.
"""

# --- §1 Container framing ---------------------------------------------------

[[record]]
name = "unix_compress_header"
parsed_by = "crates/cadmpeg-codec-creo/src/container.rs"
kind = "byte"
section = "1"
anchor = "A section payload beginning `1f 9d <flags>` uses Unix `compress` LZW framing."
size = 3
note = "The low five flag bits give the maximum code width from 9 through 16; bit 7 enables block mode and code 256 clears the dictionary. Codes are packed least significant bit first in code-width-sized byte blocks."

[[record.field]]
name = "magic"
offset = 0
type = "bytes[2]"
source = "spec"
anchor = "A section payload beginning `1f 9d <flags>`"
value = [0x1f, 0x9d]

[[record.field]]
name = "flags"
offset = 2
type = "u8"
source = "spec"
anchor = "The low five flag bits give the maximum code width from 9 through 16; bit 7 enables block mode"


[[record]]
name = "cmnm_model_name_record"
parsed_by = "crates/cadmpeg-codec-creo/src/container.rs"
kind = "byte"
section = "1"
anchor = "`hhh` is a three-digit ASCII hexadecimal byte count for `name`; padding after those bytes is not part of the name."
size = 11
note = "Fixed prefix only; `hhh` bytes of ASCII name follow at +11, then trailing ASCII space padding. A unique valid record supplies the header model filename; a repeated or malformed record does not establish identity. Binary model-data may provide the named `model_name` identity field described in the specification."

[[record.field]]
name = "prefix"
offset = 0
type = "bytes[8]"
source = "derived"
anchor = "The header record `#- CMNM <hhh><name>` stores the native model filename."
note = "Width derived from the length of the stated literal `#- CMNM ` including its trailing space."
value = "#- CMNM "

[[record.field]]
name = "name_length_hex"
offset = 8
type = "bytes[3]"
source = "spec"
anchor = "The three ASCII hexadecimal digits give the filename byte length."


# --- §3.2 The two records with stated byte offsets --------------------------

[[record]]
name = "type24_first_coordinate_bounded_round"
kind = "byte"
section = "3.3"
anchor = "The first-coordinate bounded round form is 50 bytes."
size = 50
endianness = "unstated"
note = "The two diameter endpoints and five extent scalars use the tabulated-cylinder first-coordinate lane, including its positive eight-byte `2d` form. Terminal `18` at offset 49 is the zero-valued sixth extent coordinate."

[[record.field]]
name = "opener"
offset = 0
type = "bytes[2]"
source = "spec"
anchor = "It begins with `4c b7`"

[[record.field]]
name = "first_diameter_endpoint"
offset = 7
type = "bytes[8]"
source = "derived"
anchor = "stores the first diameter endpoint at offset 7, `12` at offset 15"
note = "Width derived from the two stated offsets: the endpoint occupies 7 through 15."

[[record.field]]
name = "separator"
offset = 15
type = "u8"
source = "spec"
anchor = "`12` at offset 15, the second diameter endpoint at offset 16"

[[record.field]]
name = "second_diameter_endpoint"
offset = 16
type = "bytes[8]"
source = "derived"
anchor = "the second diameter endpoint at offset 16, and five contiguous first-coordinate-lane extent scalars at offset 24"
note = "Width derived from the two stated offsets: the endpoint occupies 16 through 24."

[[record.field]]
name = "extent_scalars"
offset = 24
type = "bytes[25]"
source = "derived"
anchor = "five contiguous first-coordinate-lane extent scalars at offset 24"
note = "Width derived from the stated offset 24 and the stated terminal at 49; the five scalars therefore occupy five bytes each in this lane."

[[record.field]]
name = "terminal"
offset = 49
type = "u8"
source = "spec"
anchor = "Terminal `18` at offset 49 is the zero-valued sixth extent coordinate."

[[record.gap]]
offset = 2
size = 5
note = "Bytes 2 through 7. The specification states no field between the `4c b7` opener and the first diameter endpoint at offset 7."

[[record.code]]
path = "crates/cadmpeg-codec-creo/src/surface.rs"
contains = "self.body.get(..2) == Some(&[0x4c, 0xb7])"
note = "The parser gates on length 50, the `4c b7` opener, `0x12` at 15, and `0x18` at 49, matching every stated offset."

[[record]]
name = "type24_segmented_first_coordinate_bounded_round"
kind = "byte"
section = "3.3"
anchor = "The segmented first-coordinate bounded round form is 56 bytes."
size = 56
endianness = "unstated"
note = "Both diameter endpoints and all six extent coordinates use the tabulated-cylinder first-coordinate lane. Every byte range in this record is stated outright, so the table tiles it with no gap."

[[record.field]]
name = "opener"
offset = 0
type = "u8"
source = "spec"
anchor = "Byte zero is `18`"

[[record.field]]
name = "first_diameter_endpoint"
offset = 1
type = "bytes[8]"
source = "spec"
anchor = "the first diameter endpoint occupies bytes 1 through 8"

[[record.field]]
name = "literal_run"
offset = 9
type = "bytes[7]"
source = "spec"
anchor = "bytes 9 through 15 are `70 bf e3 4f 05 11 10`"

[[record.field]]
name = "second_diameter_endpoint"
offset = 16
type = "bytes[8]"
source = "spec"
anchor = "the second diameter endpoint occupies bytes 16 through 23"

[[record.field]]
name = "extent_coordinates"
offset = 24
type = "bytes[30]"
source = "spec"
anchor = "six contiguous extent coordinates occupy bytes 24 through 53"

[[record.field]]
name = "trailer"
offset = 54
type = "bytes[2]"
source = "spec"
anchor = "The body ends with `f7 19`."

[[record.code]]
path = "crates/cadmpeg-codec-creo/src/surface.rs"
contains = "Some(&[0x70, 0xbf, 0xe3, 0x4f, 0x05, 0x11, 0x10])"
note = "The parser gates on length 56, `0x18` at 0, the seven-byte literal at 9..16, and `f7 19` at 54..56, matching every stated range."

# --- Slot layouts ------------------------------------------------------------

[[record]]
name = "pcurve_endpoint_body"
kind = "slot"
section = "4.1"
anchor = "A direct curve body consisting of exactly eight scalar slots and no references has this layout."
note = "A scalar token occupies one slot and a standalone `12` occupies one zero-valued slot; no other unclaimed byte is permitted. All eight values are finite parameter coordinates in the corresponding face spaces. Slot widths depend on each scalar's token prefix, so the record has no fixed byte size."

[[record.field]]
name = "endpoint_a_f0"
type = "f64[2]"
endianness = "unstated"
source = "spec"
anchor = "| `0..1` | Endpoint A in face `F0` parameters |"
note = "The specification describes the scalar tokens as reconstructing IEEE-754 byte images but does not state a byte order for this lane."

[[record.field]]
name = "endpoint_a_f1"
type = "f64[2]"
endianness = "unstated"
source = "spec"
