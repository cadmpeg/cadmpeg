# Machine-readable record layouts for Autodesk Protein asset packages.
# Every row cites a section of docs/formats/protein.md and a phrase inside it.
schema = 1
format = "protein"
spec = "docs/formats/protein.md"
endianness = "little"
note = """
Covers the 16-byte instance-stream header (§2) and the three 136-byte page
kinds (§3). Schema XML, ZIP members, and the schema-driven property value
block are listed under "Not tabulated". The Inventor compound-stream
`protein_header` envelope is tabulated in `docs/layouts/inventor.toml`.
"""

# --- §3 Page markers -------------------------------------------------------

[[token]]
tag = "80 00 01 00"
name = "record_start"
payload_bytes = 128
note = "Opens a logical record; the 128-byte body at bytes 8..136 contributes in full."
section = "3"
anchor = "Record start | `80 00 01 00` at bytes 4..8"

[[token]]
tag = "80 00 00 00"
name = "continuation"
payload_bytes = 128
note = "Extends the current record with its complete 128-byte body."
section = "3"
anchor = "Continuation | `80 00 00 00` at bytes 4..8"

[[token]]
tag = "ff ff ff ff"
name = "terminal"
note = "Closes the current record; only `used` body bytes contribute."
section = "3"
anchor = "Terminal | `ff ff ff ff` at bytes 0..4"

# --- §2 Stream header ------------------------------------------------------

[[record]]
name = "instance_stream_header"
parsed_by = "crates/cadmpeg-protein/src/lib.rs"
kind = "byte"
section = "2"
anchor = "`InstanceProperties.bin` and `DefinitionIteratorProperties.bin` start with a 16-byte stream header"
size = 16

[[record.field]]
name = "declared_size"
offset = 0
type = "u32"
source = "spec"
anchor = "The first header word is the little-endian u32 page size and equals `0x88`"

[[record.gap]]
offset = 4
size = 12
note = "The remaining twelve header bytes are retained; the specification states no field in that region."


