[[record.code]]
path = "crates/cadmpeg-codec-iges/src/directory.rs"
contains = "let mut fields = [[b' '; 8]; 9];"
note = "The parser splits columns 1-72 into nine eight-column Directory Entry fields."

[[record]]
name = "directory_entry_card_2"
kind = "column"
section = "Directory Entry section"
anchor = "The second card fields are the repeated entity type, line weight, color, Parameter Data card count, form number, two reserved fields, entity label, and entity subscript."
size = 72
note = "Columns 1-72 of the second Directory Entry card. The repeated entity type must equal the first-card value. Reserved bytes are retained whether blank or nonblank."

[[record.field]]
