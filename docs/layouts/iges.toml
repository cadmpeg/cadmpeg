columns = "25-32"
type = "text"
source = "spec"
anchor = "structure, line font pattern, level, view"

[[record.field]]
name = "level"
columns = "33-40"
type = "text"
source = "spec"
anchor = "line font pattern, level, view, transformation matrix"

[[record.field]]
name = "view"
columns = "41-48"
type = "text"
source = "spec"
anchor = "level, view, transformation matrix, label-display associativity"

[[record.field]]
name = "transformation_matrix"
columns = "49-56"
type = "text"
source = "spec"
anchor = "view, transformation matrix, label-display associativity, and the eight-character status number"

[[record.field]]
name = "label_display"
