# SPDX-License-Identifier: Apache-2.0
# Machine-readable record layouts for IGES.
schema = 1
format = "iges"
spec = "docs/formats/iges.md"
note = """
The Binary representation starts with a fixed 80-byte flag. The Fixed and
Compressed ASCII representations use records with an 80-column text envelope,
so their layouts use `kind = "column"`: 1-based inclusive character columns
that must tile the 80-column card exactly.

`iges.md` uses unnumbered headings, so the `section` keys below are the heading
titles rather than section numbers.

Covers the Binary flag, the ordinary card, the Parameter Data card, the
Terminate data area, and both Directory Entry cards. Per-entity parameter slot order is not in the
specification; `corpus/iges-envelope-a.toml` already carries the entity and form
matrix, and the per-entity parameter order lives only in the parser.
"""

[[record]]
name = "binary_flag"
kind = "byte"
section = "Physical representation"
anchor = "The Binary representation starts with one 80-byte Binary Flag Section."
size = 80
note = "The six one-byte primitive length fields select the bit widths used by the remaining Binary representation. Each displacement counts its section and any following null padding."

[[record.field]]
name = "identifier"
offset = 0
type = "bytes[1]"
source = "spec"
anchor = "Byte 1 is ASCII `B`."

[[record.field]]
name = "remaining_byte_count"
offset = 1
type = "u32"
endianness = "big"
source = "spec"
anchor = "Bytes 2 through 5 are the big-endian unsigned 32-bit value `75`"
value = 75

[[record.field]]
name = "primitive_bit_lengths"
offset = 5
type = "bytes[6]"
source = "spec"
anchor = "Bytes 6 through 11 are the one-byte bit lengths `Is`, `Id`, `NXs`, `NFs`, `NXd`, and `NFd`."

[[record.field]]
name = "section_displacements"
offset = 11
type = "bytes[30]"
source = "spec"
anchor = "Bytes 12, 17, 22, 27, 32, and 37 are ASCII `B`, `S`, `G`, `D`, `P`, and `T`."
note = "Six repetitions of a one-byte ASCII section identifier and a big-endian u32 displacement."

[[record.field]]
name = "unassigned"
offset = 41
type = "bytes[31]"
source = "spec"
anchor = "Bytes 42 through 72 are unassigned."

[[record.field]]
name = "section_marker"
offset = 72
type = "bytes[1]"
source = "spec"
anchor = "Byte 73 is ASCII `B`"

[[record.field]]
name = "sequence_padding"
offset = 73
type = "bytes[6]"
source = "spec"
anchor = "bytes 74 through 79 are ASCII blanks or zeroes"

[[record.field]]
name = "sequence"
offset = 79
type = "bytes[1]"
source = "spec"
anchor = "byte 80 is ASCII `1`."


[[record.code]]
path = "crates/cadmpeg-codec-iges/src/representation.rs"
contains = "matches!(byte, b' ' | b'0')"
note = "Representation detection validates the six-byte Binary sequence padding as ASCII blanks or zeroes."

[[record]]
name = "canonical_card"
kind = "column"
section = "Physical representation"
anchor = "A canonical line contains exactly an 80-byte card followed by a line ending."
size = 80
note = "Byte positions are one-based in the specification. The Global data stream is the concatenation of columns 1 through 72 from its cards."

[[record.field]]
name = "section_data"
columns = "1-72"
type = "text"
source = "spec"
anchor = "Card bytes 1 through 72 are section data."

[[record.field]]
name = "section_marker"
columns = "73-73"
type = "char"
source = "spec"
anchor = "Byte 73 is the section marker."

[[record.field]]
name = "sequence"
columns = "74-80"
type = "text"
source = "spec"
anchor = "Bytes 74 through 80 are the right-aligned decimal sequence field."

[[record.code]]
path = "crates/cadmpeg-codec-iges/src/card.rs"
contains = "const CARD_WIDTH: usize = 80;"
note = "The parser's card width matches the 80-column card."

[[record.code]]
path = "crates/cadmpeg-codec-iges/src/card.rs"
contains = "card.get(73..80)"
note = "The parser slices the sequence field from zero-based 73..80, which is 1-based columns 74-80."

[[record]]
name = "parameter_data_card"
kind = "column"
section = "Physical representation"
anchor = "Parameter Data cards instead use bytes 65 through 72 for the right-aligned Directory Entry back-pointer, byte 73 for the `P` marker, and bytes 74 through 80 for the Parameter Data sequence."
size = 80
note = "The only card whose columns 1-72 are split."

[[record.field]]
name = "parameter_fragment"
columns = "1-64"
type = "text"
source = "derived"
anchor = "Parameter Data cards instead use bytes 65 through 72 for the right-aligned Directory Entry back-pointer"
note = "Columns 1-64 are the remainder of the 1-72 data area once the back-pointer claims 65-72. The Parameter Data section states the same span outright: \"Bytes 1 through 64 of Parameter Data cards form parameter fragments.\""

[[record.field]]
name = "de_back_pointer"
columns = "65-72"
type = "text"
source = "spec"
anchor = "Parameter Data cards instead use bytes 65 through 72 for the right-aligned Directory Entry back-pointer"

[[record.field]]
name = "section_marker"
columns = "73-73"
type = "char"
source = "spec"
anchor = "byte 73 for the `P` marker"

[[record.field]]
name = "sequence"
columns = "74-80"
type = "text"
source = "spec"
anchor = "bytes 74 through 80 for the Parameter Data sequence"

[[record.code]]
path = "crates/cadmpeg-codec-iges/src/parameter.rs"
contains = "line.payload.get(64..72)"
note = "The parser reads the back-pointer from zero-based 64..72, which is 1-based columns 65-72."

[[record]]
name = "directory_entry_card_1"
kind = "column"
section = "Directory Entry section"
anchor = "The first card fields are entity type, Parameter Data start sequence, structure, line font pattern, level, view, transformation matrix, label-display associativity, and the eight-character status number."
size = 72
note = "Columns 1-72 of the first of the two Directory Entry cards, as nine fixed eight-column fields. Blank numeric fields take their field-defined default; nonblank numeric fields are right-aligned signed decimal integers. Columns 73-80 carry the section marker and sequence field of the enclosing card."

[[record.field]]
name = "entity_type"
columns = "1-8"
type = "text"
source = "spec"
anchor = "The first card fields are entity type, Parameter Data start sequence, structure"

[[record.field]]
name = "parameter_start"
columns = "9-16"
type = "text"
source = "spec"
anchor = "entity type, Parameter Data start sequence, structure, line font pattern"

[[record.field]]
name = "structure"
columns = "17-24"
type = "text"
source = "spec"
anchor = "Parameter Data start sequence, structure, line font pattern, level"

[[record.field]]
