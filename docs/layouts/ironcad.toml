[[record.field]]
name = "gap"
offset = 0
type = "u8[32]"
source = "spec"
anchor = "| 0 | 32 | `gap` | Bytes after the `ModelGUID` text. |"

[[record.field]]
name = "words"
offset = 32
type = "u32[2]"
source = "spec"
anchor = "| 32 | 8 | `words` |"

[[record.field]]
name = "flag"
offset = 40
type = "u8"
source = "spec"
anchor = "| 40 | 1 | `flag` | `1`. |"
value = 1

[[record.field]]
name = "matrix"
offset = 41
type = "f64[16]"
source = "spec"
anchor = "| 41 | 128 | `matrix` |"

