# SPDX-License-Identifier: Apache-2.0
# Machine-readable record layouts for Fusion `.f3d` / `.f3z`.
# Every row cites a section of docs/formats/f3d.md and a phrase inside it.
schema = 1
format = "f3d"
spec = "docs/formats/f3d.md"
endianness = "little"
note = """
Covers the two fixed Design-segment headers and the sheet-metal `EdgeFlange`
fixed operation section (§3.1). ASM stream records are tabulated in
`docs/layouts/asm.toml`. Container and manifest layers are text grammars and
are listed under "Not tabulated".
"""

# --- §3.1 Design-segment fixed headers -------------------------------------

[[record]]
name = "indexed_design_record_header"
kind = "byte"
section = "3.1"
anchor = "An indexed Design record header is `u32 class_tag_length`, a three-digit ASCII dynamic-class tag, then `u32 record_index`"
size = 11
note = "The 11-byte size is the spec's own \"eleven-byte indexed header\". §3.1 states the segment's integers are little-endian (\"a nonempty contiguous sequence of little-endian i32 values\")."

[[record.field]]
name = "class_tag_length"
offset = 0
type = "u32"
source = "spec"
anchor = "An indexed Design record header is `u32 class_tag_length`"

[[record.field]]
name = "class_tag"
offset = 4
type = "bytes[3]"
source = "spec"
anchor = "a three-digit ASCII dynamic-class tag"

[[record.field]]
name = "record_index"
offset = 7
type = "u32"
source = "spec"
anchor = "then `u32 record_index`"

[[record.code]]
path = "docs/formats/f3d.md"
contains = "Its eleven-byte indexed header"
note = "The 11-byte total is stated independently in the companion-record paragraph of the same section."

[[record]]
name = "indexed_companion_record_prefix"
kind = "byte"
section = "3.1"
anchor = "The indexed companion record begins with a 58-byte common prefix."
size = 58
note = "The stated field list tiles the stated 58-byte total exactly. The timestamp is a wall-clock value recorded at a parameter authoring event."

[[record.field]]
name = "indexed_header"
offset = 0
type = "bytes[11]"
source = "spec"
anchor = "Its eleven-byte indexed header"

[[record.field]]
name = "zero_run_20"
offset = 11
type = "bytes[20]"
source = "spec"
anchor = "is followed by 20 zero bytes"

[[record.field]]
name = "owner_marker"
offset = 31
type = "u8"
source = "spec"
anchor = "`01 + u32 owner_record_index`"

[[record.field]]
name = "owner_record_index"
offset = 32
type = "u32"
source = "spec"
anchor = "`01 + u32 owner_record_index`"

[[record.field]]
name = "zero_run_6"
offset = 36
type = "bytes[6]"
source = "spec"
anchor = "six zero bytes"

[[record.field]]
name = "timestamp_micros"
offset = 42
type = "u64"
source = "spec"
anchor = "a nonzero u64 Unix-epoch timestamp in microseconds"

[[record.field]]
name = "zero_run_8"
offset = 50
type = "bytes[8]"
source = "spec"
anchor = "and eight zero bytes"

# --- Not tabulated ---------------------------------------------------------

[[not_applicable]]
area = "Container, manifest, and stream-selection layers (§1, §2)"
reason = "ZIP entries and `Manifest.dat` text grammar; no fixed byte-offset structure is stated."
section = "1.3"
anchor = "`Manifest.dat` grammar"

[[record]]
name = "edge_flange_fixed_operation_section"
kind = "byte"
section = "3.1"
anchor = "The `EdgeFlange` fixed operation section starts at offset"
size = 79
note = "Offsets are relative to the section base `85 + S`, where `S` is the header shift. The section runs from the bend-position discriminator through the inside bend radius; the result-record run and the two closing group references follow it at variable offsets."

[[record.field]]
name = "bend_position"
offset = 0
type = "u32"
source = "spec"
anchor = "with a u32 bend-position discriminator"

[[record.field]]
name = "edge_count"
offset = 4
type = "u32"
source = "spec"
anchor = "the u32 edge count `1`"

[[record.field]]
name = "edge_wrapper_reference"
offset = 8
type = "bytes[11]"
source = "spec"
anchor = "the marked wrapper reference"

[[record.field]]
name = "settings_reference"
offset = 19
type = "bytes[11]"
source = "spec"
anchor = "the marked settings reference"

[[record.field]]
name = "height_datum"
offset = 30
type = "u32"
source = "spec"
anchor = "a u32 height-datum discriminator"

[[record.field]]
name = "angle_owner_reference"
offset = 34
type = "bytes[11]"
source = "spec"
anchor = "and the marked angle-owner and height-owner references"

[[record.field]]
name = "height_owner_reference"
offset = 45
type = "bytes[11]"
source = "spec"
anchor = "Height-datum value `1` measures the height from the inner faces"

[[record.field]]
name = "unsettled_side_reference"
offset = 56
type = "u32"
source = "spec"
anchor = "A u32 whose role is not settled follows the height-owner reference"

[[record.gap]]
offset = 60
size = 11
note = "The spec places the radius 15 bytes after the unsettled u32, so eleven bytes between them are unaccounted for."

[[record.field]]
name = "inside_bend_radius"
offset = 71
type = "f64"
source = "spec"
anchor = "the positive f64 inside bend radius in centimetres starts 15 bytes after that u32"

