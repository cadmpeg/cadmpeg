# Convergence ratchet ceilings. Counts may only fall.
# A decrease updates this file in the same commit. A deliberate increase
# requires a reason under [reasons] for every raised key.
# [kinds] is pressure (no zero destination) or convergence ([targets]).
measured_at = "a5742f2ebca776d74fa13f9c1f3ce419457043c4"
filter = "legacy metrics: production .rs under crates/**/src via is_production_rs; exclude tests/ and benches/ path segments; exclude files named tests.rs or *test*.rs; strip cfg(test)-attributed items with blank-preserving elision. bare tolerance literals count at use sites; named const/static numeric initializers are declarations and are excluded. from_endian_bytes uses that same crates/**/src glob (not codec crates only). Placement metrics: scan crates/**/*.rs by ownership, structural entry points, standard mod resolution, and test-only #[path] ancestry; golden_tests files stay out of test-line debt. production_line_debt reuses is_production_rs and elides cfg(test) items without blank placeholders. [kinds] marks each key pressure (no zero destination) or convergence ([targets] is the completion criterion)."

[kinds]
from_endian_bytes = "pressure"
codec_error_malformed_format = "convergence"
loss_note_struct_literals = "convergence"
bare_tolerance_literals = "convergence"
nonliteral_vec_repeat = "convergence"
crate_root_tests_rs = "convergence"
path_test_includes = "convergence"
test_line_debt = "convergence"
production_line_debt = "convergence"

[targets]
