[reasons]
from_endian_bytes = "The remaining 94 calls are intentional exceptions: View's 16 typed-reader implementations; CATIA's seven padded 24-bit or partial-width local token arrays; Creo's 36 compact-token IEEE reconstructions; F3D's two output color packings; Inventor's three field-reordered GUID reads; NX's eight reconstructed or copied scalar, footer, and checksum arrays; Rhino's four copied layer-color arrays; SLDPRT's nine copied component/tag arrays and output packing; the inspect scalar's one normalized local lane; the fuzz generator's one RGB packing; and Protein's seven fixed arrays returned by take. None reads a bounded decode window as a standard-width scalar."
nonliteral_vec_repeat = "NX topology preparation keeps one optional census slot per already-admitted stream, and SLDPRT sweep decoding allocates a scalar output for each admitted count. The first function has no decode-error return path and the count is bounded by container admission; the second checks the count against remaining bytes before allocation."
test_line_debt = "The merged NX branch retains 277 lines of owner-local OM-region, Parasolid GROUP, and geometry-work test debt. Mainline adds 207 lines in five owner-local SLDPRT test suites, for a combined ceiling of 484."
