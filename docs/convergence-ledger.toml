[reasons]
from_endian_bytes = "The remaining 47 calls are intentional exceptions retained after merging the mainline codec work. None reads a bounded decode window as a standard-width scalar."
bare_tolerance_literals = "Merging the Creo level-6 work adds 60 inline scientific-notation tolerances to the 124 already present after the CATIA and SLDPRT merges; the distinct thresholds remain until they are hoisted to intent-named constants without collapsing their values."
nonliteral_vec_repeat = "merging the SLDPRT level-6 branch adds its one remaining parsed-count repeat to the 36 sites on the long-running CATIA level-6 branch"
test_line_debt = "merging the SLDPRT level-6 branch combines its 207 lines of oversized-test debt with the 155 lines in crates/cadmpeg-codec-catia/src/families/b2/tests.rs"
production_line_debt = "merged the long-running CATIA level-6 solver branch after main introduced production-file line-debt accounting; crates/cadmpeg-codec-catia/src/solve/mesh_quotient.rs contains the branch's coupled quotient search and contributes the measured 704 lines above the convergence threshold"
