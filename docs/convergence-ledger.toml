# Convergence ratchet ceilings. Counts may only fall.
# A decrease updates this file in the same commit. A deliberate increase
# requires a reason under [reasons] for every raised key.
# [kinds] is pressure (no zero destination) or convergence ([targets]).
measured_at = "a5c4f2605cfb196daf01db9a2869184dd1134b69"
filter = "legacy metrics: production .rs under crates/**/src via is_production_rs; exclude tests/ and benches/ path segments; exclude files named tests.rs or *test*.rs; strip cfg(test)-attributed items with blank-preserving elision. from_endian_bytes uses that same crates/**/src glob (not codec crates only). Placement metrics: scan crates/**/*.rs by ownership, structural entry points, standard mod resolution, and test-only #[path] ancestry; golden_tests files stay out of test-line debt. production_line_debt reuses is_production_rs and elides cfg(test) items without blank placeholders. [kinds] marks each key pressure (no zero destination) or convergence ([targets] is the completion criterion)."

[kinds]
from_endian_bytes = "pressure"
codec_error_malformed_format = "convergence"
loss_note_struct_literals = "convergence"
bare_tolerance_literals = "convergence"
nonliteral_vec_repeat = "convergence"
crate_root_tests_rs = "convergence"
path_test_includes = "convergence"
test_line_debt = "convergence"
production_line_debt = "convergence"

[targets]
codec_error_malformed_format = 0
loss_note_struct_literals = 0
bare_tolerance_literals = 0
nonliteral_vec_repeat = 0
crate_root_tests_rs = 0
path_test_includes = 0
test_line_debt = 0
production_line_debt = 0

[ceilings]
from_endian_bytes = 93
codec_error_malformed_format = 0
loss_note_struct_literals = 0
bare_tolerance_literals = 68
nonliteral_vec_repeat = 37
crate_root_tests_rs = 0
path_test_includes = 0
test_line_debt = 362
production_line_debt = 704

[reasons]
from_endian_bytes = "The remaining 93 calls are intentional exceptions: View's 16 typed-reader implementations; CATIA's seven padded 24-bit or partial-width local token arrays; Creo's 36 compact-token IEEE reconstructions; F3D's two output color packings; Inventor's three field-reordered GUID reads; NX's seven reconstructed or copied scalar, footer, and checksum arrays; Rhino's four copied layer-color arrays; SLDPRT's nine copied component/tag arrays and output packing; the inspect scalar's one normalized local lane; the fuzz generator's one RGB packing; and Protein's seven fixed arrays returned by take. None reads a bounded decode window as a standard-width scalar."
nonliteral_vec_repeat = "merging the SLDPRT level-6 branch adds its one remaining parsed-count repeat to the 36 sites on the long-running CATIA level-6 branch"
test_line_debt = "merging the SLDPRT level-6 branch combines its 207 lines of oversized-test debt with the 155 lines in crates/cadmpeg-codec-catia/src/families/b2/tests.rs"
production_line_debt = "merged the long-running CATIA level-6 solver branch after main introduced production-file line-debt accounting; crates/cadmpeg-codec-catia/src/solve/mesh_quotient.rs contains the branch's coupled quotient search and contributes the measured 704 lines above the convergence threshold"
