# SPDX-License-Identifier: Apache-2.0
[package]
name = "cadmpeg-codec-rhino"
description = "Read and write Rhino 3DM files."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

# Golden decode snapshots are a repository-side regression asset, not part of
# the published API. They dominate the packaged crate (66MB of 70MB for the
# FreeCAD codec) and a registry consumer cannot act on them. CI runs the golden
# tests from the repository checkout.
exclude = ["tests/golden/**"]
readme = "README.md"
documentation = "https://docs.rs/cadmpeg-codec-rhino"
keywords = ["cad", "rhino", "3dm", "geometry"]
categories = ["encoding", "parser-implementations", "graphics"]

[dependencies]
cadmpeg-core.workspace = true
cadmpeg-ir.workspace = true
cadmpeg-container.workspace = true
flate2.workspace = true
crc32fast.workspace = true
sha2.workspace = true
sha1.workspace = true
serde_json.workspace = true
serde.workspace = true
tempfile.workspace = true
roxmltree.workspace = true

[dev-dependencies]
# Test-only golden harness and round-trip helpers.
cadmpeg-test-support = { workspace = true }

[lints]
workspace = true
