# SPDX-License-Identifier: Apache-2.0
[package]
name = "cadmpeg-asm"
description = "Parse and write Autodesk Shape Manager record streams."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
test-support = []
# `schema` builds the `JsonSchema` derives of this crate's native records. It is
# off by default and no dependent turns it on: `cadmpeg-ir` does not depend on
# this crate, so `cadmpeg_ir::cadir_json_schema()` does not reach these derives.
# The CI "Schema feature" step is the only build that compiles them, and it is
# what keeps each derive matching the shape its type writes.
schema = ["dep:schemars", "cadmpeg-ir/schema"]

[dependencies]
cadmpeg-core.workspace = true
cadmpeg-ir.workspace = true
serde.workspace = true
serde-value.workspace = true
schemars = { workspace = true, optional = true }

[dev-dependencies]
cadmpeg-test-support.workspace = true
serde_json.workspace = true

[lints]
workspace = true
