# SPDX-License-Identifier: Apache-2.0
[package]
name = "cadmpeg-asm"
description = "Parse and write Autodesk Shape Manager record streams."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
# `schema` builds the `JsonSchema` derives. It is off by default: the
# derives are only consumed by `cadmpeg_ir::cadir_json_schema()`.
schema = ["dep:schemars", "cadmpeg-ir/schema"]

[dependencies]
cadmpeg-core.workspace = true
cadmpeg-ir.workspace = true
serde.workspace = true
serde-value.workspace = true
schemars = { workspace = true, optional = true }

[dev-dependencies]
cadmpeg-test-support.workspace = true

[lints]
workspace = true
