# SPDX-License-Identifier: Apache-2.0
[package]
name = "cadmpeg-codec-usd"
description = "Decode OpenUSD .usda, .usdc, and .usdz layers, and encode .usda layers and .usdz packages."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/cadmpeg-codec-usd"
keywords = ["cad", "usd", "openusd", "usda", "geometry"]
categories = ["encoding", "parser-implementations", "graphics"]
exclude = ["tests/golden/**"]

[dependencies]
cadmpeg-container.workspace = true
cadmpeg-core.workspace = true
cadmpeg-ir.workspace = true
cadmpeg-tessellate.workspace = true
crc32fast.workspace = true
unicode-ident.workspace = true

[dev-dependencies]
# Test-only IR example documents for writer goldens.
cadmpeg-ir = { workspace = true, features = ["examples"] }
cadmpeg-measure = { workspace = true, features = ["test-support"] }
cadmpeg-test-support = { workspace = true }
serde_json.workspace = true

[lints]
workspace = true
