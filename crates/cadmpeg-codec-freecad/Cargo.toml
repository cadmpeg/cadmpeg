# SPDX-License-Identifier: Apache-2.0
[package]
name = "cadmpeg-codec-freecad"
description = "Read and write FreeCAD FCStd document archives."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

# Golden decode snapshots are a repository-side regression asset, not part of
# the published API. They dominate the packaged crate (66MB of 70MB for the
# FreeCAD codec) and a registry consumer cannot act on them. CI runs the golden
# tests from the repository checkout.
exclude = ["tests/golden/**"]

[dependencies]
cadmpeg-container.workspace = true
cadmpeg-codec-core.workspace = true
cadmpeg-ir.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
roxmltree.workspace = true
zip.workspace = true
tempfile.workspace = true

[[bin]]
name = "fcstd-profile"
path = "src/bin/fcstd_profile.rs"

[dev-dependencies]
# Enables `cadmpeg_codec_core::golden`, the shared snapshot harness.
# Feature unification applies it to the test build only, so the published
# library is unchanged.
cadmpeg-codec-core = { workspace = true, features = ["golden"] }
# `tests/golden/step/` pins what this codec's documents export as. The STEP
# encoder writes those bytes; this crate hosts the goldens because it owns
# their inputs. Test-only, so the published library is unchanged.
cadmpeg-codec-step.workspace = true

[lints]
workspace = true
