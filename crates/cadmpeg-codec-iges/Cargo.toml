# SPDX-License-Identifier: Apache-2.0
[package]
name = "cadmpeg-codec-iges"
description = "Inspect and decode IGES 5.3 Fixed ASCII files."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

# Golden decode snapshots are a repository-side regression asset, not part of
# the published API. They dominate the packaged crate (66MB of 70MB for the
# FreeCAD codec) and a registry consumer cannot act on them. CI runs the golden
# tests from the repository checkout.
exclude = ["tests/golden/**"]
documentation = "https://docs.rs/cadmpeg-codec-iges"
keywords = ["cad", "iges", "geometry", "brep"]
categories = ["encoding", "parser-implementations", "graphics"]

[dependencies]
cadmpeg-codec-core.workspace = true
cadmpeg-ir.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml = "1.1"

[dev-dependencies]
# Enables `cadmpeg_codec_core::golden`, the shared snapshot harness.
# Feature unification applies it to the test build only, so the published
# library is unchanged.
cadmpeg-codec-core = { workspace = true, features = ["golden"] }

[lints]
workspace = true
