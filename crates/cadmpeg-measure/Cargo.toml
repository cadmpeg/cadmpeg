# SPDX-License-Identifier: Apache-2.0
[package]
name = "cadmpeg-measure"
description = "Geometric measurement of decoded cadmpeg CAD models."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"

[features]
# `test_support::round_trip` for the tests of writer crates, which take this
# feature in their dev-dependencies, and `test_support::box_pass` for the
# `box_pass` example and the fixture test of the `cadmpeg` package.
test-support = []

[[example]]
name = "box_pass"
required-features = ["test-support"]

[dependencies]
cadmpeg-core.workspace = true
cadmpeg-ir.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
cadmpeg-ir = { workspace = true, features = ["examples"] }
serde_json.workspace = true

[lints]
workspace = true
