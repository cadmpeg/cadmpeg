# SPDX-License-Identifier: Apache-2.0
[package]
name = "cadmpeg-codec-creo"
description = "Inspect and decode Creo PSB .prt geometry, topology, sketches, and design records."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

# Golden decode snapshots are a repository-side regression asset, not part of
# the published API. They dominate the packaged crate (66MB of 70MB for the
# FreeCAD codec) and a registry consumer cannot act on them. CI runs the golden
# tests from the repository checkout.
exclude = ["tests/golden/**"]
readme = "README.md"
documentation = "https://docs.rs/cadmpeg-codec-creo"
keywords = ["cad", "creo", "pro-engineer", "prt", "geometry"]
categories = ["encoding", "parser-implementations", "graphics"]

[dependencies]
cadmpeg-core.workspace = true
cadmpeg-ir.workspace = true
serde.workspace = true
sha2.workspace = true
regex.workspace = true

[dev-dependencies]
# Test-only golden harness and round-trip helpers.
cadmpeg-test-support = { workspace = true }
serde_json.workspace = true

[lints]
workspace = true
