# SPDX-License-Identifier: Apache-2.0
[package]
name = "cadmpeg-codec-sldprt"
description = "Read and write SolidWorks .sldprt part geometry, metadata, and feature records."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

# Golden decode snapshots are a repository-side regression asset, not part of
# the published API. They dominate the packaged crate (66MB of 70MB for the
# FreeCAD codec) and a registry consumer cannot act on them. CI runs the golden
# tests from the repository checkout.
exclude = ["tests/golden/**"]
readme = "README.md"
documentation = "https://docs.rs/cadmpeg-codec-sldprt"
keywords = ["cad", "solidworks", "sldprt", "parasolid", "geometry"]
categories = ["encoding", "parser-implementations", "graphics"]

[dependencies]
cadmpeg-core.workspace = true
cadmpeg-container.workspace = true
cadmpeg-ir.workspace = true
sha2.workspace = true
thiserror.workspace = true
flate2.workspace = true
crc32fast.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }

[dev-dependencies]
# Enables `cadmpeg_core::golden`, the shared snapshot harness.
# Feature unification applies it to the test build only, so the published
# library is unchanged.
cadmpeg-core = { workspace = true, features = ["golden"] }
# Tests build `cadmpeg_ir::examples`; the feature keeps those fixtures out of
# the normal library build.
cadmpeg-ir = { workspace = true }

[features]
# `schema` builds the `JsonSchema` derives. It is off by default: the
# derives are only consumed by `cadmpeg_ir::cadir_json_schema()`, and
# generating them costs 22% of this crate tree's compile time.
schema = ["dep:schemars", "cadmpeg-core/schema", "cadmpeg-ir/schema"]
# Exposes `pub mod fuzzing`, thin wrappers that drive the crate-private `brep`
# leaf scanners so the fuzz crate can reach them without widening the stable API.
fuzzing = []

[lints]
workspace = true
