# SPDX-License-Identifier: Apache-2.0
[package]
name = "cadmpeg-codec-core"
description = "Bounded byte decoding primitives and codec resource policy for cadmpeg."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
# `schema` builds the `JsonSchema` derives. It is off by default: the
# derives are only consumed by `cadmpeg_ir::cadir_json_schema()`, and
# generating them costs 22% of this crate tree's compile time.
schema = ["dep:schemars"]

# `golden` builds the shared snapshot harness the codec crates' golden tests
# use. It is off by default and enabled through a dev-dependency, because the
# harness reads a repository checkout and a registry consumer cannot run it.
# `compare`, which the harness compares through, is not gated: `cadmpeg-ir`
# compares IR documents with it at run time.
golden = []

[dependencies]
serde.workspace = true
schemars = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
