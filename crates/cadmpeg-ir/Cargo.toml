# SPDX-License-Identifier: Apache-2.0
[package]
name = "cadmpeg-ir"
description = "CAD data model, validation, diffing, and codec API for cadmpeg."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/cadmpeg-ir"
keywords = ["cad", "brep", "geometry", "transcoding", "provenance"]
categories = ["data-structures", "encoding", "graphics"]

[features]
# `schema` builds the `JsonSchema` derives and `cadir_json_schema()`. No
# dependent enables it: schema readers use `CADIR_JSON_SCHEMA` and
# `DECODE_SIDECAR_JSON_SCHEMA`, the committed `schema/*.json`. The CI
# "Schema feature" step builds the derives and checks the committed files.
schema = ["dep:schemars", "cadmpeg-core/schema"]
# `schema-order` writes the committed schemas with each object's `properties`
# in declared order. It turns on serde_json's `preserve_order` for the whole
# build, which changes the order every `serde_json::Map` keeps, so only the
# `committed_schema` integration test runs under it.
schema-order = ["schema", "schemars/preserve_order"]

[dependencies]
cadmpeg-core.workspace = true
cadmpeg-derive.workspace = true
libm.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }
thiserror.workspace = true
sha2.workspace = true
memchr.workspace = true
base64.workspace = true

[dev-dependencies]
cadmpeg-core = { workspace = true, features = ["test-support"] }
proptest.workspace = true
# The hand-written-`Deserialize` census parses the wire crates' source.
syn.workspace = true
proc-macro2.workspace = true

[[example]]
name = "emit_cube"

[[test]]
name = "committed_schema"
required-features = ["schema"]

[[test]]
name = "schema_derives"
path = "tests/schema_derives/main.rs"
required-features = ["schema"]

[lints]
workspace = true
