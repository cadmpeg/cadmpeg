# SPDX-License-Identifier: Apache-2.0
[package]
name = "cadmpeg-ir"
description = "CAD data model, validation, diffing, and codec API for cadmpeg."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/cadmpeg-ir"
keywords = ["cad", "brep", "geometry", "transcoding", "provenance"]
categories = ["data-structures", "encoding", "graphics"]

[features]
# Hand-built IR fixtures for tests and doctests.
examples = []
# `schema` builds the `JsonSchema` derives. It is off by default: the
# derives are only consumed by `cadmpeg_ir::cadir_json_schema()`, and
# generating them costs 22% of this crate tree's compile time.
schema = ["dep:schemars", "cadmpeg-core/schema"]

[dependencies]
cadmpeg-core.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }
thiserror.workspace = true
sha2.workspace = true
base64.workspace = true

[dev-dependencies]
proptest.workspace = true

[[example]]
name = "emit_cube"
required-features = ["examples"]

[lints]
workspace = true
