# SPDX-License-Identifier: Apache-2.0
[package]
name = "cadmpeg"
description = "Convert and inspect native CAD files."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://github.com/cadmpeg/cadmpeg/blob/main/crates/cadmpeg/README.md"
keywords = ["cad", "converter", "step", "brep", "geometry"]
categories = ["command-line-utilities", "encoding", "graphics"]
default-run = "cadmpeg"

[[bin]]
name = "cadmpeg"
path = "src/main.rs"

[features]
# Registry ids are the feature names. `fcstd` enables the FreeCAD codec crate.
default = [
  "fcstd",
  "f3d",
  "inventor",
  "sldprt",
  "catia",
  "creo",
  "nx",
  "rhino",
  "step",
  "iges",
  "sat",
]
#
# Each id forwards to the same feature of `cadmpeg-registry`, which owns the
# codec registry and constructs the codecs for detection, inspection, and
# encoding. The CLI keeps its own optional dependency on each codec crate for
# the native validators and for the conformance suites.
fcstd = ["cadmpeg-registry/fcstd", "dep:cadmpeg-codec-freecad"]
f3d = ["cadmpeg-registry/f3d", "dep:cadmpeg-codec-f3d"]
inventor = ["cadmpeg-registry/inventor", "dep:cadmpeg-codec-inventor"]
sldprt = ["cadmpeg-registry/sldprt", "dep:cadmpeg-codec-sldprt"]
catia = ["cadmpeg-registry/catia", "dep:cadmpeg-codec-catia"]
creo = ["cadmpeg-registry/creo", "dep:cadmpeg-codec-creo"]
nx = ["cadmpeg-registry/nx", "dep:cadmpeg-codec-nx"]
rhino = ["cadmpeg-registry/rhino", "dep:cadmpeg-codec-rhino"]
step = ["cadmpeg-registry/step", "dep:cadmpeg-codec-step"]
iges = ["cadmpeg-registry/iges", "dep:cadmpeg-codec-iges"]
sat = ["cadmpeg-registry/sat", "dep:cadmpeg-codec-sat"]

[dependencies]
cadmpeg-core.workspace = true
cadmpeg-container.workspace = true
cadmpeg-ir = { workspace = true, features = ["schema"] }
cadmpeg-registry.workspace = true
cadmpeg-codec-f3d = { workspace = true, optional = true }
cadmpeg-codec-inventor = { workspace = true, optional = true }
cadmpeg-codec-freecad = { workspace = true, optional = true }
cadmpeg-codec-sldprt = { workspace = true, optional = true }
cadmpeg-codec-catia = { workspace = true, optional = true }
cadmpeg-codec-creo = { workspace = true, optional = true }
cadmpeg-codec-nx = { workspace = true, optional = true }
cadmpeg-codec-rhino = { workspace = true, optional = true }
cadmpeg-codec-iges = { workspace = true, optional = true }
cadmpeg-codec-step = { workspace = true, optional = true }
cadmpeg-codec-sat = { workspace = true, optional = true }
clap.workspace = true
anyhow.workspace = true
memchr.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
crc32fast.workspace = true
predicates.workspace = true
zip.workspace = true
# `layout_tables` parses `docs/layouts/*.toml`. The dialect registries moved to
# `cadmpeg-registry`, which embeds and parses them itself.
toml.workspace = true
# The CLI integration tests build `cadmpeg_ir::examples`; the feature keeps
# those fixtures out of the normal library build.
cadmpeg-ir = { workspace = true, features = ["examples"] }

[lints]
workspace = true
