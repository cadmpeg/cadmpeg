# Deliberately broken layout table: field `value` width disagrees with the type.
# `crates/cadmpeg/tests/layout_tables.rs` asserts the validator rejects it.
schema = 1
format = "f3d"
spec = "docs/formats/f3d.md"
endianness = "little"

[[record]]
name = "asmheader_binaryfile8"
kind = "byte"
section = "3"
anchor = "`BinaryFile8` header layout"

[[record.field]]
name = "magic"
offset = 0
type = "bytes[15]"
source = "spec"
anchor = "`0..15` | magic `ASM BinaryFile8`"
value = [0x14, 0x00]
