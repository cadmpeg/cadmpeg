# SPDX-License-Identifier: Apache-2.0
# Deliberately broken layout table: its column fields leave a hole in the card
# `crates/cadmpeg/tests/layout_tables.rs` asserts the validator rejects it.
schema = 1
format = "f3d"
spec = "docs/formats/f3d.md"

[[record]]
name = "card"
kind = "column"
section = "3"
anchor = "`BinaryFile8` header layout"
size = 20

[[record.field]]
name = "head"
columns = "1-8"
type = "text"
source = "spec"
anchor = "`0..15` | magic `ASM BinaryFile8`"

[[record.field]]
name = "tail"
columns = "13-20"
type = "text"
source = "spec"
anchor = "`0..15` | magic `ASM BinaryFile8`"
