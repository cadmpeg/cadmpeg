# Deliberately broken layout table: a slot-record field states a byte offset
# `crates/cadmpeg/tests/layout_tables.rs` asserts the validator rejects it.
schema = 1
format = "f3d"
spec = "docs/formats/f3d.md"
endianness = "little"

[[record]]
name = "plane_surface"
kind = "slot"
section = "3"
anchor = "`BinaryFile8` header layout"

[[record.field]]
name = "magic"
offset = 0
type = "bytes[15]"
source = "spec"
anchor = "`0..15` | magic `ASM BinaryFile8`"
