# Deliberately broken layout table: a byte range no field or gap covers
# `crates/cadmpeg/tests/layout_tables.rs` asserts the validator rejects it.
schema = 1
format = "f3d"
spec = "docs/formats/f3d.md"
endianness = "little"

[[record]]
name = "asmheader_binaryfile8"
kind = "byte"
section = "3"
anchor = "`BinaryFile8` header layout"

[[record.field]]
name = "magic"
offset = 0
type = "bytes[15]"
source = "spec"
anchor = "`0..15` | magic `ASM BinaryFile8`"

[[record.field]]
name = "entity_count"
offset = 31
type = "u64"
source = "spec"
anchor = "little-endian u64 entity-count word"
