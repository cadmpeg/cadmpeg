# Deliberately broken layout table: a multi-byte field resolves no endianness
# `crates/cadmpeg/tests/layout_tables.rs` asserts the validator rejects it.
schema = 1
format = "f3d"
spec = "docs/formats/f3d.md"

[[record]]
name = "asmheader_binaryfile8"
kind = "byte"
section = "3"
anchor = "`BinaryFile8` header layout"

[[record.field]]
name = "magic"
offset = 0
type = "bytes[15]"
source = "spec"
anchor = "`0..15` | magic `ASM BinaryFile8`"

[[record.field]]
name = "save_format_version"
offset = 15
type = "u32"
source = "spec"
anchor = "little-endian u32 ACIS save-format version"
