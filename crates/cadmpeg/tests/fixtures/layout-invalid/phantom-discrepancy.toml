# Deliberately broken layout table: it declares a size mismatch that does not exist
# `crates/cadmpeg/tests/layout_tables.rs` asserts the validator rejects it.
schema = 1
format = "f3d"
spec = "docs/formats/f3d.md"
endianness = "little"

[[record]]
name = "asmheader_binaryfile8"
kind = "byte"
section = "3"
anchor = "`BinaryFile8` header layout"
size = 15

[[record.field]]
name = "magic"
offset = 0
type = "bytes[15]"
source = "spec"
anchor = "`0..15` | magic `ASM BinaryFile8`"

[[record.discrepancy]]
kind = "size_mismatch"
computed = 15
declared = 15
note = "Invented on purpose: the fields close exactly at 15."
