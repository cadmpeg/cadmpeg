[alias]
# -q removes the cargo status lines and condenses the test list to one
# character per test; warnings, errors, and failure detail still print in
# full. Run with --verbose when the compile plan itself is the question.
#
# --no-fail-fast makes one run report every failing crate. Without it cargo
# stops at the first crate whose suite fails, so a gate over eleven codecs
# costs one whole suite run per failing crate to find them all.
test-fast = "test -q --workspace --lib --bins --tests --no-fail-fast"

[build]
# Linking is never incremental, and this workspace's test binaries run from
# 300MB to 1.3GB, so a full-workspace build ends in a burst of very large
# concurrent links. At the host's default job count that burst is enough to
# push the user slice past systemd-oomd's pressure threshold, which kills the
# whole terminal scope rather than the offending process. Cargo has no separate
# knob for link parallelism, so the compile fan-out is capped instead.
jobs = 6
