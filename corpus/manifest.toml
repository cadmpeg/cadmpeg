# SPDX-License-Identifier: CC0-1.0
# Public CC0 corpus fixtures.
#
# Every field is donor-supplied except `dialect`. That one is derived: the
# codec's own `inspect()` classifies the fixture's bytes and the primary
# layer's `crates/cadmpeg-registry/docs/dialects.toml` id is pinned here, the way a golden is pinned.
# A codec change that reclassifies a corpus file then fails a test instead of
# passing silently. `authoring_app_version` is the producer axis and stays
# donor-supplied; neither field is derivable from the other.
#
# Regenerate with:
#   UPDATE_CORPUS_DIALECTS=1 cargo test -p cadmpeg --test corpus_manifest
# and read the diff as a classification change.

