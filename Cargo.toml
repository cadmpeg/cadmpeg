# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
members = [
  "crates/cadmpeg",
  "crates/cadmpeg-codec-core",
  "crates/cadmpeg-container",
  "crates/cadmpeg-ir",
  "crates/cadmpeg-codec-f3d",
  "crates/cadmpeg-codec-freecad",
  "crates/cadmpeg-codec-sldprt",
  "crates/cadmpeg-codec-catia",
  "crates/cadmpeg-codec-creo",
  "crates/cadmpeg-codec-nx",
  "crates/cadmpeg-codec-rhino",
  "crates/cadmpeg-codec-iges",
  "crates/cadmpeg-codec-step",
]
# cadmpeg-fuzz is intentionally excluded: cargo-fuzz targets link libFuzzer and
# require a nightly toolchain, so keeping the crate out of the default workspace
# members lets `cargo build --workspace` / `cargo test --workspace` stay green on
# stable. Build fuzz targets explicitly with `cargo +nightly fuzz run <target>`.
exclude = ["crates/cadmpeg-fuzz"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/cadmpeg/cadmpeg"
homepage = "https://github.com/cadmpeg/cadmpeg"
rust-version = "1.88"

[workspace.dependencies]
cadmpeg-codec-core = { path = "crates/cadmpeg-codec-core", version = "0.3.1" }
cadmpeg-container = { path = "crates/cadmpeg-container", version = "0.3.1" }
cadmpeg-ir = { path = "crates/cadmpeg-ir", version = "0.3.1" }
cadmpeg-codec-f3d = { path = "crates/cadmpeg-codec-f3d", version = "0.3.1" }
cadmpeg-codec-freecad = { path = "crates/cadmpeg-codec-freecad", version = "0.3.1" }
cadmpeg-codec-sldprt = { path = "crates/cadmpeg-codec-sldprt", version = "0.3.1" }
cadmpeg-codec-catia = { path = "crates/cadmpeg-codec-catia", version = "0.3.1" }
cadmpeg-codec-creo = { path = "crates/cadmpeg-codec-creo", version = "0.3.1" }
cadmpeg-codec-nx = { path = "crates/cadmpeg-codec-nx", version = "0.3.1" }
cadmpeg-codec-rhino = { path = "crates/cadmpeg-codec-rhino", version = "0.3.1" }
cadmpeg-codec-iges = { path = "crates/cadmpeg-codec-iges", version = "0.3.1" }
cadmpeg-codec-step = { path = "crates/cadmpeg-codec-step", version = "0.3.1" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde-value = "0.7"
schemars = "1.2"
thiserror = "2"
sha2 = "0.11"
memchr = "2"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
zip = { version = "8", default-features = false, features = ["deflate-flate2", "zstd"] }
lzma-rs = "0.3"
flate2 = "1"
zstd = "0.13"
crc32fast = "1"
roxmltree = "0.21"
regex = "1.13"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
toml = "1"
encoding_rs = "0.8"

[profile.dev]
# Debug info dominates a linked test binary and the linker holds all of it.
# Leaving DWARF in the object files keeps every byte available to debuggers
# while taking it off the link path. Most of the weight is in dependency rlibs.
split-debuginfo = "unpacked"

[profile.test]
# Test failures need `file:line` in the backtrace; they do not need variable
# and type DWARF. This drops the rest.
debug = "line-tables-only"

[profile.release]
lto = "thin"
# Codecs parse untrusted files; a trapped overflow beats a wrapped offset
# that silently changes which bytes a decoder reads.
overflow-checks = true

[profile.dist]
inherits = "release"
strip = "symbols"

# Crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The codecs are wall-to-wall u32/usize/f64 conversions over file offsets and
# fixed-width records.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"

# Roundtrip tests compare decoded floats for byte-exact equality.
float_cmp = "allow"

# Decode functions are long and match-heavy, and format field names are
# near-identical.
too_many_lines = "allow"
similar_names = "allow"
match_same_arms = "allow"
single_match_else = "allow"

must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# The workspace setting stays `allow` because some encoders and decoders call
# the `clippy.toml` methods with trusted counts. Hardened decoder modules
# re-enable the lint with `#![deny(clippy::disallowed_methods)]`.
disallowed_methods = "allow"

# Restriction picks: fail loudly instead of silently panicking or shipping
# debug scaffolding. Use `expect` with a message where infallibility is a
# real invariant; `unwrap` is reserved for tests.
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
