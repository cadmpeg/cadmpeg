# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
members = [
  "crates/cadmpeg",
  "crates/cadmpeg-asm",
  "crates/cadmpeg-core",
  "crates/cadmpeg-container",
  "crates/cadmpeg-ir",
  "crates/cadmpeg-test-support",
  "crates/cadmpeg-protein",
  "crates/cadmpeg-codec-f3d",
  "crates/cadmpeg-codec-inventor",
  "crates/cadmpeg-codec-freecad",
  "crates/cadmpeg-codec-sldprt",
  "crates/cadmpeg-codec-catia",
  "crates/cadmpeg-codec-creo",
  "crates/cadmpeg-codec-nx",
  "crates/cadmpeg-codec-rhino",
  "crates/cadmpeg-codec-iges",
  "crates/cadmpeg-codec-step",
  "crates/cadmpeg-codec-sat",
]
# cadmpeg-fuzz is intentionally excluded: cargo-fuzz targets link libFuzzer and
# require a nightly toolchain, so keeping the crate out of the default workspace
# members lets `cargo build --workspace` / `cargo test --workspace` stay green on
# stable. Build fuzz targets explicitly with `cargo +nightly fuzz run <target>`.
exclude = ["crates/cadmpeg-fuzz"]

[workspace.package]
version = "0.5.5"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/cadmpeg/cadmpeg"
homepage = "https://github.com/cadmpeg/cadmpeg"
rust-version = "1.88"

[workspace.dependencies]
cadmpeg-asm = { path = "crates/cadmpeg-asm", version = "0.5.5" }
cadmpeg-core = { path = "crates/cadmpeg-core", version = "0.5.5" }
cadmpeg-container = { path = "crates/cadmpeg-container", version = "0.5.5" }
cadmpeg-ir = { path = "crates/cadmpeg-ir", version = "0.5.5" }
cadmpeg-test-support = { path = "crates/cadmpeg-test-support" }
cadmpeg-protein = { path = "crates/cadmpeg-protein", version = "0.5.5" }
cadmpeg-codec-f3d = { path = "crates/cadmpeg-codec-f3d", version = "0.5.5" }
cadmpeg-codec-inventor = { path = "crates/cadmpeg-codec-inventor", version = "0.5.5" }
cadmpeg-codec-freecad = { path = "crates/cadmpeg-codec-freecad", version = "0.5.5" }
cadmpeg-codec-sldprt = { path = "crates/cadmpeg-codec-sldprt", version = "0.5.5" }
cadmpeg-codec-catia = { path = "crates/cadmpeg-codec-catia", version = "0.5.5" }
cadmpeg-codec-creo = { path = "crates/cadmpeg-codec-creo", version = "0.5.5" }
cadmpeg-codec-nx = { path = "crates/cadmpeg-codec-nx", version = "0.5.5" }
cadmpeg-codec-rhino = { path = "crates/cadmpeg-codec-rhino", version = "0.5.5" }
cadmpeg-codec-iges = { path = "crates/cadmpeg-codec-iges", version = "0.5.5" }
cadmpeg-codec-step = { path = "crates/cadmpeg-codec-step", version = "0.5.5" }
cadmpeg-codec-sat = { path = "crates/cadmpeg-codec-sat", version = "0.5.5" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
serde-value = "0.7"
schemars = "1.2"
thiserror = "2"
sha2 = "0.11"
sha1 = "0.11"
memchr = "2"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
zip = { version = "8", default-features = false, features = ["deflate-flate2", "zstd"] }
lzma-rs = "0.3"
flate2 = "1"
zstd = "0.13"
crc32fast = "1"
roxmltree = "0.21"
hdf5-reader = { version = "0.9.1", default-features = false }
regex = "1.13"
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"
toml = "1"
encoding_rs = "0.8"
# Low-level MessagePack markers/length reads for sldprt PMI span recording.
# Do not use rmpv Value traversal there — patch_payload needs byte ranges.
rmp = "=0.8.15"

[profile.dev]
# Debug info dominates a linked test binary and the linker holds all of it.
# Leaving DWARF in the object files keeps every byte available to debuggers
# while taking it off the link path. Most of the weight is in dependency rlibs.
split-debuginfo = "unpacked"

[profile.dev.package.sha2]
opt-level = 3

[profile.test]
# Test failures need `file:line` in the backtrace; they do not need variable
# and type DWARF. This drops the rest.
debug = "line-tables-only"

[profile.release]
lto = "thin"
# Codecs parse untrusted files; a trapped overflow beats a wrapped offset
# that silently changes which bytes a decoder reads.
overflow-checks = true

[profile.dist]
inherits = "release"
strip = "symbols"

# Crates opt in with `[lints] workspace = true`.
#
# Levels live here, not on the `cargo clippy` command line. Trailing lint flags
# are part of the compilation fingerprint, so `cargo clippy` and
# `cargo clippy -- -D warnings` evict each other's cached artifacts: an editor
# that runs bare `cargo check`/`cargo clippy` and a gate that adds the flags
# then force a full re-check on every alternation. Declaring the levels in the
# manifest gives both one shared cache.
[workspace.lints.rust]
# Reproduces the `-D warnings` the gate used to pass on the command line.
# `-D warnings` resolves after individual levels, so it promotes every
# remaining warn-level lint to an error, `missing_docs` included. The gate
# already behaved that way; only the flag's location changes here.
warnings = { level = "deny", priority = -100 }
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The codecs are wall-to-wall u32/usize/f64 conversions over file offsets and
# fixed-width records.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"

# Roundtrip tests compare decoded floats for byte-exact equality.
float_cmp = "allow"

# Decode functions are long and match-heavy, and format field names are
# near-identical.
too_many_lines = "allow"
similar_names = "allow"
match_same_arms = "allow"
single_match_else = "allow"

must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# The workspace setting stays `allow` because some encoders and decoders call
# the `clippy.toml` methods with trusted counts. Hardened decoder modules
# re-enable the lint with `#![deny(clippy::disallowed_methods)]`.
disallowed_methods = "allow"

# Restriction picks: fail loudly instead of silently panicking or shipping
# debug scaffolding. Use `expect` with a message where infallibility is a
# real invariant; `unwrap` is reserved for tests.
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
