# Test priorities need nextest 0.9.91.
nextest-version = { required = "0.9.91" }

# A test that runs past 15 seconds is reported as slow, with its time, in the
# final status, so the tests that hold up the end of a run are named in the
# CI log. One that runs past 600 seconds is terminated and reported as a
# timeout with its name.
[profile.default]
slow-timeout = { period = "15s", terminate-after = 40 }

# Start the tests that CI reports as slow first, so they run beside the
# short tests instead of after them at the end of the run.
[[profile.default.overrides]]
filter = '''
    test(=corpus_manifest::corpus_specimens_pass_check)
    | test(=corpus_manifest::corpus_manifest_dialects_are_pinned_from_classification)
    | test(/^integration_tests::cc0_controller::/)
    | test(=integration_tests::nist_ftc_07::nist_ftc_07_agrees_with_its_ap242_model)
    | test(=integration_tests::nist_ctc_01_brep_agrees_with_its_step_twin)
    | test(/^integration_tests::measured_geometry::/)
    | test(/^integration_tests::unreadable_shapes::/)
    | test(=golden_tests::golden_snapshots_hold)
    | test(/^integration_tests::csg_solids::a_sphere_and_a_torus_/)
    | test(=every_read_optional_field_refuses_a_null_spelling)
    | test(/^writer::tests::leaf_sweep::every_leaf_edit_of_/)
    | test(/^writer::tests::edit_refusals::/)
'''
priority = 100
